/* ---------- FORMATEO ---------- */

const fmtEur2 = (n) => (n==null||isNaN(n)) ? '—' : new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const fmtPct = (n,d=1) => (n==null||isNaN(n)) ? '—' : new Intl.NumberFormat('es-ES',{style:'percent',minimumFractionDigits:d,maximumFractionDigits:d}).format(n);

/* ---------- DATOS DE TIPOS DE INTERÉS (OCTUBRE 2026) ----------
   Cada oferta rellena: tipo, TIN, años fijos / TIN posterior (mixtas), euríbor, diferencial, revisión,
   productos vinculados, comisión de apertura, plazo máx., LTV máx. (aportación = 100 - LTV),
   edad máx. al vencimiento y umbral de endeudamiento (0,35 = recomendación del Banco de España).
   Notas: Bankinter cobra 500 € fijos (≈0,2 % sobre 250.000 €); Pibank financia hasta 90 % del precio
   con tope 80 % de tasación (se usa 80 %); Banca March edad máx. 70; Cajamar admite hasta 80 (habitual 75). */
const RATE_PRESETS = [

  // Hipotecas Mixtas
  { value: 'sabadell_mixto', label: 'Banco Sabadell · Mixta 1,80% (3 años fijos)', tin: 1.80, type: 'mixto', fixedYears: 3, postFixedTin: 4.00, linkedAnnual: 600, euribor: 3.5, spread: 0.9, revisionMonths: 12, termYears: 30, maxLtv: 80, openingFeePct: 0, maxAge: 75, debtThreshold: 0.35 },
  { value: 'pibank_mixto', label: 'Pibank · Mixta 1,99% (4 años fijos)', tin: 1.99, type: 'mixto', fixedYears: 4, postFixedTin: 3.80, linkedAnnual: 0, euribor: 3.5, spread: 0.8, revisionMonths: 12, termYears: 35, maxLtv: 80, openingFeePct: 0, maxAge: 75, debtThreshold: 0.35 },
  { value: 'ibercaja_mixto5', label: 'Ibercaja · Mixta 2,00% (5 años fijos)', tin: 2.00, type: 'mixto', fixedYears: 5, postFixedTin: 3.80, linkedAnnual: 500, euribor: 3.5, spread: 0.9, revisionMonths: 12, termYears: 25, maxLtv: 80, openingFeePct: 0, maxAge: 75, debtThreshold: 0.35 },

  // Hipotecas Variables
  { value: 'kutxabank_variable', label: 'Kutxabank · Variable Euríbor+0,49% (1er año 2,00%)', tin: 2.00, type: 'variable', linkedAnnual: 400, euribor: 3.5, spread: 0.49, revisionMonths: 12, termYears: 30, maxLtv: 80, openingFeePct: 0, maxAge: 75, debtThreshold: 0.35 },
  { value: 'sabadell_variable', label: 'Banco Sabadell · Variable Euríbor+0,50% (1er año 1,50%)', tin: 1.50, type: 'variable', linkedAnnual: 500, euribor: 3.5, spread: 0.50, revisionMonths: 12, termYears: 30, maxLtv: 80, openingFeePct: 0, maxAge: 75, debtThreshold: 0.35 },
  { value: 'coinc_variable', label: 'Coinc · Variable Euríbor+0,50% (1er año 2,50%)', tin: 2.50, type: 'variable', linkedAnnual: 0, euribor: 3.5, spread: 0.50, revisionMonths: 12, termYears: 30, maxLtv: 80, openingFeePct: 0, maxAge: 75, debtThreshold: 0.35 },
  { value: 'bankinter_variable', label: 'Bankinter · Variable Euríbor+0,50% (3 años 2,50%)', tin: 2.50, type: 'variable', linkedAnnual: 600, euribor: 3.5, spread: 0.50, revisionMonths: 12, termYears: 30, maxLtv: 80, openingFeePct: 0.2, maxAge: 75, debtThreshold: 0.35 },
  { value: 'unicaja_variable', label: 'Unicaja · Variable Euríbor+0,55% (1er año 1,90%)', tin: 1.90, type: 'variable', linkedAnnual: 350, euribor: 3.5, spread: 0.55, revisionMonths: 12, termYears: 30, maxLtv: 80, openingFeePct: 0.15, maxAge: 75, debtThreshold: 0.35 },
];

/* ---------- MOTOR FINANCIERO ---------- */
const monthlyPayment = (principal, annualRatePct, months) => {
  if (months <= 0 || principal <= 0) return 0;
  const r = annualRatePct / 100 / 12;
  if (r === 0) return principal / months;
  const f = Math.pow(1 + r, months);
  return (principal * r * f) / (f - 1);
};

const monthsForPayment = (principal, annualRatePct, targetPayment) => {
  if (principal <= 0 || targetPayment <= 0) return 0;
  const r = annualRatePct / 100 / 12;
  if (r === 0) return Math.ceil(principal / targetPayment);
  if (targetPayment <= principal * r) return Infinity;
  const x = 1 - (principal * r) / targetPayment;
  if (x <= 0) return Infinity;
  return Math.ceil(-Math.log(x) / Math.log(1 + r));
};

const amortizationSchedule = (principal, annualRatePct, months) => {
  const payment = monthlyPayment(principal, annualRatePct, months);
  const r = annualRatePct / 100 / 12;
  let balance = principal;
  const rows = [];
  for (let m = 1; m <= months; m++) {
    const interest = balance * r;
    const principalPart = Math.min(payment - interest, balance);
    balance = Math.max(0, balance - principalPart);
    rows.push({ month: m, payment, interest, principal: principalPart, balance });
  }
  return rows;
};

const totalInterest = (rows) => rows.reduce((s, r) => s + r.interest, 0);

const buildMortgageSchedule = (mortgageAmount, annualRatePct, baseMonths, amortizations) => {
  const r = annualRatePct / 100 / 12;
  let months = baseMonths;
  let basePayment = monthlyPayment(mortgageAmount, annualRatePct, baseMonths);

  let schedule = [];
  let balance = mortgageAmount;
  for (let m = 1; m <= months; m++) {
    const interest = balance * r;
    const principalPart = Math.min(basePayment - interest, balance);
    balance = Math.max(0, balance - principalPart);
    schedule.push({ month: m, payment: basePayment, interest, principal: principalPart, balance });
    if (balance < 0.01) break;
  }

  if (amortizations && amortizations.length > 0) {
    const active = amortizations
      .filter(a => a.amount > 0 && a.month > 0 && a.mode !== 'none')
      .sort((a, b) => a.month - b.month);

    for (const a of active) {
      const atMonth = a.month;
      if (atMonth > schedule.length) continue;

      const head = schedule.slice(0, atMonth).map(row => ({ ...row }));
      const lastBefore = head[head.length - 1];
      const newBalance = Math.max(0, lastBefore.balance - a.amount);
      
      const amortRow = {
        month: atMonth,
        payment: lastBefore.payment,
        interest: lastBefore.interest,
        principal: lastBefore.principal + (lastBefore.balance - newBalance),
        balance: newBalance,
        isAmortization: true,
        amortizationAmount: a.amount,
      };
      
      let currentSchedule = [...head.slice(0, -1), amortRow];
      if (newBalance <= 0) { schedule = currentSchedule; continue; }

      if (a.mode === 'reduce_cuota') {
        let remainingMonths = Math.max(1, schedule.length - atMonth);
        let newPayment = monthlyPayment(newBalance, annualRatePct, remainingMonths);
        
        let bal = newBalance;
        for (let i = 1; i <= remainingMonths; i++) {
          const interest = bal * r;
          const pp = Math.min(newPayment - interest, bal);
          bal = Math.max(0, bal - pp);
          currentSchedule.push({ month: atMonth + i, payment: newPayment, interest, principal: pp, balance: bal });
          if (bal < 0.01) break;
        }
      } else if (a.mode === 'reduce_plazo') {
        const oldPayment = lastBefore.payment;
        let bal = newBalance;
        let mth = atMonth + 1;
        while (bal > 0.01 && mth <= atMonth + 12 * 60) {
          const interest = bal * r;
          const pp = Math.min(oldPayment - interest, bal);
          bal = Math.max(0, bal - pp);
          currentSchedule.push({ month: mth, payment: oldPayment, interest, principal: pp, balance: bal });
          mth++;
        }
      }
      schedule = currentSchedule;
    }
  }
  return schedule;
};

const ITP_BY_REGION = {
  'Andalucía': 7, 'Aragón': 8, 'Asturias': 8, 'Baleares': 8, 'Canarias': 6.5,
  'Cantabria': 10, 'Castilla-La Mancha': 9, 'Castilla y León': 8, 'Cataluña': 10,
  'Extremadura': 8, 'Galicia': 8, 'La Rioja': 7, 'Madrid': 6, 'Murcia': 8,
  'Navarra': 6, 'País Vasco': 4, 'Comunidad Valenciana': 9, 'Ceuta': 6, 'Melilla': 6
};
const REGIONS = Object.keys(ITP_BY_REGION);

const computeAcquisitionCosts = (params) => {
  const { price, isNew, region, itpPct, ivaPct, ajdPct, notary, registry, appraisal, gestoria, agencyFee, otherCosts, useManual } = params;
  const itp = !isNew ? price * (useManual ? itpPct : (ITP_BY_REGION[region] ?? 8)) / 100 : 0;
  const iva = isNew ? price * (useManual ? ivaPct : 10) / 100 : 0;
  const ajd = isNew ? price * (useManual ? ajdPct : 1.5) / 100 : 0;
  const fixed = (notary||0)+(registry||0)+(appraisal||0)+(gestoria||0);
  const agency = agencyFee || 0;
  const other = otherCosts || 0;
  return { itp, iva, ajd, fixed, agency, other, total: itp+iva+ajd+fixed+agency+other };
};

const computeComputableIncome = (buyers) => buyers.reduce((sum, b) => {
  const salary = (b.monthlyNetSalary||0) * ((b.computablePct?.salary ?? 100)/100);
  const variable = (b.variableIncome||0) * ((b.computablePct?.variable ?? 80)/100);
  const rental = (b.rentalIncome||0) * ((b.computablePct?.rental ?? 80)/100);
  const other = (b.otherIncome||0) * ((b.computablePct?.other ?? 100)/100);
  return sum + salary + variable + rental + other;
}, 0);

const computeRawIncome = (buyers) => buyers.reduce((s, b) =>
  s + (b.monthlyNetSalary||0) + (b.variableIncome||0) + (b.rentalIncome||0) + (b.otherIncome||0), 0);

const computeLiquidSavings = (s) => {
  if (!s) return 0;
  let total = (s.cash||0)+(s.deposits||0)+(s.funds||0)+(s.stocks||0)+(s.crypto||0)+(s.otherLiquid||0);
  if (s.pensionAvailable) total += (s.pensionPlans||0);
  return total;
};
const computeTotalPatrimony = (s) => {
  if (!s) return 0;
  return (s.cash||0)+(s.deposits||0)+(s.funds||0)+(s.stocks||0)+(s.crypto||0)+(s.pensionPlans||0)+(s.otherLiquid||0)+(s.otherIlliquid||0);
};

const aggregateSavings = (buyers) => {
  const keys = ['cash','deposits','funds','stocks','crypto','pensionPlans','otherLiquid','otherIlliquid','willingToUse','emergencyReserve'];
  const agg = {};
  keys.forEach(k => { agg[k] = buyers.reduce((s, b) => s + (Number(b.savings?.[k]) || 0), 0); });
  agg.pensionAvailable = buyers.some(b => b.savings?.pensionAvailable);
  return agg;
};

const findDuplicateMortgageDebts = (buyers, debts) => {
  const duplicates = [];
  const properties = [];
  buyers.forEach(b => (b.properties || []).forEach(p => {
    if ((Number(p.mortgageOutstanding) || 0) > 0) {
      properties.push({ buyerId: b.id, buyerName: b.name, propertyId: p.id, propertyAlias: p.alias, amount: Number(p.mortgageOutstanding) });
    }
  }));
  debts.forEach(d => {
    if (d.type !== 'hipoteca') return;
    const amt = Number(d.outstanding) || 0;
    if (amt <= 0) return;
    const match = properties.find(p => Math.abs(p.amount - amt) < 1);
    if (match) {
      duplicates.push({ debtId: d.id, debtAmount: amt, propertyId: match.propertyId, propertyAlias: match.propertyAlias, buyerName: match.buyerName });
    }
  });
  return duplicates;
};

const summarizeProperties = (buyers) => {
  const all = [];
  buyers.forEach(b => {
    (b.properties || []).forEach(p => {
      const ownerships = (p.ownerships && p.ownerships.length > 0)
        ? p.ownerships
        : [{ buyerId: b.id, pct: 100 }];
      all.push({ ...p, ownerships, _declaredBy: b.id });
    });
  });

  const enriched = all.map(p => {
    const totalPct = p.ownerships.reduce((s, o) => s + (Number(o.pct) || 0), 0);
    const netEquity = Math.max(0, (Number(p.marketValue)||0) - (Number(p.mortgageOutstanding)||0));
    const grossRent = Number(p.netRentalIncome) || 0;
    const computablePct = p.rentalComputablePct != null ? Number(p.rentalComputablePct) : 80;
    const expenses = Number(p.rentalMonthlyExpenses) || 0;
    const computableRent = grossRent * (computablePct / 100);
    const netComputableRent = Math.max(0, computableRent - expenses);

    const perOwner = p.ownerships.map(o => {
      const pct = totalPct > 0 ? (Number(o.pct)||0) / totalPct : 0;
      return {
        buyerId: o.buyerId,
        pct,
        netEquityShare: netEquity * pct,
        collateralShare: p.usedAsCollateral && (p.collateralBuyerId === o.buyerId || !p.collateralBuyerId)
          ? (Number(p.collateralValue)||0) * pct
          : (p.usedAsCollateral && p.collateralBuyerId === o.buyerId ? Number(p.collateralValue)||0 : 0),
        rentalShare: netComputableRent * pct,
        saleNetShare: Math.max(0,
          (Number(p.sellPrice) || Number(p.marketValue) || 0)
          - (Number(p.sellCosts)||0) - (Number(p.sellTaxes)||0)
          - (Number(p.mortgageOutstanding)||0)
        ) * pct,
      };
    });

    let collateralAttributed = null;
    if (p.usedAsCollateral && p.collateralBuyerId) {
      collateralAttributed = { buyerId: p.collateralBuyerId, amount: Number(p.collateralValue)||0 };
    }

    const saleNet = Math.max(0,
      (Number(p.sellPrice) || Number(p.marketValue) || 0)
      - (Number(p.sellCosts)||0) - (Number(p.sellTaxes)||0)
      - (Number(p.mortgageOutstanding)||0)
    );

    return {
      ...p, totalPct, netEquity, perOwner, collateralAttributed, saleNet,
      grossRent, computablePct, expenses, computableRent, netComputableRent,
    };
  });

  const totalMarketValue = enriched.reduce((s, p) => s + (Number(p.marketValue)||0), 0);
  const totalMortgageOutstanding = enriched.reduce((s, p) => s + (Number(p.mortgageOutstanding)||0), 0);
  const totalNetEquity = enriched.reduce((s, p) => s + p.netEquity, 0);
  const collaterals = enriched.filter(p => p.usedAsCollateral);
  const totalCollateralValue = collaterals.reduce((s, p) => s + (Number(p.collateralValue)||0), 0);

  const toSellBefore = enriched.filter(p => p.planToSell === 'sell_before');
  const liquidFromSalesBefore = toSellBefore.reduce((s, p) => s + p.saleNet, 0);

  const toSellAfter = enriched.filter(p => p.planToSell === 'sell_after');
  const netFromSalesAfter = toSellAfter.reduce((s, p) => s + p.saleNet, 0);

  const amortizations = toSellAfter.map(p => {
    const pct = Number(p.sellAmortizePct ?? 100) / 100;
    return {
      propertyId: p.id,
      propertyAlias: p.alias,
      month: Number(p.sellMonth) || 24,
      totalNet: p.saleNet,
      amount: p.saleNet * pct,
      keep: p.saleNet * (1 - pct),
      mode: p.sellAmortizeMode || 'reduce_cuota',
      pct: Number(p.sellAmortizePct ?? 100),
    };
  });

  const keptProperties = enriched.filter(p => p.planToSell === 'keep');
  const rentalNetComputableMonthly = keptProperties.reduce((s, p) => s + p.netComputableRent, 0);
  const rentalGrossMonthly = keptProperties.reduce((s, p) => s + p.grossRent, 0);
  const propertyMortgagePayments = enriched.reduce((s, p) => s + (Number(p.mortgageMonthlyPayment) || 0), 0);

  return {
    all: enriched, totalMarketValue, totalMortgageOutstanding, totalNetEquity,
    collaterals, totalCollateralValue,
    toSellBefore, liquidFromSalesBefore,
    toSellAfter, netFromSalesAfter, amortizations,
    keptProperties, rentalNetComputableMonthly, rentalGrossMonthly, propertyMortgagePayments
  };
};

const computeDebtTotalRaw = (debts) => debts.reduce((s, d) => s + (d.monthlyPayment||0), 0);
const computeDebtTotal = (debts, buyers) => {
  const dupes = findDuplicateMortgageDebts(buyers, debts);
  const dupeIds = new Set(dupes.map(d => d.debtId));
  return debts.reduce((s, d) => s + (dupeIds.has(d.id) ? 0 : (d.monthlyPayment||0)), 0);
};
const computeMonthlyExpenses = (e) => Object.values(e).reduce((s, v) => s + (Number(v)||0), 0);

const ageAtMaturity = (birthDateISO, termYears) => {
  if (!birthDateISO) return null;
  const birth = new Date(birthDateISO);
  if (isNaN(birth.getTime())) return null;
  return (Date.now() - birth.getTime()) / (365.25 * 24 * 3600 * 1000) + termYears;
};

const evaluateOperation = (state, override = {}) => {
  const price = override.price ?? state.property.price;
  const termYears = override.termYears ?? state.mortgage.termYears;
  const tin = override.tin ?? state.mortgage.tin;
  const { buyers, debts, monthlyExpenses, mortgage: m, tax, property } = state;
  const savings = aggregateSavings(buyers);
  const props = summarizeProperties(buyers);

  const months = termYears * 12;
  const downPaymentPct = override.downPaymentPct ?? m.downPaymentPct;
  const maxLtv = override.maxLtv ?? m.maxLtv;

  const acq = computeAcquisitionCosts({
    price, isNew: property.isNew, region: property.region,
    itpPct: tax.itpPct, ivaPct: tax.ivaPct, ajdPct: tax.ajdPct,
    notary: tax.notary, registry: tax.registry, appraisal: tax.appraisal, gestoria: tax.gestoria,
    agencyFee: property.agencyFee, otherCosts: property.otherInitialCosts,
    useManual: tax.mode === 'manual'
  });

  const reforms = property.reforms || 0;
  const furniture = property.furniture || 0;
  const anexos = (property.garagePrice||0) + (property.storagePrice||0);
  const totalPrice = price + anexos;

  const maxMortgageByLtv = totalPrice * (maxLtv / 100);
  const desiredDownPayment = totalPrice * (downPaymentPct / 100);
  const desiredMortgage = totalPrice - desiredDownPayment;
  const mortgageAmount = Math.max(0, Math.min(desiredMortgage, maxMortgageByLtv));
  const downPaymentReal = totalPrice - mortgageAmount;
  const effectiveLtv = totalPrice > 0 ? mortgageAmount / totalPrice : 0;
  const ltvCapped = desiredMortgage > maxMortgageByLtv + 0.01;

  const openingFee = mortgageAmount * (m.openingFeePct || 0) / 100;
  const linkedAnnual = m.linkedProductsAnnual || 0;

  const liquidSavings = computeLiquidSavings(savings);
  const willingToUse = savings.willingToUse;
  const baseAvailable = (willingToUse > 0) ? Math.min(liquidSavings, willingToUse) : liquidSavings;
  const available = baseAvailable + props.liquidFromSalesBefore;

  const acquisitionCosts = downPaymentReal + acq.total + reforms + furniture + openingFee;
  const emergencyReserve = savings.emergencyReserve || 0;
  const totalNeeded = acquisitionCosts;
  const totalRequired = acquisitionCosts + emergencyReserve;
  const liquidityGap = totalRequired - available;
  const liquidityGapWithoutReserve = totalNeeded - available;

  const amortizations = props.amortizations || [];

  const baseSchedule = amortizationSchedule(mortgageAmount, tin, months);
  const basePayment = monthlyPayment(mortgageAmount, tin, months);
  const baseInterestTotal = totalInterest(baseSchedule);

  const schedule = buildMortgageSchedule(mortgageAmount, tin, months, amortizations);
  
  const interestTotal = totalInterest(schedule);
  const firstRow = schedule[0] || { payment: basePayment };
  const effectivePayment = firstRow.payment;
  const effectiveMonths = schedule.length;
  const effectiveYears = effectiveMonths / 12;

  const firstAmort = amortizations.filter(a => a.amount > 0 && a.mode === 'reduce_cuota').sort((a, b) => a.month - b.month)[0];
  let paymentAfterFirstAmort = effectivePayment;
  if (firstAmort) {
    const row = schedule.find(rw => rw.month === firstAmort.month + 1);
    if (row) paymentAfterFirstAmort = row.payment;
  }

  const totalAmortizedBySales = amortizations.reduce((s, a) => s + (a.mode === 'none' ? 0 : a.amount), 0);
  const totalKeptFromSales = amortizations.reduce((s, a) => s + (a.mode === 'none' ? 0 : a.keep), 0);

  const salaryIncomeComputable = computeComputableIncome(buyers);
  const rentalIncomeComputable = props.rentalNetComputableMonthly;
  const computableIncome = salaryIncomeComputable + rentalIncomeComputable;
  const rawIncome = computeRawIncome(buyers) + props.rentalGrossMonthly;

  const existingDebtDebtsOnly = computeDebtTotal(debts, buyers);
  const existingDebtPropertiesOnly = props.propertyMortgagePayments;
  const existingDebt = existingDebtDebtsOnly + existingDebtPropertiesOnly;

  const duplicateDebts = findDuplicateMortgageDebts(buyers, debts);

  const monthlyExpensesTotal = computeMonthlyExpenses(monthlyExpenses);

  const ratioBefore = computableIncome > 0 ? existingDebt / computableIncome : 0;
  const totalDebtAfter = existingDebt + effectivePayment;
  const ratioAfter = computableIncome > 0 ? totalDebtAfter / computableIncome : 0;
  const monthlyMargin = computableIncome - totalDebtAfter - monthlyExpensesTotal - (linkedAnnual / 12);

  const maxAge = m.maxAgeAtMaturity || 75;
  const agesAtMat = buyers.map(b => ageAtMaturity(b.birthDate, effectiveYears)).filter(x => x !== null);
  const ageOk = agesAtMat.length === 0 || agesAtMat.every(a => a <= maxAge);
  const maxAgeReached = agesAtMat.length ? Math.max(...agesAtMat) : null;

  const threshold = m.debtThreshold ?? 0.35;
  const ratioOk = ratioAfter <= threshold;
  const liquidityOk = liquidityGap <= 0;
  const liquidityOkWithoutReserve = liquidityGapWithoutReserve <= 0;
  const ltvOk = !ltvCapped;
  const allOk = ratioOk && liquidityOkWithoutReserve && ltvOk && ageOk;

  const totalCollateralCoverage = totalPrice + props.totalCollateralValue;
  const collateralCoverageRatio = mortgageAmount > 0 ? totalCollateralCoverage / mortgageAmount : 0;

  const reasons = [];
  if (!ratioOk) reasons.push(`Ratio de endeudamiento ${fmtPct(ratioAfter)} > umbral ${fmtPct(threshold)}`);
  if (!liquidityOkWithoutReserve) reasons.push(`Faltan ${fmtEur(-liquidityGapWithoutReserve)} para cubrir la entrada y gastos`);
  else if (!liquidityOk) reasons.push(`Faltan ${fmtEur(-liquidityGap)} para cubrir gastos + reserva (puedes reducir reserva)`);
  if (!ltvOk) reasons.push(`LTV deseado supera el máximo del ${maxLtv}%`);
  if (!ageOk) reasons.push(`Edad al vencimiento ${maxAgeReached ? maxAgeReached.toFixed(1) : '?'} años > ${maxAge}`);
  if (duplicateDebts.length > 0) reasons.push(`⚠️ ${duplicateDebts.length} deuda(s) duplicada(s) con hipotecas de inmuebles ignoradas`);

  let verdict, verdictLabel, verdictColor;
  if (!computableIncome || !price) {
    verdict = 'insufficient'; verdictLabel = 'Datos insuficientes'; verdictColor = 'slate';
  } else if (allOk && monthlyMargin > computableIncome * 0.10) {
    verdict = 'viable'; verdictLabel = 'Viable según criterios configurados'; verdictColor = 'emerald';
  } else if (allOk) {
    verdict = 'conditional'; verdictLabel = 'Viable con margen reducido'; verdictColor = 'amber';
  } else if (ratioOk && liquidityOkWithoutReserve && !liquidityOk) {
    verdict = 'conditional'; verdictLabel = 'Viable si reduces la reserva de emergencia'; verdictColor = 'amber';
  } else if (ratioOk && !liquidityOkWithoutReserve) {
    verdict = 'conditional'; verdictLabel = 'Viable si se resuelve la liquidez'; verdictColor = 'amber';
  } else {
    verdict = 'not_viable'; verdictLabel = 'No viable con los datos actuales'; verdictColor = 'red';
  }

  return {
    price, totalPrice, anexos, mortgageAmount,
    downPayment: downPaymentReal, downPaymentDesired: desiredDownPayment,
    effectiveLtv, ltvCapped,
    acq, reforms, furniture, openingFee,
    acquisitionCosts, emergencyReserve,
    totalNeeded, totalRequired,
    available, liquidityGap, liquidityGapWithoutReserve,
    liquidSavings, baseAvailable, liquidFromSalesBefore: props.liquidFromSalesBefore,
    payment: effectivePayment, paymentAfterFirstAmort, basePayment,
    schedule, baseSchedule, interestTotal, baseInterestTotal,
    months, effectiveMonths, effectiveYears, tin, maxLtv,
    amortizations, totalAmortizedBySales, totalKeptFromSales,
    salaryIncomeComputable, rentalIncomeComputable,
    computableIncome, rawIncome,
    existingDebt, existingDebtDebtsOnly, existingDebtPropertiesOnly,
    duplicateDebts,
    monthlyExpenses: monthlyExpensesTotal, totalDebtAfter,
    ratioBefore, ratioAfter, monthlyMargin, threshold, linkedAnnual,
    ageOk, maxAgeReached, maxAge, ratioOk, liquidityOk, liquidityOkWithoutReserve, ltvOk, allOk,
    verdict, verdictLabel, verdictColor, reasons,
    ltv: effectiveLtv,
    aggregateSavings: savings,
    properties: props,
    netFromSalesAfter: props.netFromSalesAfter,
    totalCollateralCoverage, collateralCoverageRatio
  };
};

const computeMaxPrice = (state, binding) => {
  const evaluate = (p) => {
    if (p <= 0) return false;
    const r = evaluateOperation(state, { price: p });
    if (binding === 'savings') return r.liquidityGapWithoutReserve <= 0;
    if (binding === 'income') return r.ratioAfter <= r.threshold;
    if (binding === 'ltv') return !r.ltvCapped;
    if (binding === 'age') return r.ageOk;
    return r.allOk;
  };
  if (!evaluate(10000)) return 0;
  let lo = 10000, hi = 5000000;
  if (evaluate(hi)) return hi;
  while (hi - lo > 500) {
    const mid = (lo + hi) / 2;
    if (evaluate(mid)) lo = mid; else hi = mid;
  }
  return Math.floor(lo);
};

const DonutChart = ({ data, colors, size=200 }) => {
  const total = data.reduce((s, d) => s + Math.max(0, d.value), 0);
  if (total <= 0) return <div className="text-sm text-slate-500 p-4">Sin datos</div>;
  const cx = size/2, cy = size/2;
  const R = size/2 - 10, r = R * 0.55;
  let angle = -Math.PI/2;
  const slices = data.map((d, i) => {
    const val = Math.max(0, d.value);
    const frac = val / total;
    const a0 = angle, a1 = angle + frac * Math.PI * 2;
    angle = a1;
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0);
    const x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    const xi1 = cx + r * Math.cos(a1), yi1 = cy + r * Math.sin(a1);
    const xi0 = cx + r * Math.cos(a0), yi0 = cy + r * Math.sin(a0);
    const path = `M ${x0} ${y0} A ${R} ${R} 0 ${large} 1 ${x1} ${y1} L ${xi1} ${yi1} A ${r} ${r} 0 ${large} 0 ${xi0} ${yi0} Z`;
    return { path, color: colors[i % colors.length], name: d.name, value: val, frac };
  });
  return (
    <div>
      <svg viewBox={`0 0 ${size} ${size}`} width="100%" style={{maxWidth: size}}>
        {slices.map((s, i) => <path key={i} d={s.path} fill={s.color} stroke="white" strokeWidth="1" />)}
      </svg>
      <div className="mt-3 space-y-1">
        {slices.map((s, i) => (
          <div key={i} className="flex items-center justify-between text-xs">
            <div className="flex items-center gap-2">
              <span className="w-3 h-3 rounded-sm" style={{background: s.color}}></span>
              <span>{s.name}</span>
            </div>
            <span className="font-medium">{fmtEur(s.value)} · {fmtPct(s.frac, 0)}</span>
          </div>
        ))}
      </div>
    </div>
  );
};

const AreaChartSVG = ({ data, height=240, amortizationEvents = [] }) => {
  const W = 600, H = height, P = { t: 30, r: 20, b: 30, l: 80 };
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const maxY = Math.max(...data.map(d => d.balance), 1);
  const x = i => P.l + (i / Math.max(1, data.length - 1)) * iw;
  const y = v => P.t + ih - (v / maxY) * ih;
  const path = data.map((d, i) => `${i===0?'M':'L'} ${x(i)} ${y(d.balance)}`).join(' ');
  const area = `${path} L ${x(data.length-1)} ${P.t+ih} L ${x(0)} ${P.t+ih} Z`;
  const ticks = 4;
  const eventYears = new Set();
  amortizationEvents.forEach(a => { if (a.amount > 0 && a.mode !== 'none' && a.month > 0) eventYears.add(Math.ceil(a.month / 12)); });
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{height}}>
      {[...Array(ticks+1)].map((_, i) => {
        const v = (maxY / ticks) * i; const yy = y(v);
        return (
          <g key={i}>
            <line x1={P.l} x2={W-P.r} y1={yy} y2={yy} stroke="#e2e8f0" strokeDasharray="3 3" />
            <text x={P.l-6} y={yy+4} fontSize="10" fill="#94a3b8" textAnchor="end">{fmtEur(v)}</text>
          </g>
        );
      })}
      <path d={area} fill="#c7d2fe" opacity="0.6" />
      <path d={path} fill="none" stroke="#4f46e5" strokeWidth="2" />
      {[...eventYears].map((yr) => {
        const idx = data.findIndex(d => d.year === yr);
        if (idx < 0) return null;
        return (
          <g key={yr}>
            <line x1={x(idx)} x2={x(idx)} y1={P.t} y2={P.t+ih} stroke="#f59e0b" strokeWidth="2" strokeDasharray="4 4" />
            <text x={x(idx)} y={P.t - 10} fontSize="10" fill="#f59e0b" textAnchor="middle">Amort.</text>
          </g>
        );
      })}
      {data.filter((_,i) => i % Math.max(1, Math.ceil(data.length/6)) === 0 || i === data.length-1).map((d, k) => {
        const i = data.indexOf(d);
        return <text key={k} x={x(i)} y={H-10} fontSize="10" fill="#94a3b8" textAnchor="middle">{d.year}</text>;
      })}
    </svg>
  );
};

const StackedBarChart = ({ data, height=260 }) => {
  const W = 600, H = height, P = { t: 20, r: 20, b: 30, l: 80 };
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const totals = data.map(d => d.interest + d.principal);
  const maxY = Math.max(...totals, 1);
  const bw = iw / data.length * 0.75;
  const y = v => P.t + ih - (v / maxY) * ih;
  const ticks = 4;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{height}}>
      {[...Array(ticks+1)].map((_, i) => {
        const v = (maxY / ticks) * i; const yy = y(v);
        return (
          <g key={i}>
            <line x1={P.l} x2={W-P.r} y1={yy} y2={yy} stroke="#e2e8f0" strokeDasharray="3 3" />
            <text x={P.l-6} y={yy+4} fontSize="10" fill="#94a3b8" textAnchor="end">{fmtEur(v)}</text>
          </g>
        );
      })}
      {data.map((d, i) => {
        const cx = P.l + (i + 0.5) * (iw / data.length);
        const hInt = (d.interest / maxY) * ih;
        const hPrin = (d.principal / maxY) * ih;
        const yInt = P.t + ih - hPrin;
        const yPrin = P.t + ih - hPrin - hInt;
        return (
          <g key={i}>
            <rect x={cx - bw/2} y={yInt} width={bw} height={hPrin} fill="#10b981" />
            <rect x={cx - bw/2} y={yPrin} width={bw} height={hInt} fill="#ef4444" />
          </g>
        );
      })}
      {data.filter((_,i) => i % Math.ceil(data.length/6) === 0 || i === data.length-1).map((d, k) => {
        const i = data.indexOf(d);
        const cx = P.l + (i + 0.5) * (iw / data.length);
        return <text key={k} x={cx} y={H-10} fontSize="10" fill="#94a3b8" textAnchor="middle">{d.year}</text>;
      })}
      <g transform={`translate(${P.l}, 4)`}>
        <rect x="0" y="0" width="10" height="10" fill="#10b981"/><text x="14" y="9" fontSize="10" fill="#64748b">Capital</text>
        <rect x="70" y="0" width="10" height="10" fill="#ef4444"/><text x="84" y="9" fontSize="10" fill="#64748b">Intereses</text>
      </g>
    </svg>
  );
};

const HBarChart = ({ data, height=200 }) => {
  const filtered = data.filter(d => d.value > 0 && d.value < 4999999);
  const max = Math.max(...filtered.map(d => d.value), 1);
  return (
    <div className="space-y-3" style={{minHeight: height}}>

        <div key={i}>
          <div className="flex justify-between text-xs mb-1">

const PropertiesSection = ({ buyers, setBuyers, duplicateDebts, onRemoveDuplicateDebt }) => {
  const addProperty = (ownerBuyerId) => {
    setBuyers(prev => prev.map(b => b.id === ownerBuyerId
      ? { ...b, properties: [...(b.properties||[]), emptyProperty(ownerBuyerId)] }
      : b));
  };
  const updateProperty = (propId, patch) => {
    setBuyers(prev => prev.map(b => ({
      ...b,
      properties: (b.properties||[]).map(p => p.id === propId ? { ...p, ...patch } : p)
    })));
  };
  const removeProperty = (ownerBuyerId, propId) => {
    setBuyers(prev => prev.map(b => b.id === ownerBuyerId
      ? { ...b, properties: (b.properties||[]).filter(p => p.id !== propId) }
      : b));
  };
  const addOwner = (propId, buyerId) => {
    setBuyers(prev => {
      let prop = null;
      prev.forEach(b => (b.properties||[]).forEach(p => { if (p.id === propId) prop = p; }));
      if (!prop) return prev;
      if ((prop.ownerships||[]).some(o => o.buyerId === buyerId)) return prev;
      const newOwnerships = [...(prop.ownerships||[]), { buyerId, pct: 0 }];
      return prev.map(b => ({
        ...b,
        properties: (b.properties||[]).map(p => p.id === propId ? { ...p, ownerships: newOwnerships } : p)
      }));
    });
  };
  const updateOwnerPct = (propId, buyerId, pct) => {
    setBuyers(prev => prev.map(b => ({
      ...b,
      properties: (b.properties||[]).map(p => p.id === propId
        ? { ...p, ownerships: (p.ownerships||[]).map(o => o.buyerId === buyerId ? { ...o, pct } : o) }
        : p)
    })));
  };
  const removeOwner = (propId, buyerId) => {
    setBuyers(prev => prev.map(b => ({
      ...b,
      properties: (b.properties||[]).map(p => {
        if (p.id !== propId) return p;
        const filtered = (p.ownerships||[]).filter(o => o.buyerId !== buyerId);
        return { ...p, ownerships: filtered.length > 0 ? filtered : [{ buyerId: b.id, pct: 100 }] };
      })
    })));
  };

  const props = summarizeProperties(buyers);
  const buyerName = (id) => buyers.find(b => b.id === id)?.name || '—';

  return (
    <div>
      <h2 className="text-xl font-semibold text-slate-900 dark:text-white mb-1">Inmuebles en propiedad</h2>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-6">Declara inmuebles. Pueden estar alquilados, en copropiedad o venderse.</p>

      {duplicateDebts && duplicateDebts.length > 0 && (
        <Card className="p-4 mb-6 bg-amber-50 dark:bg-amber-900/20 border-amber-200 dark:border-amber-800 no-print">
          <div className="text-sm text-amber-800 dark:text-amber-200">
            <strong>⚠️ Duplicidad detectada:</strong> {duplicateDebts.length} deuda(s) de tipo "hipoteca" coincide con la hipoteca de un inmueble. Se ignora en el ratio. Puedes eliminarla:
            <div className="mt-2 space-y-1">
              {duplicateDebts.map((d, i) => (
                <div key={i} className="flex flex-wrap items-center justify-between gap-2 text-xs bg-white/50 dark:bg-slate-900/40 px-3 py-2 rounded">
                  <span>Inmueble: <strong>{d.propertyAlias}</strong> ({d.buyerName}) — {fmtEur(d.debtAmount)}</span>

                </div>
              ))}
            </div>
          </div>
        </Card>
      )}

      <Card className="p-5 mb-6 bg-brand-50/50 dark:bg-brand-900/10 border-brand-200 dark:border-brand-800 print-avoid-break">
        <h3 className="font-semibold text-slate-900 dark:text-white mb-3">Resumen conjunto</h3>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div>
            <div className="text-xs uppercase text-slate-500 font-medium">Valor de mercado</div>
            <div className="text-lg font-bold text-slate-900 dark:text-white">{fmtEur(props.totalMarketValue)}</div>
          </div>
          <div>
            <div className="text-xs uppercase text-slate-500 font-medium">Hipotecas pendientes</div>
            <div className="text-lg font-bold text-red-600 dark:text-red-400">{fmtEur(props.totalMortgageOutstanding)}</div>
          </div>
          <div>
            <div className="text-xs uppercase text-slate-500 font-medium">Patrimonio neto</div>
            <div className="text-lg font-bold text-emerald-600 dark:text-emerald-400">{fmtEur(props.totalNetEquity)}</div>
          </div>
          <div>
            <div className="text-xs uppercase text-slate-500 font-medium">Renta neta computable</div>
            <div className="text-lg font-bold text-brand-600 dark:text-brand-400">{fmtEur(props.rentalNetComputableMonthly)}<span className="text-xs font-normal">/mes</span></div>
          </div>
        </div>
      </Card>

      {buyers.map((b, i) => (
        <Card key={b.id} className="p-5 mb-4">
          <div className="flex items-center justify-between mb-4">
            <h3 className="font-semibold text-slate-900 dark:text-white">
              Comprador {i+1} · <span className="text-brand-600 dark:text-brand-400">{b.name}</span>
            </h3>
            <button className="px-3 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-xs font-medium no-print"
              onClick={() => addProperty(b.id)}>+ Añadir inmueble</button>
          </div>

          {(b.properties||[]).length === 0 ? (
            <p className="text-sm text-slate-500">Sin inmuebles declarados por este comprador.</p>
          ) : (
            <div className="space-y-4">
              {(b.properties||[]).map((p, j) => {
                const ownerships = p.ownerships && p.ownerships.length > 0 ? p.ownerships : [{ buyerId: b.id, pct: 100 }];
                const totalPct = ownerships.reduce((s, o) => s + (Number(o.pct)||0), 0);
                const netEquity = Math.max(0, (Number(p.marketValue)||0) - (Number(p.mortgageOutstanding)||0));
                const netSaleAfter = Math.max(0, (Number(p.sellPrice)||0) - (Number(p.sellCosts)||0) - (Number(p.sellTaxes)||0) - (Number(p.mortgageOutstanding)||0));
                const isShared = ownerships.length > 1;
                const buyerIdsAvailable = buyers.map(bb => ({ id: bb.id, name: bb.name })).filter(x => !ownerships.some(o => o.buyerId === x.id));
                const amortizeMode = p.sellAmortizeMode || 'reduce_cuota';
                const amortizePct = Number(p.sellAmortizePct ?? 100);
                const amortizeAmount = netSaleAfter * (amortizePct / 100);
                const keepAmount = netSaleAfter * (1 - amortizePct / 100);
                const grossRent = Number(p.netRentalIncome) || 0;
                const computablePct = Number(p.rentalComputablePct ?? 80);
                const expenses = Number(p.rentalMonthlyExpenses) || 0;
                const computableRent = grossRent * (computablePct / 100);
                const netComputableRent = Math.max(0, computableRent - expenses);
                const mortgagePayment = Number(p.mortgageMonthlyPayment) || 0;
                const netCashFlow = netComputableRent - mortgagePayment;

                return (
                  <div key={p.id} className="rounded-xl border border-slate-200 dark:border-slate-800 p-4 print-avoid-break">

                      <button className="px-2 py-1 rounded-lg bg-red-50 hover:bg-red-100 text-red-600 text-xs dark:bg-red-900/30 dark:text-red-300 no-print"

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">

                      <NumberField label="Valor de mercado" tooltip="Valor total." value={p.marketValue} onChange={v => updateProperty(p.id, { marketValue: v })} suffix="€" min={0} />
                      <NumberField label="Hipoteca pendiente (capital)" tooltip="Capital pendiente total." value={p.mortgageOutstanding} onChange={v => updateProperty(p.id, { mortgageOutstanding: v })} suffix="€" min={0} />
                      <NumberField label="Cuota mensual de esta hipoteca" tooltip="Se computa como deuda. NO la dupliques en Deudas." value={p.mortgageMonthlyPayment} onChange={v => updateProperty(p.id, { mortgageMonthlyPayment: v })} suffix="€/mes" min={0} />
                    </div>

                    <div className="mb-4 p-3 rounded-lg bg-slate-50 dark:bg-slate-800/50">
                      <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
                        <div className="text-sm font-semibold text-slate-700 dark:text-slate-300">Copropietarios</div>
                        {buyerIdsAvailable.length > 0 && (
                          <select className="text-xs px-2 py-1 rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 no-print"
                            value="" onChange={e => { if (e.target.value) addOwner(p.id, e.target.value); }}>
                            <option value="">+ Añadir copropietario…</option>
                            {buyerIdsAvailable.map(x => <option key={x.id} value={x.id}>{x.name}</option>)}
                          </select>
                        )}
                      </div>
                      <div className="space-y-2">
                        {ownerships.map(o => (
                          <div key={o.buyerId} className="flex items-center gap-2">
                            <span className="text-sm flex-1">{buyerName(o.buyerId)}</span>
                            <input type="number" className="w-20 px-2 py-1 text-sm rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-right"
                              value={o.pct ?? 0} min={0} max={100}
                              onChange={e => updateOwnerPct(p.id, o.buyerId, Number(e.target.value) || 0)} />
                            <span className="text-xs text-slate-500 w-4">%</span>
                            {ownerships.length > 1 && (
                              <button className="px-2 py-1 rounded bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-300 text-xs no-print"
                                onClick={() => removeOwner(p.id, o.buyerId)}>×</button>
                            )}
                          </div>
                        ))}
                      </div>
                      <div className={"mt-2 text-xs " + (Math.abs(totalPct - 100) < 0.01 ? 'text-emerald-600' : 'text-amber-600')}>
                        Total: {totalPct}% {Math.abs(totalPct - 100) > 0.01 && '⚠️ (ajusta a 100%)'}
                      </div>
                    </div>

                    <div className="mb-4">
                      <Toggle label="Ofrecer como garantía adicional al banco" tooltip="Pignoración o 2ª hipoteca." checked={p.usedAsCollateral} onChange={v => updateProperty(p.id, { usedAsCollateral: v })} />
                      {p.usedAsCollateral && (
                        <div className="mt-3 grid grid-cols-1 md:grid-cols-3 gap-4">
                          <NumberField label="Valor que el banco computa" tooltip="Habitualmente 60%–70%." value={p.collateralValue} onChange={v => updateProperty(p.id, { collateralValue: v })} suffix="€" min={0} help={p.marketValue > 0 ? `Sugerido: ${fmtEur((p.marketValue||0)*0.7)}` : ''} />
                          <SelectField label="¿Quién aporta la garantía?" tooltip="Reparto según % o a titular concreto."
                            value={p.collateralBuyerId || ''}
                            onChange={v => updateProperty(p.id, { collateralBuyerId: v || null })}
                            options={[{ value: '', label: 'Reparto proporcional' }, ...ownerships.map(o => ({ value: o.buyerId, label: buyerName(o.buyerId) }))]} />
                        </div>
                      )}
                    </div>

                    <div className="mb-4">
                      <SelectField label="Plan para este inmueble" tooltip="Conservar / Vender antes / Vender después." value={p.planToSell} onChange={v => updateProperty(p.id, { planToSell: v })}
                        options={[
                          { value: 'keep', label: 'Conservar (mantener alquilado o uso propio)' },
                          { value: 'sell_before', label: 'Vender ANTES de la compra' },
                          { value: 'sell_after', label: 'Vender DESPUÉS (amortizar hipoteca)' }
                        ]} />
                    </div>

                    {p.planToSell === 'keep' && (
                      <div className="p-4 rounded-lg bg-brand-50/50 dark:bg-brand-900/10 border border-brand-200 dark:border-brand-800">
                        <h4 className="text-sm font-semibold text-brand-900 dark:text-brand-200 mb-3">💰 Alquiler — lo que el banco computa</h4>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                          <NumberField label="Renta bruta mensual" tooltip="Lo que cobras del inquilino." value={p.netRentalIncome} onChange={v => updateProperty(p.id, { netRentalIncome: v })} suffix="€/mes" min={0} />
                          <NumberField label="% computable banco" tooltip="Habitual 70%–80%." value={p.rentalComputablePct} onChange={v => updateProperty(p.id, { rentalComputablePct: Math.max(0, Math.min(100, Number(v) || 0)) })} suffix="%" min={0} max={100} step={5} help={`${computablePct}% de ${fmtEur(grossRent)} = ${fmtEur(computableRent)}`} />
                          <NumberField label="Gastos mensuales" tooltip="Comunidad, IBI, seguro, gestión." value={p.rentalMonthlyExpenses} onChange={v => updateProperty(p.id, { rentalMonthlyExpenses: v })} suffix="€/mes" min={0} />
                          <div className="rounded-lg bg-white dark:bg-slate-900 border border-brand-200 dark:border-brand-800 p-3 text-xs">

                            {mortgagePayment > 0 && (
                              <>
                                <div className="text-slate-500 mt-1">− Cuota: {fmtEur(mortgagePayment)}/mes</div>
                                <div className={"mt-1 font-semibold " + (netCashFlow >= 0 ? 'text-emerald-600' : 'text-red-600')}>
                                  Flujo neto: {fmtEur(netCashFlow)}/mes
                                </div>
                              </>
                            )}
                          </div>
                        </div>
                      </div>
                    )}

                    {(p.planToSell === 'sell_before' || p.planToSell === 'sell_after') && (
                      <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <NumberField label="Precio de venta previsto" tooltip="Si lo dejas a 0 se usa valor de mercado." value={p.sellPrice} onChange={v => updateProperty(p.id, { sellPrice: v })} suffix="€" min={0} />
                        <NumberField label="Gastos de venta" tooltip="Inmobiliaria, notaría." value={p.sellCosts} onChange={v => updateProperty(p.id, { sellCosts: v })} suffix="€" min={0} />
                        <NumberField label="Impuestos de venta" tooltip="Plusvalía municipal, IRPF." value={p.sellTaxes} onChange={v => updateProperty(p.id, { sellTaxes: v })} suffix="€" min={0} />
                        {p.planToSell === 'sell_after' && (
                          <NumberField label="Mes de venta" tooltip="Mes (desde la firma) en que prevés vender." value={p.sellMonth} onChange={v => updateProperty(p.id, { sellMonth: v })} suffix="mes" min={1} max={480} />
                        )}
                      </div>
                    )}

                    {p.planToSell === 'sell_after' && (
                      <div className="mt-4 p-4 rounded-lg bg-amber-50/60 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800">
                        <h4 className="text-sm font-semibold text-amber-900 dark:text-amber-200 mb-3">💡 Amortización de la hipoteca con el neto de la venta</h4>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                          <NumberField label="% del neto destinado a amortizar" tooltip="Porcentaje del neto de la venta a reducir hipoteca."

                          <SelectField label="Modo de amortización" tooltip="Reduce cuota o reduce plazo."
                            value={amortizeMode}
                            onChange={v => updateProperty(p.id, { sellAmortizeMode: v })}

                              { value: 'reduce_plazo', label: 'Reducir PLAZO' },
                              { value: 'none', label: 'No amortizar' }
                            ]} />
                          <div className="rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3 text-xs">
                            <div className="text-slate-500">Efecto</div>
                            <div className="mt-1 space-y-0.5">
                              <div>Neto: <strong>{fmtEur(netSaleAfter)}</strong></div>
                              <div>Amortizas: <strong className="text-brand-600 dark:text-brand-400">{fmtEur(amortizeAmount)}</strong></div>
                              <div>Conservas: <strong className="text-emerald-600 dark:text-emerald-400">{fmtEur(keepAmount)}</strong></div>
                            </div>
                          </div>
                        </div>
                      </div>
                    )}

                    <div className="mt-3 grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                      <div className="rounded-lg bg-slate-50 dark:bg-slate-800/50 p-2">
                        <div className="text-slate-500">Patrimonio neto</div>
                        <div className="font-semibold text-slate-800 dark:text-slate-200">{fmtEur(netEquity)}</div>
                      </div>
                      {p.usedAsCollateral && (
                        <div className="rounded-lg bg-brand-50 dark:bg-brand-900/20 p-2">
                          <div className="text-brand-700 dark:text-brand-300">Garantía</div>
                          <div className="font-semibold text-brand-700 dark:text-brand-300">{fmtEur(p.collateralValue)}{p.collateralBuyerId ? ` → ${buyerName(p.collateralBuyerId)}` : ' (reparto)'}</div>
                        </div>
                      )}
                      {(p.planToSell === 'sell_before' || p.planToSell === 'sell_after') && (
                        <div className="rounded-lg bg-emerald-50 dark:bg-emerald-900/20 p-2">
                          <div className="text-emerald-700 dark:text-emerald-300">Neto de venta</div>
                          <div className="font-semibold text-emerald-700 dark:text-emerald-300">{fmtEur(netSaleAfter)}</div>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </Card>
      ))}

      <Card className="p-5 mt-6 bg-amber-50/50 dark:bg-amber-900/10 border-amber-200 dark:border-amber-800">
        <div className="text-xs text-amber-800 dark:text-amber-200">
          <strong>⚠️ Nota:</strong> la aceptación de garantía adicional depende de cada banco. Las amortizaciones parciales pueden llevar comisión (habitual 0%–0,25%).
        </div>
      </Card>
    </div>
  );
};

const DebtsSection = ({ debts, setDebts, monthlyExpenses, setMonthlyExpenses }) => {

  const update = (id, patch) => setDebts(debts.map(d => d.id === id ? { ...d, ...patch } : d));
  const remove = (id) => setDebts(debts.filter(d => d.id !== id));
  const ue = (k, v) => setMonthlyExpenses({ ...monthlyExpenses, [k]: v });
  const typeLabels = { hipoteca:'Hipoteca', personal:'Préstamo personal', vehiculo:'Vehículo', tarjeta:'Tarjeta de crédito', financiacion:'Financiación', otro:'Otra' };
  return (
    <div>

          <NumberField label="Seguros" tooltip="Seguros no vinculados." value={monthlyExpenses.insurance} onChange={v => ue('insurance', v)} suffix="€" min={0} />
          <NumberField label="Hijos" tooltip="Gastos específicos." value={monthlyExpenses.children} onChange={v => ue('children', v)} suffix="€" min={0} />

const MortgageSection = ({ mortgage, setMortgage, property, amortizations }) => {
  const totalPrice = (property.price||0) + (property.garagePrice||0) + (property.storagePrice||0);
  
  const safeDownPct = Number(mortgage.downPaymentPct) || 0;
  const safeMaxLtv = Number(mortgage.maxLtv) || 0;
  const safeTermYears = Number(mortgage.termYears) || 0;
  const safeTin = Number(mortgage.tin) || 0;
  const safeOpeningFee = Number(mortgage.openingFeePct) || 0;
  const safeLinked = Number(mortgage.linkedProductsAnnual) || 0;
  const safeEuribor = Number(mortgage.euribor) || 3.5;
  const safeSpread = Number(mortgage.spread) || 1.0;
  const safeRevision = Number(mortgage.revisionMonths) || 12;
  const safeFixedYears = Number(mortgage.fixedYears) || 5;
  const safePostFixed = Number(mortgage.postFixedTin) || 4.0;
  const safeMaxAge = Number(mortgage.maxAgeAtMaturity) || 75;
  const safeThreshold = Number(mortgage.debtThreshold) || 0.35;

  const desiredMortgage = totalPrice * (1 - safeDownPct / 100);
  const maxMortgageByLtv = totalPrice * (safeMaxLtv / 100);
  const effectiveMortgage = Math.min(desiredMortgage, maxMortgageByLtv);
  const effectiveDown = totalPrice - effectiveMortgage;
  const ltvCapped = desiredMortgage > maxMortgageByLtv + 0.01;
  const effectiveLtv = totalPrice > 0 ? effectiveMortgage / totalPrice : 0;

  const basePayment = monthlyPayment(effectiveMortgage, safeTin, safeTermYears * 12);
  const schedule = buildMortgageSchedule(effectiveMortgage, safeTin, safeTermYears * 12, amortizations || []);
  const effectiveMonths = schedule.length;
  const firstRow = schedule[0] || { payment: basePayment };
  const effectivePayment = firstRow.payment;

  const firstAmort = (amortizations || []).filter(a => a.amount > 0 && a.mode === 'reduce_cuota').sort((a,b) => a.month - b.month)[0];
  let paymentAfterAmort = effectivePayment;
  if (firstAmort) {
    const row = schedule.find(r => r.month === firstAmort.month + 1);
    if (row) paymentAfterAmort = row.payment;
  }

  const handlePresetChange = (e) => {
    const presetValue = e.target.value;
    const preset = RATE_PRESETS.find(p => p.value === presetValue);
    const prev = mortgage;

    if (!preset || presetValue === '') {
      setMortgage({ ...prev, ratePreset: '' });
      return;
    }

    const nextType = preset.type || prev.type || 'fijo';
    setMortgage({
      ...prev,
      ratePreset: presetValue,
      type: nextType,
      tin: preset.tin != null ? preset.tin : prev.tin,
      fixedYears: preset.fixedYears != null ? preset.fixedYears : (nextType === 'mixto' ? 5 : prev.fixedYears),
      postFixedTin: preset.postFixedTin != null ? preset.postFixedTin : (nextType === 'mixto' ? 4.0 : prev.postFixedTin),
      linkedProductsAnnual: preset.linkedAnnual != null ? preset.linkedAnnual : 0,
      euribor: preset.euribor != null ? preset.euribor : 3.5,
      spread: preset.spread != null ? preset.spread : 1.0,
      revisionMonths: preset.revisionMonths != null ? preset.revisionMonths : 12,
      termYears: preset.termYears != null ? preset.termYears : prev.termYears,
      openingFeePct: preset.openingFeePct != null ? preset.openingFeePct : prev.openingFeePct,
      maxLtv: preset.maxLtv != null ? preset.maxLtv : prev.maxLtv,
      downPaymentPct: preset.maxLtv != null ? 100 - preset.maxLtv : prev.downPaymentPct,
      maxAgeAtMaturity: preset.maxAge != null ? preset.maxAge : prev.maxAgeAtMaturity,
      debtThreshold: preset.debtThreshold != null ? preset.debtThreshold : prev.debtThreshold
    });
  };

  return (
    <div>
      <h2 className="text-xl font-semibold text-slate-900 dark:text-white mb-1">Hipoteca y financiación</h2>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-6">Configura las condiciones de tu préstamo hipotecario.</p>
      <Card className="p-5 mb-6">
        <h3 className="font-semibold text-slate-900 dark:text-white mb-4">Condiciones</h3>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
          <NumberField label="Aportación inicial (% del precio)" tooltip="Porcentaje del precio que pagas tú." value={safeDownPct} onChange={v => setMortgage({...mortgage, downPaymentPct: v})} suffix="%" min={0} max={100} step={1} help={`→ Aportas ${fmtEur(totalPrice * safeDownPct / 100)} · Banco financia el ${100 - safeDownPct}%`} />
          <NumberField label="Plazo (años)" tooltip="Duración del préstamo." value={safeTermYears} onChange={v => setMortgage({...mortgage, termYears: v})} min={1} max={40} suffix="años" />
          <SelectField label="Tipo de interés" tooltip="Fijo, variable o mixto." value={mortgage.type || 'fijo'} onChange={v => setMortgage({...mortgage, type: v})} options={[{ value: 'fijo', label: 'Fijo' }, { value: 'variable', label: 'Variable' }, { value: 'mixto', label: 'Mixto' }]} />
          
          <div>
            <LabelWithTooltip label="TAE / TIN anual" tooltip="Selecciona una oferta de referencia o elige Personalizado para introducir manualmente." />
            <select className={inputCls + " mb-2"} value={mortgage.ratePreset || ''} onChange={handlePresetChange}>
              {RATE_PRESETS.map(p => <option key={p.value} value={p.value}>{p.label}</option>)}
            </select>
            <NumberField value={safeTin} onChange={v => setMortgage({...mortgage, tin: v, ratePreset: ''})} suffix="%" min={0} max={20} step={0.01} placeholder="Introduce TIN/TAE personalizado" />
            <p className={helpCls + " mt-1"}>💡 Datos de referencia de octubre 2026. Los tipos reales dependen de vinculaciones y perfil.</p>
          </div>

          <NumberField label="Comisión apertura" tooltip="Habitual 0%–1%." value={safeOpeningFee} onChange={v => setMortgage({...mortgage, openingFeePct: v})} suffix="%" min={0} max={5} step={0.1} />
          <NumberField label="Productos vinculados (anual)" tooltip="Seguros, tarjetas." value={safeLinked} onChange={v => setMortgage({...mortgage, linkedProductsAnnual: v})} suffix="€" min={0} />
        </div>
        {mortgage.type !== 'fijo' && (
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4 pt-4 border-t border-slate-100 dark:border-slate-800">
            <NumberField label="Euríbor" tooltip="Euríbor 12M." value={safeEuribor} onChange={v => setMortgage({...mortgage, euribor: v})} suffix="%" min={-1} max={10} step={0.05} />
            <NumberField label="Diferencial" tooltip="Margen del banco." value={safeSpread} onChange={v => setMortgage({...mortgage, spread: v})} suffix="%" min={0} max={5} step={0.05} />
            <NumberField label="Revisión" tooltip="Habitual 12 meses." value={safeRevision} onChange={v => setMortgage({...mortgage, revisionMonths: v})} suffix="meses" min={1} max={60} />
          </div>
        )}
        {mortgage.type === 'mixto' && (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4 pt-4 border-t border-slate-100 dark:border-slate-800">
            <NumberField label="Años tramo fijo" tooltip="Habitual 5–10 años." value={safeFixedYears} onChange={v => setMortgage({...mortgage, fixedYears: v})} suffix="años" min={1} max={30} />
            <NumberField label="TIN posterior" tooltip="Tipo tras el tramo fijo." value={safePostFixed} onChange={v => setMortgage({...mortgage, postFixedTin: v})} suffix="%" min={0} max={20} step={0.05} />
          </div>
        )}
      </Card>

      <Card className="p-5 mb-6">
        <h3 className="font-semibold text-slate-900 dark:text-white mb-4">Criterios del banco (editables)</h3>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
          <NumberField label="LTV máximo" tooltip="Habitual 80% primera vivienda." value={safeMaxLtv} onChange={v => setMortgage({...mortgage, maxLtv: v})} suffix="%" min={0} max={100} step={1} />
          <NumberField label="Edad máxima al vencimiento" tooltip="Habitual 70–75 años." value={safeMaxAge} onChange={v => setMortgage({...mortgage, maxAgeAtMaturity: v})} suffix="años" min={50} max={90} />
          <NumberField label="Umbral endeudamiento" tooltip="Habitual 0,35 (35%)." value={safeThreshold} onChange={v => setMortgage({...mortgage, debtThreshold: v})} step={0.01} min={0.1} max={0.6} help={`${(safeThreshold*100).toFixed(0)}%`} />
        </div>
      </Card>

      {ltvCapped && (
        <div className="mb-4 p-3 rounded-lg bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 text-sm text-amber-800 dark:text-amber-200">
          ⚠️ Has pedido aportación del <strong>{safeDownPct}%</strong>, pero el LTV máximo es del <strong>{safeMaxLtv}%</strong>. Financiación real: <strong>{fmtPct(effectiveLtv, 0)}</strong>.
        </div>
      )}

      <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
        <KPI label="Aportación inicial" value={fmtEur(effectiveDown)} sub={`${fmtPct(effectiveDown / (totalPrice||1), 0)} del precio`} color="brand" />
        <KPI label="Hipoteca" value={fmtEur(effectiveMortgage)} sub={`LTV ${fmtPct(effectiveLtv, 0)}`} />
        <KPI label={firstAmort ? 'Cuota (tras amortizar)' : 'Cuota mensual'} value={fmtEur2(paymentAfterAmort)} color="brand" sub={firstAmort ? `Inicial: ${fmtEur2(effectivePayment)}` : null} />
        <KPI label="Plazo efectivo" value={`${(effectiveMonths/12).toFixed(1)} años`} sub={effectiveMonths < safeTermYears * 12 ? `Base: ${safeTermYears} años` : `${effectiveMonths} meses`} />
      </div>

      {(amortizations && amortizations.length > 0) && (
        <Card className="p-5 mt-6 bg-amber-50/60 dark:bg-amber-900/20 border-amber-200 dark:border-amber-800">
          <h4 className="font-semibold text-amber-900 dark:text-amber-200 mb-3">📌 Amortizaciones planificadas por venta</h4>
          <div className="space-y-2 text-sm">
            {amortizations.map((a, i) => (
              <div key={i} className="flex flex-wrap justify-between items-center gap-2 py-1 border-b border-amber-200/50 dark:border-amber-800/50 last:border-0">
                <div><strong>{a.propertyAlias}</strong> · mes {a.month}</div>
                <div className="flex gap-3 text-xs">
                  <span>Amortizas: <strong className="text-brand-600 dark:text-brand-400">{fmtEur(a.amount)}</strong></span>
                  <span>Conservas: <strong className="text-emerald-600 dark:text-emerald-400">{fmtEur(a.keep)}</strong></span>
                  <span className="px-2 py-0.5 rounded bg-white dark:bg-slate-900">{a.mode === 'reduce_cuota' ? '↓ Cuota' : a.mode === 'reduce_plazo' ? '↓ Plazo' : 'Sin efecto'}</span>
                </div>
              </div>
            ))}
          </div>
        </Card>
      )}
    </div>
  );
};

const PrintReport = ({ state, result, maxPrice, mode }) => {
  const isBankMode = mode === 'bank';
  const props = result.properties;
  const m = state.mortgage;
  const now = new Date().toLocaleString('es-ES');
  const nfE0 = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0, useGrouping: 'always' });
  const nfE2 = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: 'always' });
  const eur = (n) => (n == null || isNaN(n)) ? '—' : nfE0.format(n);
  const eur2 = (n) => (n == null || isNaN(n)) ? '—' : nfE2.format(n);
  const neg = (n) => '−' + fmtEur(Math.abs(n));
  const num = (n) => new Intl.NumberFormat('es-ES', { maximumFractionDigits: 2 }).format(n);
  const label = (t) => t ? String(t).charAt(0).toUpperCase() + String(t).slice(1).replace(/_/g, ' ') : '—';
  const years1 = (months) => new Intl.NumberFormat('es-ES', { maximumFractionDigits: 1 }).format(months / 12);

  const ageOf = (b) => b.birthDate ? Math.floor((Date.now() - new Date(b.birthDate).getTime()) / (365.25 * 24 * 3600 * 1000)) : null;

  /* --- amortizaciones y escenarios --- */
  const active = (result.amortizations || []).filter(a => a.amount > 0 && a.mode !== 'none');
  const hasAm = active.length > 0;
  const lastMonth = hasAm ? Math.max(...active.map(a => a.month)) : 0;
  const mkSched = (mode) => buildMortgageSchedule(result.mortgageAmount, result.tin, result.months, active.map(a => ({ ...a, mode })));
  const payAfter = (sched) => { const r = sched.find(x => x.month === lastMonth + 1) || sched[sched.length - 1]; return r ? r.payment : 0; };
  let scen = null;
  if (hasAm) {
    const sC = mkSched('reduce_cuota'), sP = mkSched('reduce_plazo');
    const balAfter = (sC.find(x => x.month === lastMonth && x.isAmortization) || {}).balance;
    scen = {
      sC, sP, balAfter,
      payC: payAfter(sC), payP: payAfter(sP),
      monthsC: sC.length, monthsP: sP.length,
      intC: totalInterest(sC), intP: totalInterest(sP),
    };
  }
  const income = result.computableIncome;
  const soldMortPay = (props.toSellAfter || []).reduce((s, p) => s + (Number(p.mortgageMonthlyPayment) || 0), 0);
  const debtOtherAfter = Math.max(0, result.existingDebt - soldMortPay);
  const ratioOf = (tot) => income > 0 ? fmtPct(tot / income) : '—';

  /* --- piezas de maquetación --- */
  const Section = ({ title, children }) => (
    <div className="pr-section print-avoid-break"><div className="pr-bar">{title}</div>{children}</div>
  );
  const Table = ({ head, rows }) => (
    <table className="pr-table">
      <thead><tr>{head.map((h, i) => <th key={i}>{h}</th>)}</tr></thead>
      <tbody>{rows.map((r, i) => {
        const cells = Array.isArray(r) ? r : r.cells;
        return <tr key={i} className={!Array.isArray(r) && r.bold ? 'bold' : ''}>{cells.map((c, j) => <td key={j}>{c}</td>)}</tr>;
      })}</tbody>
    </table>
  );

  /* --- 1. Compradores --- */
  const B = state.buyers;
  const sum = (f) => B.reduce((s, b) => s + (Number(f(b)) || 0), 0);
  const compOf = (b) => (b.monthlyNetSalary||0) * ((b.computablePct?.salary ?? 100)/100)
    + (b.variableIncome||0) * ((b.computablePct?.variable ?? 80)/100)
    + (b.rentalIncome||0) * ((b.computablePct?.rental ?? 80)/100)
    + (b.otherIncome||0) * ((b.computablePct?.other ?? 100)/100);
  const buyerHead = ['Dato', ...B.map((b, i) => B.length > 1 ? `Comprador ${i + 1}` : 'Comprador'), 'Total / observación'];
  const buyerRows = [
    ['Edad', ...B.map(b => { const a = ageOf(b); return a != null ? `${a} años` : '—'; }), '—'],
    ['Situación laboral', ...B.map(b => label(b.employmentType)), '—'],
    ['Nómina neta mensual', ...B.map(b => eur(b.monthlyNetSalary)), `${eur(sum(b => b.monthlyNetSalary))}/mes`],
  ];
  if (sum(b => b.variableIncome) > 0) buyerRows.push(['Ingresos variables', ...B.map(b => eur(b.variableIncome)), `${eur(sum(b => b.variableIncome))}/mes`]);
  if (sum(b => (b.rentalIncome||0) + (b.otherIncome||0)) > 0) buyerRows.push(['Alquileres y otros ingresos', ...B.map(b => eur((b.rentalIncome||0) + (b.otherIncome||0))), `${eur(sum(b => (b.rentalIncome||0) + (b.otherIncome||0)))}/mes`]);
  buyerRows.push(['Ingresos netos anuales', ...B.map(b => eur(((b.monthlyNetSalary||0)+(b.variableIncome||0)+(b.rentalIncome||0)+(b.otherIncome||0)) * 12)), `${eur(result.rawIncome - props.rentalGrossMonthly > 0 ? (result.rawIncome - props.rentalGrossMonthly) * 12 : 0)}/año`]);
  buyerRows.push({ bold: true, cells: ['Ingresos computables mensuales', ...B.map(b => eur(compOf(b))), `${eur(result.salaryIncomeComputable)}/mes (según % computable)`] });

  /* --- 2. Patrimonio --- */
  const otherWealth = Math.max(0, computeTotalPatrimony(result.aggregateSavings) - result.liquidSavings);
  const assetRows = props.all.map(p => {
    const rent = p.grossRent > 0 ? `; alquiler ${eur(p.grossRent)}/mes` : '';
    const pay = (Number(p.mortgageMonthlyPayment) || 0) > 0 ? `; cuota ${eur(p.mortgageMonthlyPayment)}/mes` : '';
    const treat = p.planToSell === 'keep' ? `Se conserva${rent}${pay}`
      : p.planToSell === 'sell_before' ? `Se vende antes de la compra; se estiman ${eur(p.saleNet)} netos`
      : `Se vende tras la compra (mes ${Number(p.sellMonth) || 24}); se estiman ${eur(p.saleNet)} netos`;
    return [p.alias || 'Inmueble', eur(p.marketValue), eur(p.mortgageOutstanding || 0), treat];
  });
  assetRows.push(['Ahorros líquidos', eur(result.liquidSavings), '—',
    `Se destinan a entrada y gastos de compra${result.baseAvailable < result.liquidSavings ? ` (aportan ${eur(result.baseAvailable)})` : ''}${result.emergencyReserve > 0 ? `; reserva objetivo ${eur(result.emergencyReserve)}` : ''}`]);
  if (otherWealth > 0) assetRows.push(['Otro patrimonio no líquido', eur(otherWealth), '—', 'No se considera para la compra']);
  const rentNotes = props.keptProperties.filter(p => p.grossRent > 0).map(p => {
    const pay = Number(p.mortgageMonthlyPayment) || 0;
    return `${p.alias}: alquiler bruto ${eur(p.grossRent)} − cuota ${eur(pay)} = ${eur(p.grossRent - pay)}/mes antes de comunidad, seguro, mantenimiento, vacantes e impuestos. El banco podría computar solo una parte del alquiler (${p.computablePct} % configurado).`;
  });

  /* --- 3. Compra y financiación --- */
  const pr = state.property;
  const itpPct = state.tax.mode === 'manual' ? state.tax.itpPct : (ITP_BY_REGION[pr.region] ?? 8);
  const buyRows = [[pr.isNew ? 'Precio de vivienda nueva' : 'Precio de vivienda usada', eur(pr.price), (pr.agencyFee || 0) > 0 ? `Comisión de agencia ${eur(pr.agencyFee)}` : 'Sin comisión de agencia']];
  if (result.anexos > 0) buyRows.push(['Anexos (garaje y trastero)', eur(result.anexos), 'Incluidos en el precio total']);
  if (pr.isNew) {
    buyRows.push(['IVA estimado', eur(result.acq.iva), 'Verificar tipo aplicable']);
    buyRows.push(['AJD estimado', eur(result.acq.ajd), 'Verificar tipo aplicable']);
  } else {
    buyRows.push([`ITP estimado (${num(itpPct)} %)`, eur(result.acq.itp), `${pr.region}; verificar aplicación`]);
  }
  buyRows.push(['Otros gastos estimados', eur(result.acq.fixed + result.acq.other + result.acq.agency), 'Notaría, registro, tasación, gestoría y otros']);
  if ((result.reforms || 0) + (result.furniture || 0) > 0) buyRows.push(['Reformas y mobiliario', eur((result.reforms || 0) + (result.furniture || 0)), 'Según datos introducidos']);
  if (result.openingFee > 0) buyRows.push(['Comisión de apertura', eur(result.openingFee), `${num(m.openingFeePct)} % de la hipoteca`]);
  const totalOp = result.totalPrice + result.acq.total + (result.reforms || 0) + (result.furniture || 0) + result.openingFee;
  buyRows.push({ bold: true, cells: ['Coste total de la operación', eur(totalOp), 'Precio + impuestos + gastos'] });
  buyRows.push(['Hipoteca solicitada', neg(result.mortgageAmount), `${fmtPct(result.effectiveLtv, 0)} del precio de compra${result.ltvCapped ? ' (limitada por LTV máximo)' : ''}`]);
  buyRows.push(['Aportación necesaria', eur(result.totalNeeded), `Entrada ${eur(result.downPayment)} + gastos ${eur(result.totalNeeded - result.downPayment)}`]);
  buyRows.push(['Ahorros disponibles', eur(result.available), result.liquidFromSalesBefore > 0 ? `Incluye ${eur(result.liquidFromSalesBefore)} de ventas previas` : 'Ahorros líquidos que se aportan']);
  buyRows.push({ bold: true, cells: [result.liquidityGapWithoutReserve > 0 ? 'Déficit de liquidez' : 'Excedente de liquidez', eur(-result.liquidityGapWithoutReserve), result.emergencyReserve > 0 ? (result.liquidityGap > 0 ? `No cubre la reserva de ${eur(result.emergencyReserve)}` : `Cubre además la reserva de ${eur(result.emergencyReserve)}`) : 'Sin reserva configurada'] });
  const typeLabel = { fijo: 'fijo', variable: 'variable', mixto: 'mixto' }[m.type] || m.type;

  /* --- 4. Viabilidad antes de vender --- */
  const viaRows = [['Ingresos computables (nóminas y otros)', eur2(result.salaryIncomeComputable)]];
  if (result.rentalIncomeComputable > 0) viaRows.push(['Alquileres computables', eur2(result.rentalIncomeComputable)]);
  viaRows.push({ bold: true, cells: ['Total ingresos computables', eur2(income)] });
  if (result.existingDebtDebtsOnly > 0) viaRows.push(['Cuotas de deudas declaradas', eur2(result.existingDebtDebtsOnly)]);
  if (result.existingDebtPropertiesOnly > 0) viaRows.push(['Hipotecas de inmuebles existentes', eur2(result.existingDebtPropertiesOnly)]);
  viaRows.push(['Nueva hipoteca', eur2(result.payment)]);
  viaRows.push({ bold: true, cells: ['Total de cuotas hipotecarias y deudas', eur2(result.totalDebtAfter)] });
  viaRows.push(['Disponible tras cuotas (antes de otros gastos)', eur2(income - result.totalDebtAfter)]);
  viaRows.push(['Gastos familiares', eur2(result.monthlyExpenses)]);
  if (result.linkedAnnual > 0) viaRows.push(['Productos vinculados (mensualizado)', eur2(result.linkedAnnual / 12)]);
  viaRows.push({ bold: true, cells: ['Margen mensual libre', eur2(result.monthlyMargin)] });
  viaRows.push({ bold: true, cells: ['Endeudamiento sobre ingresos computables', `${fmtPct(result.ratioAfter)} (umbral ${fmtPct(result.threshold)})`] });

  const alertCls = result.verdict === 'viable' ? 'ok' : result.verdict === 'not_viable' ? 'bad' : '';
  const alertTitle = result.verdict === 'viable' ? 'RESULTADO' : 'ALERTA';
  const ltvNote = result.effectiveLtv > 0.8 ? `financiación inicial del ${fmtPct(result.effectiveLtv, 0)}` : '';
  const alertText = [result.verdictLabel + '.', ltvNote ? ltvNote.charAt(0).toUpperCase() + ltvNote.slice(1) + '.' : '', ...result.reasons.map(r => r + '.'), 'La aceptación depende de la tasación, política del banco, solvencia completa y posibles garantías adicionales.'].filter(Boolean).join(' ');

  /* --- 5. Venta y amortización --- */
  const saleBlocks = active.map(a => {
    const prop = props.all.find(p => p.id === a.propertyId) || {};
    const sellPrice = Number(prop.sellPrice) || Number(prop.marketValue) || 0;
    const costs = (Number(prop.sellCosts) || 0) + (Number(prop.sellTaxes) || 0);
    const debt = Number(prop.mortgageOutstanding) || 0;
    const row = (scen ? scen.sC : []).find(x => x.month === a.month && x.isAmortization);
    const rows = [
      ['Precio de venta estimado', eur(sellPrice)],
      ['Gastos e impuestos estimados de venta', neg(costs)],
    ];
    if (debt > 0) rows.push(['Hipoteca pendiente que se cancela', neg(debt)]);
    rows.push({ bold: true, cells: ['Neto estimado de la venta', eur(a.totalNet)] });
    if (a.keep > 0) rows.push(['Reserva que se conserva', neg(a.keep)]);
    rows.push({ bold: true, cells: [`Amortización anticipada (${a.mode === 'reduce_plazo' ? 'reducir plazo' : 'reducir cuota'})`, eur(a.amount)] });
    if (row) {
      rows.push([`Capital de la nueva hipoteca tras ${a.month} cuotas`, `${eur(row.balance + a.amount)} aprox.`]);
      rows.push([`Capital pendiente tras amortizar ${eur(a.amount)}`, `${eur(row.balance)} aprox.`]);

    return { alias: prop.alias || a.propertyAlias || 'Inmueble', month: a.month, rows };

  let compRows = [];

    const totC = debtOtherAfter + scen.payC;
    const totP = debtOtherAfter + scen.payP;
    compRows = [
      ['Cuota nueva hipoteca', `${eur2(result.basePayment)}/mes`, `${eur2(scen.payC)}/mes aprox.`, `${eur2(scen.payP)}/mes aprox.`],
      ['Plazo total', `${years1(result.months)} años`, `≈ ${years1(scen.monthsC)} años`, `≈ ${years1(scen.monthsP)} años`],
      ['Intereses totales', eur(result.baseInterestTotal), eur(scen.intC), eur(scen.intP)],
      ['Cuotas hipotecarias totales', `${eur2(totB)}/mes`, `${eur2(totC)}/mes`, `${eur2(totP)}/mes`],
      ['Disponible tras cuotas', `${eur2(income - totB)}/mes`, `${eur2(income - totC)}/mes`, `${eur2(income - totP)}/mes`],
      ['Endeudamiento sobre ingresos', ratioOf(totB), ratioOf(totC), ratioOf(totP)],
      ['Reserva de efectivo de la venta', eur(0), eur(result.totalKeptFromSales), eur(result.totalKeptFromSales)],
    ];
  }

  /* --- 7. Conclusión --- */
  const risks = [];
  if (ltvNote) risks.push(ltvNote);
  result.reasons.forEach(r => risks.push(r));
  const riskText = risks.length ? (risks.join('; ').replace(/^./, c => c.toUpperCase()) + '. Debe evaluarse si pueden sostener la operación y si el banco la acepta.') : 'Sin alertas relevantes con los criterios configurados; conviene revisar el margen ante subidas de tipos.';
  const afterText = hasAm
    ? `${scen.payC && income > 0 && (debtOtherAfter + scen.payC) / income <= result.threshold ? 'Escenario favorable' : 'Escenario ajustado'}: deuda nueva aproximada de ${eur(scen.balAfter)}, cuota estimada de ${eur2(scen.payC)}/mes si se reduce cuota${result.totalKeptFromSales > 0 ? ` y reserva de ${eur(result.totalKeptFromSales)}` : ''}.`
    : `Sin ventas posteriores previstas: cuota de ${eur2(result.payment)}/mes y endeudamiento del ${fmtPct(result.ratioAfter)}.`;
  const opDesc = 'Compra de vivienda' + ((props.toSellAfter || []).length > 0 ? ' con venta posterior de otro inmueble y amortización anticipada' : (props.toSellBefore || []).length > 0 ? ' con venta previa de otro inmueble' : '');
  const page2Title = hasAm ? 'Resultado, venta y amortización' : 'Resultado y viabilidad';
  const sec = (n) => `${n}. `;

  return (
    <div className="print-only pr-root">
      <div className="pr-footer">Simulación orientativa · No constituye oferta ni aprobación bancaria</div>

      <h1 className="pr-title">Ficha de viabilidad hipotecaria</h1>
      <div className="pr-subtitle">{state.simName ? state.simName + ' · ' : ''}{opDesc} · {isBankMode ? 'Documentación para el banco' : 'Informe completo'} · Generado el {now}</div>

      <div className="pr-kpis">
        <div className="pr-kpi"><div className="pr-kpi-label">Precio de compra</div><div className="pr-kpi-value">{eur(result.totalPrice)}</div></div>
        <div className="pr-kpi"><div className="pr-kpi-label">Hipoteca inicial</div><div className="pr-kpi-value">{eur(result.mortgageAmount)}</div><div className="pr-kpi-sub">{fmtPct(result.effectiveLtv, 0)} del precio</div></div>
        <div className="pr-kpi"><div className="pr-kpi-label">Cuota inicial</div><div className="pr-kpi-value">{eur2(result.basePayment)}</div><div className="pr-kpi-sub">TIN {typeLabel} {num(result.tin)} % · {years1(result.months)} años</div></div>
        {hasAm
          ? <div className="pr-kpi green"><div className="pr-kpi-label">Cuota tras amortizar</div><div className="pr-kpi-value">{eur2(scen.payC)}</div><div className="pr-kpi-sub">Amortización de {eur(result.totalAmortizedBySales)}</div></div>
          : <div className="pr-kpi green"><div className="pr-kpi-label">Endeudamiento</div><div className="pr-kpi-value">{fmtPct(result.ratioAfter)}</div><div className="pr-kpi-sub">Umbral {fmtPct(result.threshold)}</div></div>}
      </div>

      <Section title={sec(1) + 'Compradores e ingresos'}>
        <Table head={buyerHead} rows={buyerRows} />
      </Section>

      <Section title={sec(2) + 'Patrimonio e inmuebles existentes'}>
        <Table head={['Activo', 'Valor estimado', 'Deuda pendiente', 'Tratamiento en el escenario']} rows={assetRows} />
        {rentNotes.map((t, i) => <div key={i} className="pr-note">{t}</div>)}
      </Section>

      <Section title={sec(3) + 'Compra y financiación inicial'}>
        <Table head={['Concepto', 'Importe', 'Detalle']} rows={buyRows} />
        <div className="pr-note">Condiciones simuladas: tipo {typeLabel} {num(result.tin)} % TIN · plazo {years1(result.months)} años · sistema francés · comisión de apertura {num(m.openingFeePct || 0)} % · productos vinculados {eur(result.linkedAnnual)}/año. Cuota calculada: {eur2(result.basePayment)}/mes.</div>
      </Section>

      <div className="pr-page2">
        <h1 className="pr-title">{page2Title}</h1>
        <div className="pr-subtitle">Continuación del mismo supuesto · importes estimados y redondeados</div>

        <Section title={sec(4) + (hasAm ? 'Viabilidad antes de vender' : 'Viabilidad')}>
          <Table head={['Indicador mensual', 'Importe']} rows={viaRows} />
          {!isBankMode && <div className={'pr-alert ' + alertCls}><strong>{alertTitle}:</strong> {alertText}</div>}
        </Section>

        {hasAm && (
          <Section title={sec(5) + 'Venta y amortización'}>
            {saleBlocks.map((blk, i) => (
              <div key={i} style={{ marginBottom: i < saleBlocks.length - 1 ? 6 : 0 }}>
                {saleBlocks.length > 1 && <div style={{ fontWeight: 800, fontSize: 9, margin: '4px 8px 2px' }}>{blk.alias} · mes {blk.month}</div>}
                <Table head={['Concepto', 'Importe']} rows={blk.rows} />
              </div>
            ))}
          </Section>
        )}

        {hasAm && !isBankMode && (
          <Section title={sec(6) + 'Comparativa después de la amortización'}>
            <Table head={['Indicador', 'Antes de vender', 'Después: reducir cuota', 'Después: reducir plazo']} rows={compRows} />
            <div className="pr-note">La opción de reducir cuota mejora el flujo mensual; reducir plazo suele ahorrar más intereses futuros, pero mantiene una cuota alta. El banco debe confirmar cómo tramitar la amortización y si existe comisión.</div>
          </Section>
        )}

        {!isBankMode && (
          <Section title={sec(hasAm ? 7 : 5) + 'Conclusión orientativa'}>
            <table className="pr-concl"><tbody>
              <tr><td>{hasAm ? 'Tras la venta y amortización' : 'Resultado'}</td><td>{afterText}</td></tr>
              <tr><td>Riesgo principal</td><td>{riskText}</td></tr>
              <tr><td>Precio máximo viable</td><td>{maxPrice && maxPrice.all > 0 ? `Con los datos actuales, el precio máximo estimado es de ${eur(maxPrice.all)}.` : '—'}</td></tr>
              <tr><td>Verificaciones</td><td>Impuestos y gastos reales, tasación, ingresos computables del alquiler, precio y plazo de venta, política de financiación y posibles garantías.</td></tr>
            </tbody></table>
          </Section>
        )}

        <div className="pr-note" style={{ marginTop: 8 }}>Nota metodológica: simulación ilustrativa, no constituye oferta, aprobación bancaria ni asesoramiento fiscal. Los gastos de venta y compra son supuestos. {hasAm ? 'La cuota posterior es una estimación calculada con el capital pendiente, el tipo indicado y el plazo restante; puede variar por fecha efectiva, redondeos y condiciones contractuales.' : 'La cuota es una estimación; puede variar por condiciones contractuales.'}</div>
      </div>
    </div>
  );
};

);
