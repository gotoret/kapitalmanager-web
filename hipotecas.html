  const totalWilling = buyers.reduce((s, b) => s + (Number(b.savings.willingToUse) || 0), 0);
  return (
    <div className="space-y-4">
      <Card className="p-5">
        <h4 className="font-semibold mb-4">Aportación por comprador</h4>

            <tr className="border-b border-slate-200 dark:border-slate-800 text-left">
              <th className="py-2 pr-3">Comprador</th>
              <th className="py-2 pr-3 text-right">Ingresos</th>

              <th className="py-2 pr-3 text-right">Aporta</th>
            </tr>
          </thead>
          <tbody>
            {buyers.map((b, i) => {

              <td className="py-2 pr-3 text-right">—</td>
              <td className="py-2 pr-3 text-right">{fmtEur(totalLiquid)}</td>
              <td className="py-2 pr-3 text-right text-brand-600">{fmtEur(totalWilling)}</td>

          </tbody>
        </table>

    </div>
  );
};

const StressTab = ({ state }) => {
  const [rateShock, setRateShock] = useState(0);
  const [incomeDrop, setIncomeDrop] = useState(0);
  const [expenseUp, setExpenseUp] = useState(0);
  const base = useMemo(() => evaluateOperation(state), [state]);
  const stressed = useMemo(() => {
    const s = JSON.parse(JSON.stringify(state));
    s.mortgage.tin = state.mortgage.tin + rateShock;
    if (s.mortgage.type === 'mixto') s.mortgage.postFixedTin = state.mortgage.postFixedTin + rateShock;
    s.buyers = s.buyers.map(b => ({ ...b, monthlyNetSalary: b.monthlyNetSalary * (1 - incomeDrop/100), variableIncome: b.variableIncome * (1 - incomeDrop/100), otherIncome: b.otherIncome * (1 - incomeDrop/100) }));
    s.monthlyExpenses = Object.fromEntries(Object.entries(s.monthlyExpenses).map(([k,v]) => [k, v * (1 + expenseUp/100)]));
    return evaluateOperation(s);
  }, [state, rateShock, incomeDrop, expenseUp]);
  const comp = [
    { label: 'Cuota base', value: base.payment, color: '#6366f1', display: fmtEur2(base.payment) },
    { label: 'Cuota estresada', value: stressed.payment, color: '#ef4444', display: fmtEur2(stressed.payment) },
  ];
  const ratioComp = [
    { label: 'Ratio base', value: base.ratioAfter * 100, color: '#6366f1', display: fmtPct(base.ratioAfter) },
    { label: 'Ratio estresado', value: stressed.ratioAfter * 100, color: '#ef4444', display: fmtPct(stressed.ratioAfter) },
  ];
  return (
    <div className="space-y-4">
      <Card className="p-5">
        <h4 className="font-semibold mb-4">Pruebas de resistencia</h4>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div>
            <label className={labelCls}>Subida tipos: +{rateShock.toFixed(2)} pp</label>
            <input type="range" min={0} max={3} step={0.25} value={rateShock} onChange={e => setRateShock(Number(e.target.value))} className="w-full" />
          </div>
          <div>
            <label className={labelCls}>Caída ingresos: −{incomeDrop}%</label>
            <input type="range" min={0} max={50} step={5} value={incomeDrop} onChange={e => setIncomeDrop(Number(e.target.value))} className="w-full" />
          </div>
          <div>
            <label className={labelCls}>Subida gastos: +{expenseUp}%</label>
            <input type="range" min={0} max={50} step={5} value={expenseUp} onChange={e => setExpenseUp(Number(e.target.value))} className="w-full" />
          </div>
        </div>
      </Card>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
        <KPI label="Cuota estresada" value={fmtEur2(stressed.payment)} sub={`Base: ${fmtEur2(base.payment)}`} />
        <KPI label="Ratio estresado" value={fmtPct(stressed.ratioAfter)} color={stressed.ratioOk ? 'emerald' : 'red'} sub={`Umbral ${fmtPct(stressed.threshold)}`} />
        <KPI label="Margen estresado" value={fmtEur(stressed.monthlyMargin)} color={stressed.monthlyMargin > 0 ? 'emerald' : 'red'} sub={`Base: ${fmtEur(base.monthlyMargin)}`} />
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <Card className="p-5"><HBarChart data={comp} /></Card>
        <Card className="p-5"><HBarChart data={ratioComp} /></Card>
      </div>
    </div>
  );
};

const ResultsSection = ({ state, result, maxPrice, setState }) => {
  const [tab, setTab] = useState('summary');
  const [justApplied, setJustApplied] = useState(null);
  const COLORS = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#0ea5e9', '#ec4899'];
  const pieData = [
    { name: 'Aportación inicial', value: Math.max(0, result.downPayment) },
    { name: 'Hipoteca', value: result.mortgageAmount },
  ];
  const costPie = [
    { name: 'ITP', value: result.acq.itp },
    { name: 'IVA', value: result.acq.iva },
    { name: 'AJD', value: result.acq.ajd },
    { name: 'Notaría + Reg.', value: result.acq.fixed },
    { name: 'Inmobiliaria', value: result.acq.agency },
    { name: 'Reformas + Mob.', value: (result.reforms||0) + (result.furniture||0) },
    { name: 'Apertura', value: result.openingFee },
  ].filter(x => x.value > 0);
  const yearlyData = useMemo(() => {
    const s = result.schedule;
    const years = {};
    s.forEach(r => {
      const y = Math.ceil(r.month / 12);
      if (!years[y]) years[y] = { year: y, interest: 0, principal: 0, balance: 0 };
      years[y].interest += r.interest;
      years[y].principal += r.principal;
      years[y].balance = r.balance;
    });
    return Object.values(years);
  }, [result.schedule]);
  const verdictBg = {
    emerald: 'bg-emerald-50 dark:bg-emerald-900/20 border-emerald-200 dark:border-emerald-800 text-emerald-900 dark:text-emerald-100',
    amber: 'bg-amber-50 dark:bg-amber-900/20 border-amber-200 dark:border-amber-800 text-amber-900 dark:text-amber-100',
    red: 'bg-red-50 dark:bg-red-900/20 border-red-200 dark:border-red-800 text-red-900 dark:text-red-100',
    slate: 'bg-slate-50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-700',
  }[result.verdictColor];
  const tabs = [['summary','Resumen'],['buyers','Por comprador'],['props','Inmuebles actuales'],['costs','Gastos'],['amort','Amortización'],['maxprice','Precios máximos'],['stress','Estrés']];
  const props = result.properties;
  const buyerName = (id) => state.buyers.find(b => b.id === id)?.name || '—';
  const hasAmortizations = result.amortizations && result.amortizations.some(a => a.amount > 0 && a.mode !== 'none');

  const applyPrice = (newPrice) => {
    setState(prev => ({ ...prev, property: { ...prev.property, price: Math.max(0, Math.round(newPrice)) } }));
    setJustApplied(newPrice);
    setTimeout(() => setJustApplied(null), 3000);
  };

  const restrictingLabel = () => {
    const candidates = [
      { key: 'savings', label: 'Ahorros', value: maxPrice.savings },
      { key: 'income', label: 'Ingresos / ratio', value: maxPrice.income },
      { key: 'ltv', label: 'LTV máximo', value: maxPrice.ltv },
      { key: 'age', label: 'Edad / plazo', value: maxPrice.age },
    ].filter(c => c.value > 0 && c.value < 4999999);
    if (candidates.length === 0) return null;
    return candidates.reduce((min, c) => c.value < min.value ? c : min, candidates[0]);
  };
  const restricting = restrictingLabel();

  return (
    <div>
      <h2 className="text-xl font-semibold text-slate-900 dark:text-white mb-1 no-print">Resultados y análisis</h2>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-6 no-print">Los cálculos se actualizan al modificar los datos.</p>

      <Card className="p-5 mb-6 bg-gradient-to-br from-brand-50 to-white dark:from-brand-900/30 dark:to-slate-900 border-brand-200 dark:border-brand-800 no-print">
        <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
          <div>
            <h3 className="font-semibold text-slate-900 dark:text-white text-lg">🎯 Aplicar precio máximo viable</h3>
          </div>
        </div>
        <div className="grid grid-cols-2 md:grid-cols-5 gap-2">
          <button onClick={() => applyPrice(maxPrice.all)} className="px-4 py-3 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium flex flex-col items-center">
            <span>🏆 Aplicar conjunto</span>
            <span className="text-xs font-normal mt-1">{fmtEur(maxPrice.all)}</span>
          </button>
          <button onClick={() => applyPrice(maxPrice.savings)} className="px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-sm font-medium flex flex-col items-center">
            <span>Ahorros</span>
            <span className="text-xs font-normal mt-1 text-slate-500">{fmtEur(maxPrice.savings)}</span>
          </button>
          <button onClick={() => applyPrice(maxPrice.income)} className="px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-sm font-medium flex flex-col items-center">
            <span>Ingresos</span>
            <span className="text-xs font-normal mt-1 text-slate-500">{fmtEur(maxPrice.income)}</span>
          </button>
          <button onClick={() => applyPrice(maxPrice.ltv)} className="px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-sm font-medium flex flex-col items-center">
            <span>LTV máximo</span>
            <span className="text-xs font-normal mt-1 text-slate-500">{maxPrice.ltv >= 4999999 ? 'Sin límite' : fmtEur(maxPrice.ltv)}</span>
          </button>
          <button onClick={() => applyPrice(maxPrice.age)} className="px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-sm font-medium flex flex-col items-center">
            <span>Edad / plazo</span>
            <span className="text-xs font-normal mt-1 text-slate-500">{maxPrice.age >= 4999999 ? 'Sin límite' : fmtEur(maxPrice.age)}</span>
          </button>
        </div>
        {restricting && (
          <div className="mt-4 text-xs text-slate-600 dark:text-slate-400">
            📌 Restricción limitante: <strong className="text-brand-700 dark:text-brand-300">{restricting.label}</strong> → precio máximo viable: <strong>{fmtEur(maxPrice.all)}</strong>
          </div>
        )}
        {justApplied !== null && (
          <div className="mt-3 p-2 rounded bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800 text-xs text-emerald-800 dark:text-emerald-200">
            ✓ Precio actualizado a <strong>{fmtEur(justApplied)}</strong>. Los cálculos se han recalculado.
          </div>
        )}
      </Card>

      <div className={"rounded-2xl border-2 p-5 mb-6 " + verdictBg}>
        <div className="flex items-start gap-4">
          <div className="text-3xl">{result.verdict === 'viable' ? '✅' : result.verdict === 'conditional' ? '⚠️' : result.verdict === 'not_viable' ? '❌' : 'ℹ️'}</div>
          <div className="flex-1">
            <h3 className="text-lg font-bold">{result.verdictLabel}</h3>
            {result.reasons.length > 0 && <ul className="mt-2 text-sm space-y-1 list-disc list-inside">{result.reasons.map((r, i) => <li key={i}>{r}</li>)}</ul>}
          </div>
        </div>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <KPI label="Precio total" value={fmtEur(result.totalPrice)} />
        <KPI label="Precio máximo" value={fmtEur(maxPrice.all)} color="brand" sub="todas las restricciones" />
        <KPI label="Aportación inicial" value={fmtEur(result.downPayment)} sub={`${fmtPct(result.totalPrice > 0 ? result.downPayment / result.totalPrice : 0, 0)} del precio`} color="brand" />
        <KPI label="Hipoteca" value={fmtEur(result.mortgageAmount)} sub={`LTV ${fmtPct(result.effectiveLtv, 0)}`} />
        <KPI label={hasAmortizations ? 'Cuota inicial' : 'Cuota mensual'} value={fmtEur2(result.payment)} color="brand" sub={hasAmortizations && result.paymentAfterFirstAmort !== result.payment ? `Tras amortizar: ${fmtEur2(result.paymentAfterFirstAmort)}` : null} />
        <KPI label="Ratio endeudamiento" value={fmtPct(result.ratioAfter)} color={result.ratioOk ? 'emerald' : 'red'} sub={`Umbral ${fmtPct(result.threshold)}`} />
        <KPI label="Margen mensual" value={fmtEur(result.monthlyMargin)} color={result.monthlyMargin > 0 ? 'emerald' : 'red'} sub={result.rentalIncomeComputable > 0 ? `Incl. alquileres: ${fmtEur(result.rentalIncomeComputable)}` : null} />
        <KPI label="Gastos de compra" value={fmtEur(result.acquisitionCosts)} color={result.liquidityOkWithoutReserve ? 'emerald' : 'red'} sub="Se paga al vendedor, banco e impuestos" />
        <KPI label="Reserva de emergencia" value={fmtEur(result.emergencyReserve)} sub="No se paga; se conserva" />
        <KPI label="Total a tener" value={fmtEur(result.totalRequired)} sub="Gastos + reserva" />
        <KPI label="Disponible" value={fmtEur(result.available)} color={result.liquidityGap <= 0 ? 'emerald' : 'red'} sub={result.liquidFromSalesBefore > 0 ? `Incl. ventas: ${fmtEur(result.liquidFromSalesBefore)}` : null} />
        <KPI label="Déficit / Excedente" value={fmtEur(-result.liquidityGap)} color={result.liquidityGap <= 0 ? 'emerald' : 'red'} sub={result.liquidityGapWithoutReserve > 0 ? `Sin contar reserva: ${fmtEur(-result.liquidityGapWithoutReserve)}` : 'Cubre gastos y reserva'} />
      </div>

      <div className="flex flex-wrap gap-2 mb-4 no-print">
        {tabs.map(([k,l]) => (
          <button key={k} className={"px-3 py-2 rounded-lg text-sm font-medium transition " + (tab===k?'bg-brand-50 dark:bg-brand-900/40 text-brand-700 dark:text-brand-200':'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800')} onClick={() => setTab(k)}>{l}</button>
        ))}

      {tab === 'summary' && (

          <Card className="p-5"><DonutChart data={pieData} colors={COLORS} /></Card>

            <h4 className="font-semibold mb-3">Flujo mensual estimado</h4>
            <div className="space-y-2 text-sm">
              <div className="flex justify-between"><span>Ingresos brutos</span><span>{fmtEur(result.rawIncome)}</span></div>
              <div className="flex justify-between text-brand-600 dark:text-brand-400"><span>Total computables</span><span>{fmtEur(result.computableIncome)}</span></div>
              <hr className="border-slate-200 dark:border-slate-800" />
              <div className="flex justify-between text-red-600 dark:text-red-400"><span>Deudas (pestaña)</span><span>−{fmtEur(result.existingDebtDebtsOnly)}</span></div>
              <div className="flex justify-between text-red-600 dark:text-red-400"><span>Cuotas hipotecas inmuebles</span><span>−{fmtEur(result.existingDebtPropertiesOnly)}</span></div>
              <div className="flex justify-between text-red-600 dark:text-red-400"><span>Nueva hipoteca</span><span>−{fmtEur(result.payment)}</span></div>
              <div className="flex justify-between text-red-600 dark:text-red-400"><span>Gastos familiares</span><span>−{fmtEur(result.monthlyExpenses)}</span></div>
              <div className="flex justify-between text-red-600 dark:text-red-400"><span>Vinculados</span><span>−{fmtEur((result.linkedAnnual||0)/12)}</span></div>
              <hr className="border-slate-200 dark:border-slate-800" />
              <div className={"flex justify-between font-bold " + (result.monthlyMargin >= 0 ? 'text-emerald-600' : 'text-red-600')}>
                <span>Margen mensual</span><span>{fmtEur(result.monthlyMargin)}</span>
              </div>
            </div>
          </Card>
        </div>
      )}

      {tab === 'buyers' && <BuyersBreakdown buyers={state.buyers} />}

      {tab === 'props' && (
        <Card className="p-5">
          <h4 className="font-semibold mb-4">Inmuebles declarados</h4>
          {props.all.length === 0 ? <p className="text-sm text-slate-500">No has declarado inmuebles.</p> : (
            <div className="space-y-3">
              {props.all.map(p => (
                <div key={p.id} className="rounded-xl border border-slate-200 dark:border-slate-800 p-4">
                  <div className="font-semibold mb-2">{p.alias}</div>
                  <div className="text-sm">Valor: {fmtEur(p.marketValue)} · Hipoteca: {fmtEur(p.mortgageOutstanding)} · Patrimonio neto: {fmtEur(p.netEquity)}</div>
                  {p.planToSell === 'keep' && p.grossRent > 0 && <div className="text-xs text-brand-600 mt-1">Renta neta computable: {fmtEur(p.netComputableRent)}/mes</div>}
                </div>
              ))}
            </div>
          )}
        </Card>
      )}

      {tab === 'costs' && (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <Card className="p-5">
            <h4 className="font-semibold mb-3">Desglose</h4>
            <div className="space-y-2 text-sm">
              <Row label="Aportación inicial (entrada)" value={result.downPayment} />
              <Row label="ITP" value={result.acq.itp} />
              <Row label="IVA" value={result.acq.iva} />
              <Row label="AJD" value={result.acq.ajd} />
              <Row label="Notaría + Registro + Tasación + Gestoría" value={result.acq.fixed} />
              <Row label="Comisión inmobiliaria" value={result.acq.agency} />
              <Row label="Reformas + Mobiliario" value={(result.reforms||0)+(result.furniture||0)} />
              <Row label="Apertura hipoteca" value={result.openingFee} />
              <Row label="Gastos de compra" value={result.acquisitionCosts} bold />
              <Row label="Reserva de emergencia" value={result.emergencyReserve} />
              <Row label="Total a tener disponible" value={result.totalRequired} bold />
              <Row label="Disponible" value={result.available} />
              <Row label="Déficit / Excedente" value={-result.liquidityGap} bold color={result.liquidityGap <= 0 ? 'emerald' : 'red'} />
            </div>
          </Card>
          <Card className="p-5"><DonutChart data={costPie} colors={COLORS} size={220} /></Card>
        </div>
      )}

      {tab === 'amort' && (
        <div className="space-y-4">
          <Card className="p-5">
            <h4 className="font-semibold mb-3">Evolución del capital pendiente</h4>
            <AreaChartSVG data={yearlyData} amortizationEvents={result.amortizations || []} />
          </Card>
          <Card className="p-5">
            <h4 className="font-semibold mb-3">Intereses vs. capital por año</h4>
            <StackedBarChart data={yearlyData} />
          </Card>
        </div>
      )}

      {tab === 'maxprice' && (
        <Card className="p-5">
          <h4 className="font-semibold mb-4">Precio máximo por tipo de restricción</h4>
          <HBarChart data={[
            { label: 'Ahorros', value: maxPrice.savings, color: '#6366f1' },
            { label: 'Ingresos', value: maxPrice.income, color: '#10b981' },
            { label: 'LTV máximo', value: maxPrice.ltv, color: '#f59e0b' },
            { label: 'Edad / plazo', value: maxPrice.age, color: '#8b5cf6' },
            { label: 'Conjunto', value: maxPrice.all, color: '#4f46e5' },
          ]} />
          <p className="text-xs text-slate-500 mt-4">"Sin límite" = con tus datos actuales, esta restricción no reduce el precio por debajo del conjunto.</p>
        </Card>
      )}

      {tab === 'stress' && <StressTab state={state} />}
    </div>
  );
};

/* ---------- GUARDADAS ---------- */
const SavedSection = ({ state, setState, list, setList }) => {
  const [name, setName] = useState('');
  const [message, setMessage] = useState(null);
  const fileRef = useRef();

  const showMessage = (type, text) => {
    setMessage({ type, text });
    setTimeout(() => setMessage(null), 4000);
  };

  const save = () => {
    const n = name.trim() || 'Simulación ' + new Date().toLocaleString('es-ES');
    const id = 'sim_' + Date.now();
    const newList = { ...list, [id]: { id, name: n, savedAt: new Date().toISOString(), state: { ...state, simName: n } } };
    setList(newList);
    localStorage.setItem(LS_LIST, JSON.stringify(newList));
    setName('');
    showMessage('ok', 'Guardada: ' + n);
  };

  const load = (id) => {
    const s = list[id];
    if (!s) return;
    if (!confirm(`¿Cargar "${s.name}"?`)) return;
    setState(normalizeState(s.state));
    showMessage('ok', 'Cargada: ' + s.name);
  };

  const del = (id) => {
    if (!confirm('¿Eliminar?')) return;
    const n = { ...list };
    delete n[id];
    setList(n);
    localStorage.setItem(LS_LIST, JSON.stringify(n));
  };

  const exportFile = () => {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
    const a = document.createElement('a');
    a.href = dataStr;
    a.download = `simulacion_hipoteca_${new Date().toISOString().split('T')[0]}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showMessage('ok', 'Archivo exportado correctamente.');
  };

  const importFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const json = JSON.parse(event.target.result);
        setState(normalizeState(json));
        showMessage('ok', 'Archivo importado correctamente.');
      } catch (err) {
        showMessage('error', 'Error al leer el archivo JSON.');
      }
    };
    reader.readAsText(file);
    e.target.value = null;
  };

  return (
    <div>
      <h2 className="text-xl font-semibold text-slate-900 dark:text-white mb-1">Simulaciones guardadas</h2>
      {message && <div className={"mb-4 p-3 rounded-lg text-sm border " + (message.type === 'ok' ? 'bg-emerald-50 text-emerald-800' : 'bg-red-50 text-red-800')}>{message.text}</div>}
      
      <Card className="p-5 mb-6">
        <div className="flex flex-col md:flex-row gap-3 mb-4">
          <input className={inputCls + " flex-1"} placeholder="Nombre (opcional)" value={name} onChange={e => setName(e.target.value)} />
          <button className="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium" onClick={save}>Guardar en navegador</button>
        </div>
        <div className="flex flex-col md:flex-row gap-3 pt-4 border-t border-slate-200 dark:border-slate-800">
          <button className="px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-sm font-medium flex-1" onClick={exportFile}>
            ⬇️ Exportar JSON (Descargar archivo)
          </button>
          <button className="px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-sm font-medium flex-1" onClick={() => fileRef.current.click()}>
            ⬆️ Importar JSON (Subir archivo)
          </button>
          <input type="file" ref={fileRef} className="hidden" accept=".json" onChange={importFile} />
        </div>
      </Card>

      <Card className="p-5">
        {Object.keys(list).length === 0 ? <p className="text-sm text-slate-500">No hay simulaciones guardadas en el navegador.</p> : (
          <div className="space-y-3">
            {Object.values(list).sort((a,b) => b.savedAt.localeCompare(a.savedAt)).map(s => (
              <div key={s.id} className="flex flex-col md:flex-row md:items-center gap-3 p-3 rounded-xl border border-slate-200">
                <div className="flex-1">
                  <div className="font-semibold">{s.name}</div>
                  <div className="text-xs text-slate-500">{new Date(s.savedAt).toLocaleString('es-ES')} · {fmtEur(s.state?.property?.price || 0)}</div>
                </div>
                <div className="flex gap-2">
                  <button className="px-3 py-1.5 rounded-lg bg-brand-600 text-white text-sm" onClick={() => load(s.id)}>Cargar</button>
                  <button className="px-3 py-1.5 rounded-lg bg-red-50 text-red-600 text-sm" onClick={() => del(s.id)}>Eliminar</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>
    </div>
  );
};

/* ---------- APP ---------- */
function App() {
  const [state, setState] = useState(loadCurrent);
  const [tab, setTab] = useState('buyers');
  const [dark, setDark] = useState(false);
  const [list, setList] = useState(loadList);
  const [showAviso, setShowAviso] = useState(true);
  const [printMode, setPrintMode] = useState(null);

  useEffect(() => { localStorage.setItem(LS_KEY, JSON.stringify(state)); }, [state]);
  useEffect(() => { document.documentElement.classList.toggle('dark', dark); }, [dark]);

  useEffect(() => {
    setState(prev => {
      let changed = false;
      const newBuyers = prev.buyers.map(b => {
        if (b.savings.willingCustom) return b;
        const liquid = computeLiquidSavings(b.savings);
        if (liquid !== b.savings.willingToUse) {
          changed = true;
          return { ...b, savings: { ...b.savings, willingToUse: liquid } };
        }
        return b;
      });
      if (!changed) return prev;
      return { ...prev, buyers: newBuyers };
    });
  }, [
    JSON.stringify(state.buyers.map(b => ({
      id: b.id,
      cash: b.savings.cash, deposits: b.savings.deposits, funds: b.savings.funds,
      stocks: b.savings.stocks, crypto: b.savings.crypto, otherLiquid: b.savings.otherLiquid,
      pensionPlans: b.savings.pensionPlans, pensionAvailable: b.savings.pensionAvailable,
    })))
  ]);

  const result = useMemo(() => evaluateOperation(state), [state]);
  const maxPrice = useMemo(() => ({
    savings: computeMaxPrice(state, 'savings'),
    income: computeMaxPrice(state, 'income'),
    ltv: computeMaxPrice(state, 'ltv'),
    age: computeMaxPrice(state, 'age'),
    all: computeMaxPrice(state, 'all'),
  }), [state]);

  const removeDuplicateDebt = (debtId) => {
    setState(prev => ({ ...prev, debts: prev.debts.filter(d => d.id !== debtId) }));
  };

  const triggerPrint = (mode) => {
    setPrintMode(mode);
    setTimeout(() => {
      window.print();
      setTimeout(() => setPrintMode(null), 1000);
    }, 200);
  };

  const tabs = [
    { id: 'buyers', label: 'Compradores', icon: '👥' },
    { id: 'savings', label: 'Ahorros', icon: '💰' },
    { id: 'properties', label: 'Inmuebles en propiedad', icon: '🏘️' },
    { id: 'debts', label: 'Deudas y gastos', icon: '📋' },
    { id: 'property', label: 'Inmueble a comprar', icon: '🏠' },
    { id: 'mortgage', label: 'Hipoteca', icon: '🏦' },
    { id: 'results', label: 'Resultados', icon: '📊' },
    { id: 'saved', label: 'Guardadas', icon: '💾' },
  ];

  const progress = useMemo(() => {
    let done = 0, total = 0;
    const check = (v) => { total++; if (v) done++; };
    check(state.buyers.length > 0);
    state.buyers.forEach(b => { check(b.monthlyNetSalary > 0); check(b.birthDate); });
    check(state.buyers.some(b => computeLiquidSavings(b.savings) > 0));
    check(state.property.price > 0);
    check(state.mortgage.tin >= 0 && state.mortgage.termYears > 0);
    check(result.computableIncome > 0);
    return Math.round((done / total) * 100);
  }, [state, result]);

  return (
    <div className="min-h-screen flex flex-col lg:flex-row">
      {printMode && <PrintReport state={state} result={result} maxPrice={maxPrice} mode={printMode} />}

      <aside className="lg:w-72 lg:fixed lg:inset-y-0 bg-white dark:bg-slate-900 border-b lg:border-b-0 lg:border-r border-slate-200 dark:border-slate-800 overflow-y-auto no-print">
        <div className="p-5 border-b border-slate-200 dark:border-slate-800">
          <div className="flex items-center gap-2">
            <div className="w-9 h-9 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold">V</div>
            <div>
              <div className="font-bold text-slate-900 dark:text-white text-sm">Viabilidad Hipotecaria</div>
              <div className="text-xs text-slate-500">Simulador España</div>
            </div>
          </div>
        </div>
        <nav className="p-3 space-y-1">
          {tabs.map(t => (
            <div key={t.id}
              className={"flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium cursor-pointer transition " + (tab === t.id ? 'bg-brand-50 dark:bg-brand-900/40 text-brand-700 dark:text-brand-200' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800')}
              onClick={() => setTab(t.id)}>
              <span>{t.icon}</span><span>{t.label}</span>
            </div>
          ))}
        </nav>
        <div className="p-5 border-t border-slate-200 dark:border-slate-800">
          <div className="flex items-center justify-between text-xs text-slate-500 mb-2">
            <span>Progreso</span><span className="font-semibold">{progress}%</span>
          </div>
          <div className="w-full h-2 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
            <div className="h-full bg-brand-600 transition-all" style={{ width: progress + '%' }}></div>
          </div>
          <button className="mt-4 w-full px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-sm font-medium" onClick={() => setDark(!dark)}>
            {dark ? '☀️ Modo claro' : '🌙 Modo oscuro'}
          </button>
          <div className="mt-4 space-y-2 border-t border-slate-200 dark:border-slate-800 pt-4">
            <div className="text-xs uppercase tracking-wide text-slate-500 font-semibold mb-2">📄 Informes PDF</div>
            <button className="w-full px-3 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white text-xs font-medium" onClick={() => triggerPrint('full')}>📄 Informe completo</button>
            <button className="w-full px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium" onClick={() => triggerPrint('bank')}>🏦 Informe para el banco</button>
            <div className="text-xs text-slate-400 text-center mt-2">Elige <strong>Guardar como PDF</strong>.</div>
          </div>
        </div>
      </aside>
      <main className="lg:ml-72 flex-1 p-4 md:p-8 max-w-6xl mx-auto w-full">
        {showAviso && (
          <Card className="p-4 mb-6 border-l-4 border-amber-400 bg-amber-50/50 dark:bg-amber-900/10 no-print">
            <div className="flex items-start gap-3">
              <div className="text-xl">ℹ️</div>
              <div className="flex-1 text-sm text-slate-700 dark:text-slate-300"><strong>Aviso:</strong> herramienta orientativa. No constituye asesoramiento financiero ni fiscal. Verifica tipos y condiciones con profesionales.</div>
              <button className="text-slate-400 hover:text-slate-600" onClick={() => setShowAviso(false)}>×</button>
            </div>
          </Card>
        )}
        {tab === 'buyers' && <BuyersSection buyers={state.buyers} setBuyers={v => setState({ ...state, buyers: v })} />}
        {tab === 'savings' && <SavingsSection buyers={state.buyers} setBuyers={v => setState({ ...state, buyers: typeof v === 'function' ? v(state.buyers) : v })} />}
        {tab === 'properties' && <PropertiesSection buyers={state.buyers} setBuyers={v => setState({ ...state, buyers: typeof v === 'function' ? v(state.buyers) : v })} duplicateDebts={result.duplicateDebts} onRemoveDuplicateDebt={removeDuplicateDebt} />}
        {tab === 'debts' && <DebtsSection debts={state.debts} setDebts={v => setState({ ...state, debts: v })} monthlyExpenses={state.monthlyExpenses} setMonthlyExpenses={v => setState({ ...state, monthlyExpenses: v })} />}
        {tab === 'property' && <PropertySection property={state.property} setProperty={v => setState({ ...state, property: v })} tax={state.tax} setTax={v => setState({ ...state, tax: v })} />}
        {tab === 'mortgage' && <MortgageSection mortgage={state.mortgage} setMortgage={v => setState({ ...state, mortgage: v })} property={state.property} amortizations={result.amortizations} />}
        {tab === 'results' && <ResultsSection state={state} result={result} maxPrice={maxPrice} setState={setState} />}
        {tab === 'saved' && <SavedSection state={state} setState={setState} list={list} setList={setList} />}
        <footer className="mt-12 pt-6 border-t border-slate-200 dark:border-slate-800 text-xs text-slate-500 no-print">
          <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-2">
            <span>Simulador de Viabilidad Hipotecaria · Datos solo en tu navegador.</span>
            <button className="hover:text-brand-600" onClick={() => { if (confirm('¿Resetear todo?')) { localStorage.clear(); setState(INITIAL_STATE); setList({}); } }}>Resetear</button>
          </div>
        </footer>
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
