const { useState, useMemo, useEffect, useRef } = React;

/* ---------- FORMATEO ---------- */
const fmtEur = (n) => (n==null||isNaN(n)) ? '—' : new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
const fmtEur2 = (n) => (n==null||isNaN(n)) ? '—' : new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const fmtPct = (n,d=1) => (n==null||isNaN(n)) ? '—' : new Intl.NumberFormat('es-ES',{style:'percent',minimumFractionDigits:d,maximumFractionDigits:d}).format(n);

/* ---------- MOTOR FINANCIERO ---------- */
const monthlyPayment = (principal, annualRatePct, months) => {
  if (months <= 0 || principal <= 0) return 0;
  const r = annualRatePct / 100 / 12;
  if (r === 0) return principal / months;
  const f = Math.pow(1 + r, months);
  return (principal * r * f) / (f - 1);
};

/* Meses necesarios para pagar 'principal' a cuota fija 'targetPayment' */
const monthsForPayment = (principal, annualRatePct, targetPayment) => {
  if (principal <= 0) return 0;
  if (targetPayment <= 0) return 0;
  const r = annualRatePct / 100 / 12;
  if (r === 0) return Math.ceil(principal / targetPayment);
  // Interés mensual: si targetPayment <= balance * r, la deuda crecería → imposible
  if (targetPayment <= principal * r) return Infinity;
  // n = -ln(1 - P*r/payment) / ln(1+r)
  const x = 1 - (principal * r) / targetPayment;
  if (x <= 0) return Infinity;
  const n = -Math.log(x) / Math.log(1 + r);
  return Math.ceil(n);
};

const amortizationSchedule = (principal, annualRatePct, months) => {
  const payment = monthlyPayment(principal, annualRatePct, months);
  const r = annualRatePct / 100 / 12;
  let balance = principal;
  const rows = [];
  for (let m = 1; m <= months; m++) {
    const interest = balance * r;
    const principalPart = Math.min(payment - interest, balance);
    balance = Math.max(0, balance - principalPart);
    rows.push({ month: m, payment, interest, principal: principalPart, balance });
  }
  return rows;
};

/* Cuadro a cuota fija y plazo variable (hasta 60 años máximo) */
const amortizationScheduleFixedPayment = (principal, annualRatePct, targetPayment) => {
  const r = annualRatePct / 100 / 12;
  if (principal <= 0 || targetPayment <= 0) return [];
  let balance = principal;
  const rows = [];
  const maxMonths = 12 * 60;
  for (let m = 1; m <= maxMonths; m++) {
    const interest = balance * r;
    const principalPart = Math.min(targetPayment - interest, balance);
    balance = Math.max(0, balance - principalPart);
    rows.push({ month: m, payment: targetPayment, interest, principal: principalPart, balance });
    if (balance < 0.01) break;
  }
  return rows;
};

const totalInterest = (rows) => rows.reduce((s, r) => s + r.interest, 0);

const applyPartialAmortization = (schedule, atMonth, amount, mode, annualRatePct) => {
  if (!amount || amount <= 0 || atMonth <= 0 || atMonth > schedule.length) return schedule;
  if (mode === 'none') return schedule;
  const r = annualRatePct / 100 / 12;
  const head = schedule.slice(0, atMonth).map(row => ({ ...row }));
  const lastBeforeRow = head[head.length - 1];
  const newBalance = Math.max(0, lastBeforeRow.balance - amount);
  const amortRow = {
    month: atMonth,
    payment: lastBeforeRow.payment,
    interest: lastBeforeRow.interest,
    principal: lastBeforeRow.principal + (lastBeforeRow.balance - newBalance),
    balance: newBalance,
    isAmortization: true,
    amortizationAmount: amount,
  };
  const baseSchedule = [...head.slice(0, -1), amortRow];
  if (newBalance <= 0) return baseSchedule;
  if (mode === 'reduce_cuota') {
    const remainingMonths = schedule.length - atMonth;
    const newPayment = monthlyPayment(newBalance, annualRatePct, remainingMonths);
    let bal = newBalance;
    const rest = [];
    for (let i = 1; i <= remainingMonths; i++) {
      const interest = bal * r;
      const principalPart = Math.min(newPayment - interest, bal);
      bal = Math.max(0, bal - principalPart);
      rest.push({ month: atMonth + i, payment: newPayment, interest, principal: principalPart, balance: bal });
    }
    return [...baseSchedule, ...rest];
  }
  if (mode === 'reduce_plazo') {
    const oldPayment = lastBeforeRow.payment;
    let bal = newBalance;
    const rest = [];
    let m = atMonth + 1;
    while (bal > 0.01 && m <= atMonth + 12 * 60) {
      const interest = bal * r;
      const principalPart = Math.min(oldPayment - interest, bal);
      bal = Math.max(0, bal - principalPart);
      rest.push({ month: m, payment: oldPayment, interest, principal: principalPart, balance: bal });
      m++;
    }
    return [...baseSchedule, ...rest];
  }
  return schedule;
};

const applyAllAmortizations = (baseSchedule, amortizations, annualRatePct) => {
  if (!amortizations || amortizations.length === 0) return baseSchedule;
  const active = amortizations
    .filter(a => a.amount > 0 && a.month > 0 && a.mode !== 'none')
    .sort((a, b) => a.month - b.month);
  if (active.length === 0) return baseSchedule;
  let schedule = baseSchedule;
  let shiftedMonth = 0;
  for (const a of active) {
    const atMonth = a.month + shiftedMonth;
    if (atMonth > schedule.length) continue;
    const before = schedule.length;
    schedule = applyPartialAmortization(schedule, atMonth, a.amount, a.mode, annualRatePct);
    if (a.mode === 'reduce_plazo') shiftedMonth += (before - schedule.length);
  }
  return schedule;
};

const ITP_BY_REGION = {
  'Andalucía': 7, 'Aragón': 8, 'Asturias': 8, 'Baleares': 8, 'Canarias': 6.5,
  'Cantabria': 10, 'Castilla-La Mancha': 9, 'Castilla y León': 8, 'Cataluña': 10,
  'Extremadura': 8, 'Galicia': 8, 'La Rioja': 7, 'Madrid': 6, 'Murcia': 8,
  'Navarra': 6, 'País Vasco': 4, 'Comunidad Valenciana': 9, 'Ceuta': 6, 'Melilla': 6
};
const REGIONS = Object.keys(ITP_BY_REGION);

const computeAcquisitionCosts = (params) => {
  const { price, isNew, region, itpPct, ivaPct, ajdPct, notary, registry, appraisal, gestoria, agencyFee, otherCosts, useManual } = params;
  const itp = !isNew ? price * (useManual ? itpPct : (ITP_BY_REGION[region] ?? 8)) / 100 : 0;
  const iva = isNew ? price * (useManual ? ivaPct : 10) / 100 : 0;
  const ajd = isNew ? price * (useManual ? ajdPct : 1.5) / 100 : 0;
  const fixed = (notary||0)+(registry||0)+(appraisal||0)+(gestoria||0);
  const agency = agencyFee || 0;
  const other = otherCosts || 0;
  return { itp, iva, ajd, fixed, agency, other, total: itp+iva+ajd+fixed+agency+other };
};

const computeComputableIncome = (buyers) => buyers.reduce((sum, b) => {
  const salary = (b.monthlyNetSalary||0) * ((b.computablePct?.salary ?? 100)/100);
  const variable = (b.variableIncome||0) * ((b.computablePct?.variable ?? 80)/100);
  const rental = (b.rentalIncome||0) * ((b.computablePct?.rental ?? 80)/100);
  const other = (b.otherIncome||0) * ((b.computablePct?.other ?? 100)/100);
  return sum + salary + variable + rental + other;
}, 0);

const computeRawIncome = (buyers) => buyers.reduce((s, b) =>
  s + (b.monthlyNetSalary||0) + (b.variableIncome||0) + (b.rentalIncome||0) + (b.otherIncome||0), 0);

const computeLiquidSavings = (s) => {
  if (!s) return 0;
  let total = (s.cash||0)+(s.deposits||0)+(s.funds||0)+(s.stocks||0)+(s.crypto||0)+(s.otherLiquid||0);
  if (s.pensionAvailable) total += (s.pensionPlans||0);
  return total;
};
const computeTotalPatrimony = (s) => {
  if (!s) return 0;
  return (s.cash||0)+(s.deposits||0)+(s.funds||0)+(s.stocks||0)+(s.crypto||0)+(s.pensionPlans||0)+(s.otherLiquid||0)+(s.otherIlliquid||0);
};

const aggregateSavings = (buyers) => {
  const keys = ['cash','deposits','funds','stocks','crypto','pensionPlans','otherLiquid','otherIlliquid','willingToUse','emergencyReserve'];
  const agg = {};
  keys.forEach(k => { agg[k] = buyers.reduce((s, b) => s + (Number(b.savings?.[k]) || 0), 0); });
  agg.pensionAvailable = buyers.some(b => b.savings?.pensionAvailable);
  return agg;
};

const findDuplicateMortgageDebts = (buyers, debts) => {
  const duplicates = [];
  const properties = [];
  buyers.forEach(b => (b.properties || []).forEach(p => {
    if ((Number(p.mortgageOutstanding) || 0) > 0) {
      properties.push({ buyerId: b.id, buyerName: b.name, propertyId: p.id, propertyAlias: p.alias, amount: Number(p.mortgageOutstanding) });
    }
  }));
  debts.forEach(d => {
    if (d.type !== 'hipoteca') return;
    const amt = Number(d.outstanding) || 0;
    if (amt <= 0) return;
    const match = properties.find(p => Math.abs(p.amount - amt) < 1);
    if (match) {
      duplicates.push({ debtId: d.id, debtAmount: amt, propertyId: match.propertyId, propertyAlias: match.propertyAlias, buyerName: match.buyerName });
    }
  });
  return duplicates;
};

const summarizeProperties = (buyers) => {
  const all = [];
  buyers.forEach(b => {
    (b.properties || []).forEach(p => {
      const ownerships = (p.ownerships && p.ownerships.length > 0)
        ? p.ownerships
        : [{ buyerId: b.id, pct: 100 }];
      all.push({ ...p, ownerships, _declaredBy: b.id });
    });
  });

  const enriched = all.map(p => {
    const totalPct = p.ownerships.reduce((s, o) => s + (Number(o.pct) || 0), 0);
    const netEquity = Math.max(0, (Number(p.marketValue)||0) - (Number(p.mortgageOutstanding)||0));

    const grossRent = Number(p.netRentalIncome) || 0;
    const computablePct = p.rentalComputablePct != null ? Number(p.rentalComputablePct) : 80;
    const expenses = Number(p.rentalMonthlyExpenses) || 0;
    const computableRent = grossRent * (computablePct / 100);
    const netComputableRent = Math.max(0, computableRent - expenses);

    const perOwner = p.ownerships.map(o => {
      const pct = totalPct > 0 ? (Number(o.pct)||0) / totalPct : 0;
      return {
        buyerId: o.buyerId,
        pct,
        netEquityShare: netEquity * pct,
        collateralShare: p.usedAsCollateral && (p.collateralBuyerId === o.buyerId || !p.collateralBuyerId)
          ? (Number(p.collateralValue)||0) * pct
          : (p.usedAsCollateral && p.collateralBuyerId === o.buyerId ? Number(p.collateralValue)||0 : 0),
        rentalShare: netComputableRent * pct,
        saleNetShare: Math.max(0,
          (Number(p.sellPrice) || Number(p.marketValue) || 0)
          - (Number(p.sellCosts)||0) - (Number(p.sellTaxes)||0)
          - (Number(p.mortgageOutstanding)||0)
        ) * pct,
      };
    });

    let collateralAttributed = null;
    if (p.usedAsCollateral && p.collateralBuyerId) {
      collateralAttributed = { buyerId: p.collateralBuyerId, amount: Number(p.collateralValue)||0 };
    }

    const saleNet = Math.max(0,
      (Number(p.sellPrice) || Number(p.marketValue) || 0)
      - (Number(p.sellCosts)||0) - (Number(p.sellTaxes)||0)
      - (Number(p.mortgageOutstanding)||0)
    );

    return {
      ...p, totalPct, netEquity, perOwner, collateralAttributed, saleNet,
      grossRent, computablePct, expenses, computableRent, netComputableRent,
    };
  });

  const totalMarketValue = enriched.reduce((s, p) => s + (Number(p.marketValue)||0), 0);
  const totalMortgageOutstanding = enriched.reduce((s, p) => s + (Number(p.mortgageOutstanding)||0), 0);
  const totalNetEquity = enriched.reduce((s, p) => s + p.netEquity, 0);
  const collaterals = enriched.filter(p => p.usedAsCollateral);
  const totalCollateralValue = collaterals.reduce((s, p) => s + (Number(p.collateralValue)||0), 0);

  const toSellBefore = enriched.filter(p => p.planToSell === 'sell_before');
  const liquidFromSalesBefore = toSellBefore.reduce((s, p) => s + p.saleNet, 0);

  const toSellAfter = enriched.filter(p => p.planToSell === 'sell_after');
  const netFromSalesAfter = toSellAfter.reduce((s, p) => s + p.saleNet, 0);

  const amortizations = toSellAfter.map(p => {
    const pct = Number(p.sellAmortizePct ?? 100) / 100;
    return {
      propertyId: p.id,
      propertyAlias: p.alias,
      month: Number(p.sellMonth) || 24,
      totalNet: p.saleNet,
      amount: p.saleNet * pct,
      keep: p.saleNet * (1 - pct),
      mode: p.sellAmortizeMode || 'reduce_cuota',
      pct: Number(p.sellAmortizePct ?? 100),
    };
  });

  const keptProperties = enriched.filter(p => p.planToSell === 'keep');
  const rentalNetComputableMonthly = keptProperties.reduce((s, p) => s + p.netComputableRent, 0);
  const rentalGrossMonthly = keptProperties.reduce((s, p) => s + p.grossRent, 0);
  const propertyMortgagePayments = enriched.reduce((s, p) => s + (Number(p.mortgageMonthlyPayment) || 0), 0);

  return {
    all: enriched, totalMarketValue, totalMortgageOutstanding, totalNetEquity,
    collaterals, totalCollateralValue,
    toSellBefore, liquidFromSalesBefore,
    toSellAfter, netFromSalesAfter, amortizations,
    keptProperties, rentalNetComputableMonthly, rentalGrossMonthly, propertyMortgagePayments
  };
};

const computeDebtTotalRaw = (debts) => debts.reduce((s, d) => s + (d.monthlyPayment||0), 0);
const computeDebtTotal = (debts, buyers) => {
  const dupes = findDuplicateMortgageDebts(buyers, debts);
  const dupeIds = new Set(dupes.map(d => d.debtId));
  return debts.reduce((s, d) => s + (dupeIds.has(d.id) ? 0 : (d.monthlyPayment||0)), 0);
};
const computeMonthlyExpenses = (e) => Object.values(e).reduce((s, v) => s + (Number(v)||0), 0);

const ageAtMaturity = (birthDateISO, termYears) => {
  if (!birthDateISO) return null;
  const birth = new Date(birthDateISO);
  if (isNaN(birth.getTime())) return null;
  const ageNow = (Date.now() - birth.getTime()) / (365.25 * 24 * 3600 * 1000);
  return ageNow + termYears;
};

/* ---------- CÁLCULO DEL CUADRO CON CUOTA OBJETIVO ---------- */
/* Construye el cuadro de la nueva hipoteca aplicando:
   - Si targetPaymentBefore > 0: plazo se recalcula para que la cuota = targetPaymentBefore
   - Si targetPaymentAfter > 0 y hay amortización: tras la amortización, plazo restante se recalcula
     para que la cuota = targetPaymentAfter
   - Si no se especifica, comportamiento clásico (plazo fijo, cuota francesa). */
const buildMortgageSchedule = (mortgageAmount, annualRatePct, baseMonths, amortizations, opts = {}) => {
  const { targetPaymentBefore = 0, targetPaymentAfter = 0 } = opts;
  const r = annualRatePct / 100 / 12;

  // Determinar plazo base (o a partir de cuota objetivo)
  let months = baseMonths;
  let basePayment;
  if (targetPaymentBefore > 0 && mortgageAmount > 0) {
    const n = monthsForPayment(mortgageAmount, annualRatePct, targetPaymentBefore);
    if (isFinite(n) && n > 0) { months = n; basePayment = targetPaymentBefore; }
    else { basePayment = monthlyPayment(mortgageAmount, annualRatePct, baseMonths); }
  } else {
    basePayment = monthlyPayment(mortgageAmount, annualRatePct, baseMonths);
  }

  // Cuadro base
  let schedule = [];
  let balance = mortgageAmount;
  for (let m = 1; m <= months; m++) {
    const interest = balance * r;
    const principalPart = Math.min(basePayment - interest, balance);
    balance = Math.max(0, balance - principalPart);
    schedule.push({ month: m, payment: basePayment, interest, principal: principalPart, balance });
    if (balance < 0.01) break;
  }

  // Aplicar amortizaciones en orden
  if (amortizations && amortizations.length > 0) {
    const active = amortizations
      .filter(a => a.amount > 0 && a.month > 0 && a.mode !== 'none')
      .sort((a, b) => a.month - b.month);
    for (const a of active) {
      const atMonth = a.month;
      if (atMonth > schedule.length) continue;

      const head = schedule.slice(0, atMonth).map(row => ({ ...row }));
      const lastBefore = head[head.length - 1];
      const newBalance = Math.max(0, lastBefore.balance - a.amount);
      const amortRow = {
        month: atMonth,
        payment: lastBefore.payment,
        interest: lastBefore.interest,
        principal: lastBefore.principal + (lastBefore.balance - newBalance),
        balance: newBalance,
        isAmortization: true,
        amortizationAmount: a.amount,
      };
      let currentSchedule = [...head.slice(0, -1), amortRow];
      if (newBalance <= 0) { schedule = currentSchedule; continue; }

      // Aplicar el modo. Pero si targetPaymentAfter está definido, sobrescribe reduce_cuota
      let effectiveMode = a.mode;
      let targetAfter = 0;
      if (targetPaymentAfter > 0 && a.mode === 'reduce_cuota') {
        // Si hay objetivo de cuota tras amortizar, lo respetamos
        targetAfter = targetPaymentAfter;
      }

      if (effectiveMode === 'reduce_cuota') {
        let newPayment;
        let remainingMonths;
        if (targetAfter > 0) {
          // Calcular plazo para nueva cuota objetivo
          const n = monthsForPayment(newBalance, annualRatePct, targetAfter);
          if (isFinite(n) && n > 0) { remainingMonths = n; newPayment = targetAfter; }
          else {
            remainingMonths = Math.max(1, schedule.length - atMonth);
            newPayment = monthlyPayment(newBalance, annualRatePct, remainingMonths);
          }
        } else {
          remainingMonths = Math.max(1, schedule.length - atMonth);
          newPayment = monthlyPayment(newBalance, annualRatePct, remainingMonths);
        }
        let bal = newBalance;
        for (let i = 1; i <= remainingMonths; i++) {
          const interest = bal * r;
          const pp = Math.min(newPayment - interest, bal);
          bal = Math.max(0, bal - pp);
          currentSchedule.push({ month: atMonth + i, payment: newPayment, interest, principal: pp, balance: bal });
          if (bal < 0.01) break;
        }
      } else if (effectiveMode === 'reduce_plazo') {
        const oldPayment = lastBefore.payment;
        let bal = newBalance;
        let m = atMonth + 1;
        while (bal > 0.01 && m <= atMonth + 12 * 60) {
          const interest = bal * r;
          const pp = Math.min(oldPayment - interest, bal);
          bal = Math.max(0, bal - pp);
          currentSchedule.push({ month: m, payment: oldPayment, interest, principal: pp, balance: bal });
          m++;
        }
      }
      schedule = currentSchedule;
    }
  }
  return schedule;
};

const evaluateOperation = (state, override = {}) => {
  const price = override.price ?? state.property.price;
  const termYears = override.termYears ?? state.mortgage.termYears;
  const tin = override.tin ?? state.mortgage.tin;
  const { buyers, debts, monthlyExpenses, mortgage: m, tax, property } = state;
  const savings = aggregateSavings(buyers);
  const props = summarizeProperties(buyers);

  const months = termYears * 12;
  const downPaymentPct = override.downPaymentPct ?? m.downPaymentPct;
  const maxLtv = override.maxLtv ?? m.maxLtv;

  const acq = computeAcquisitionCosts({
    price, isNew: property.isNew, region: property.region,
    itpPct: tax.itpPct, ivaPct: tax.ivaPct, ajdPct: tax.ajdPct,
    notary: tax.notary, registry: tax.registry, appraisal: tax.appraisal, gestoria: tax.gestoria,
    agencyFee: property.agencyFee, otherCosts: property.otherInitialCosts,
    useManual: tax.mode === 'manual'
  });

  const reforms = property.reforms || 0;
  const furniture = property.furniture || 0;
  const anexos = (property.garagePrice||0) + (property.storagePrice||0);
  const totalPrice = price + anexos;

  const maxMortgageByLtv = totalPrice * (maxLtv / 100);
  const desiredDownPayment = totalPrice * (downPaymentPct / 100);
  const desiredMortgage = totalPrice - desiredDownPayment;
  const mortgageAmount = Math.max(0, Math.min(desiredMortgage, maxMortgageByLtv));
  const downPaymentReal = totalPrice - mortgageAmount;
  const effectiveLtv = totalPrice > 0 ? mortgageAmount / totalPrice : 0;
  const ltvCapped = desiredMortgage > maxMortgageByLtv + 0.01;

  const openingFee = mortgageAmount * (m.openingFeePct || 0) / 100;
  const linkedAnnual = m.linkedProductsAnnual || 0;

  const liquidSavings = computeLiquidSavings(savings);
  const willingToUse = savings.willingToUse;
  const baseAvailable = (willingToUse > 0) ? Math.min(liquidSavings, willingToUse) : liquidSavings;
  const available = baseAvailable + props.liquidFromSalesBefore;

  const acquisitionCosts = downPaymentReal + acq.total + reforms + furniture + openingFee;
  const emergencyReserve = savings.emergencyReserve || 0;
  const totalNeeded = acquisitionCosts;
  const totalRequired = acquisitionCosts + emergencyReserve;
  const liquidityGap = totalRequired - available;
  const liquidityGapWithoutReserve = totalNeeded - available;

  /* ===== Construcción del cuadro con/sin cuota objetivo ===== */
  const targetPaymentBefore = Number(m.targetPaymentBefore) || 0;
  const targetPaymentAfter = Number(m.targetPaymentAfter) || 0;
  const amortizations = props.amortizations || [];

  const baseSchedule = amortizationSchedule(mortgageAmount, tin, months);
  const basePayment = monthlyPayment(mortgageAmount, tin, months);
  const baseInterestTotal = totalInterest(baseSchedule);

  const schedule = buildMortgageSchedule(mortgageAmount, tin, months, amortizations, {
    targetPaymentBefore,
    targetPaymentAfter,
  });
  const interestTotal = totalInterest(schedule);

  const firstRow = schedule[0] || { payment: basePayment };
  const payment = firstRow.payment;
  const effectiveMonths = schedule.length;
  const effectiveYears = effectiveMonths / 12;

  // Cuota después de la primera amortización (si reduce_cuota)
  const firstAmort = amortizations.filter(a => a.amount > 0 && a.mode === 'reduce_cuota').sort((a,b) => a.month - b.month)[0];
  let paymentAfterFirstAmort = payment;
  if (firstAmort) {
    const row = schedule.find(r => r.month === firstAmort.month + 1);
    if (row) paymentAfterFirstAmort = row.payment;
  }

  const totalAmortizedBySales = amortizations.reduce((s, a) => s + (a.mode === 'none' ? 0 : a.amount), 0);
  const totalKeptFromSales = amortizations.reduce((s, a) => s + (a.mode === 'none' ? 0 : a.keep), 0);

  const salaryIncomeComputable = computeComputableIncome(buyers);
  const rentalIncomeComputable = props.rentalNetComputableMonthly;
  const computableIncome = salaryIncomeComputable + rentalIncomeComputable;
  const rawIncome = computeRawIncome(buyers) + props.rentalGrossMonthly;

  const existingDebtDebtsOnly = computeDebtTotal(debts, buyers);
  const existingDebtPropertiesOnly = props.propertyMortgagePayments;
  const existingDebt = existingDebtDebtsOnly + existingDebtPropertiesOnly;

  const rawDebtsTotal = computeDebtTotalRaw(debts);
  const excludedDuplicatesTotal = rawDebtsTotal - existingDebtDebtsOnly;
  const duplicateDebts = findDuplicateMortgageDebts(buyers, debts);

  const monthlyExpensesTotal = computeMonthlyExpenses(monthlyExpenses);

  const ratioBefore = computableIncome > 0 ? existingDebt / computableIncome : 0;
  const totalDebtAfter = existingDebt + payment;
  const ratioAfter = computableIncome > 0 ? totalDebtAfter / computableIncome : 0;
  const monthlyMargin = computableIncome - totalDebtAfter - monthlyExpensesTotal - (linkedAnnual/12);

  const maxAge = m.maxAgeAtMaturity || 75;
  const agesAtMat = buyers.map(b => ageAtMaturity(b.birthDate, termYears)).filter(x => x !== null);
  const ageOk = agesAtMat.length === 0 || agesAtMat.every(a => a <= maxAge);
  const maxAgeReached = agesAtMat.length ? Math.max(...agesAtMat) : null;

  const threshold = m.debtThreshold ?? 0.35;
  const ratioOk = ratioAfter <= threshold;
  const liquidityOk = liquidityGap <= 0;
  const liquidityOkWithoutReserve = liquidityGapWithoutReserve <= 0;
  const ltvOk = !ltvCapped;
  const allOk = ratioOk && liquidityOkWithoutReserve && ltvOk && ageOk;

  const totalCollateralCoverage = totalPrice + props.totalCollateralValue;
  const collateralCoverageRatio = mortgageAmount > 0 ? totalCollateralCoverage / mortgageAmount : 0;

  const reasons = [];
  if (!ratioOk) reasons.push(`Ratio de endeudamiento ${fmtPct(ratioAfter)} > umbral ${fmtPct(threshold)}`);
  if (!liquidityOkWithoutReserve) reasons.push(`Faltan ${fmtEur(-liquidityGapWithoutReserve)} para cubrir la entrada y gastos de compra`);
  else if (!liquidityOk) reasons.push(`Faltan ${fmtEur(-liquidityGap)} para cubrir gastos + la reserva de emergencia deseada`);
  if (!ltvOk) reasons.push(`LTV deseado supera el máximo del ${maxLtv}%`);
  if (!ageOk) reasons.push(`Edad al vencimiento ${maxAgeReached ? maxAgeReached.toFixed(1) : '?'} años > ${maxAge}`);
  if (duplicateDebts.length > 0) reasons.push(`⚠️ Detectadas ${duplicateDebts.length} deudas duplicadas con hipotecas de inmuebles. Se ignoran en el ratio`);

  let verdict, verdictLabel, verdictColor;
  if (!computableIncome || !price) {
    verdict='insufficient'; verdictLabel='Datos insuficientes'; verdictColor='slate';
  } else if (allOk && monthlyMargin > computableIncome * 0.10) {
    verdict='viable'; verdictLabel='Viable según criterios configurados'; verdictColor='emerald';
  } else if (allOk) {
    verdict='conditional'; verdictLabel='Viable con margen reducido'; verdictColor='amber';
  } else if (ratioOk && liquidityOkWithoutReserve && !liquidityOk) {
    verdict='conditional'; verdictLabel='Viable si reduces la reserva de emergencia'; verdictColor='amber';
  } else if (ratioOk && !liquidityOkWithoutReserve) {
    verdict='conditional'; verdictLabel='Viable si se resuelve la liquidez'; verdictColor='amber';
  } else {
    verdict='not_viable'; verdictLabel='No viable con los datos actuales'; verdictColor='red';
  }

  return {
    price, totalPrice, anexos, mortgageAmount,
    downPayment: downPaymentReal,
    downPaymentDesired: desiredDownPayment,
    effectiveLtv, ltvCapped,
    acq, reforms, furniture, openingFee,
    acquisitionCosts, emergencyReserve,
    totalNeeded, totalRequired,
    available, liquidityGap, liquidityGapWithoutReserve,
    liquidSavings, baseAvailable, liquidFromSalesBefore: props.liquidFromSalesBefore,
    payment, paymentAfterFirstAmort, basePayment,
    schedule, baseSchedule,
    interestTotal, baseInterestTotal,
    months, effectiveMonths, effectiveYears, tin, maxLtv,
    targetPaymentBefore, targetPaymentAfter,
    amortizations, totalAmortizedBySales, totalKeptFromSales,
    salaryIncomeComputable, rentalIncomeComputable,
    computableIncome, rawIncome,
    existingDebt, existingDebtDebtsOnly, existingDebtPropertiesOnly,
    rawDebtsTotal, excludedDuplicatesTotal, duplicateDebts,
    monthlyExpenses: monthlyExpensesTotal, totalDebtAfter,
    ratioBefore, ratioAfter, monthlyMargin, threshold, linkedAnnual,
    ageOk, maxAgeReached, maxAge, ratioOk, liquidityOk, liquidityOkWithoutReserve, ltvOk, allOk,
    verdict, verdictLabel, verdictColor, reasons,
    ltv: effectiveLtv,
    aggregateSavings: savings,
    properties: props,
    netFromSalesAfter: props.netFromSalesAfter,
    totalCollateralCoverage, collateralCoverageRatio
  };
};

const computeMaxPrice = (state, binding) => {
  const evaluate = (p) => {
    if (p <= 0) return false;
    const r = evaluateOperation(state, { price: p });
    if (binding === 'savings') return r.liquidityGapWithoutReserve <= 0;
    if (binding === 'income') return r.ratioAfter <= r.threshold;
    if (binding === 'ltv') return !r.ltvCapped;
    if (binding === 'age') return r.ageOk;
    return r.allOk;
  };
  if (!evaluate(10000)) return 0;
  let lo = 10000, hi = 5000000;
  if (evaluate(hi)) return hi;
  while (hi - lo > 500) {
    const mid = (lo + hi) / 2;
    if (evaluate(mid)) lo = mid; else hi = mid;
  }
  return Math.floor(lo);
};

const DonutChart = ({ data, colors, size=200 }) => {
  const total = data.reduce((s, d) => s + Math.max(0, d.value), 0);
  if (total <= 0) return <div className="text-sm text-slate-500 p-4">Sin datos</div>;
  const cx = size/2, cy = size/2;
  const R = size/2 - 10, r = R * 0.55;
  let angle = -Math.PI/2;
  const slices = data.map((d, i) => {
    const val = Math.max(0, d.value);
    const frac = val / total;
    const a0 = angle, a1 = angle + frac * Math.PI * 2;
    angle = a1;
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0);
    const x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    const xi1 = cx + r * Math.cos(a1), yi1 = cy + r * Math.sin(a1);
    const xi0 = cx + r * Math.cos(a0), yi0 = cy + r * Math.sin(a0);
    const path = `M ${x0} ${y0} A ${R} ${R} 0 ${large} 1 ${x1} ${y1} L ${xi1} ${yi1} A ${r} ${r} 0 ${large} 0 ${xi0} ${yi0} Z`;
    return { path, color: colors[i % colors.length], name: d.name, value: val, frac };
  });
  return (
    <div>
      <svg viewBox={`0 0 ${size} ${size}`} width="100%" style={{maxWidth: size}}>
        {slices.map((s, i) => <path key={i} d={s.path} fill={s.color} stroke="white" strokeWidth="1" />)}
      </svg>
      <div className="mt-3 space-y-1">
        {slices.map((s, i) => (
          <div key={i} className="flex items-center justify-between text-xs">
            <div className="flex items-center gap-2">
              <span className="w-3 h-3 rounded-sm" style={{background: s.color}}></span>
              <span>{s.name}</span>
            </div>
            <span className="font-medium">{fmtEur(s.value)} · {fmtPct(s.frac, 0)}</span>
          </div>
        ))}
      </div>
    </div>
  );
};

const AreaChartSVG = ({ data, height=240, amortizationEvents = [] }) => {
  const W = 600, H = height, P = { t: 30, r: 20, b: 30, l: 80 };
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const maxY = Math.max(...data.map(d => d.balance), 1);
  const x = i => P.l + (i / Math.max(1, data.length - 1)) * iw;
  const y = v => P.t + ih - (v / maxY) * ih;
  const path = data.map((d, i) => `${i===0?'M':'L'} ${x(i)} ${y(d.balance)}`).join(' ');
  const area = `${path} L ${x(data.length-1)} ${P.t+ih} L ${x(0)} ${P.t+ih} Z`;
  const ticks = 4;
  const eventYears = new Set();
  amortizationEvents.forEach(a => {
    if (a.amount > 0 && a.mode !== 'none' && a.month > 0) eventYears.add(Math.ceil(a.month / 12));
  });
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{height}}>
      {[...Array(ticks+1)].map((_, i) => {
        const v = (maxY / ticks) * i; const yy = y(v);
        return (
          <g key={i}>
            <line x1={P.l} x2={W-P.r} y1={yy} y2={yy} stroke="#e2e8f0" strokeDasharray="3 3" />
            <text x={P.l-6} y={yy+4} fontSize="10" fill="#94a3b8" textAnchor="end">{fmtEur(v)}</text>
          </g>
        );
      })}
      <path d={area} fill="#c7d2fe" opacity="0.6" />
      <path d={path} fill="none" stroke="#4f46e5" strokeWidth="2" />
      {[...eventYears].map((yr) => {
        const idx = data.findIndex(d => d.year === yr);
        if (idx < 0) return null;
        return (
          <g key={yr}>
            <line x1={x(idx)} x2={x(idx)} y1={P.t} y2={P.t+ih} stroke="#f59e0b" strokeWidth="2" strokeDasharray="4 4" />
            <text x={x(idx)} y={P.t - 10} fontSize="10" fill="#f59e0b" textAnchor="middle">Amort. venta</text>
          </g>
        );
      })}
      {data.filter((_,i) => i % Math.max(1, Math.ceil(data.length/6)) === 0 || i === data.length-1).map((d, k) => {
        const i = data.indexOf(d);
        return <text key={k} x={x(i)} y={H-10} fontSize="10" fill="#94a3b8" textAnchor="middle">{d.year}</text>;
      })}
    </svg>
  );
};

  };
  const resyncWilling = (buyerId) => {
    setBuyers(prev => prev.map(b => {
      if (b.id !== buyerId) return b;
      const liquid = computeLiquidSavings(b.savings);
      return { ...b, savings: { ...b.savings, willingToUse: liquid, willingCustom: false } };
    }));
  };

  const agg = aggregateSavings(buyers);
  const totalPatrimonyAgg = computeTotalPatrimony(agg);
  const liquidAgg = computeLiquidSavings(agg);

  return (
    <div>
      <h2 className="text-xl font-semibold text-slate-900 dark:text-white mb-1">Ahorros y patrimonio por comprador</h2>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-6">Cada titular declara sus propios activos.</p>

            <div className="text-xl font-bold text-slate-900 dark:text-white">{fmtEur(totalPatrimonyAgg)}</div>

            <div className="text-xs uppercase text-slate-500 font-medium">Patrimonio líquido</div>
            <div className="text-xl font-bold text-slate-900 dark:text-white">{fmtEur(liquidAgg)}</div>

            <div className="text-xs uppercase text-slate-500 font-medium">Disponible para la compra</div>
            <div className="text-xl font-bold text-brand-600 dark:text-brand-400">{fmtEur(agg.willingToUse > 0 ? Math.min(liquidAgg, agg.willingToUse) : liquidAgg)}</div>
          </div>

      <div className="space-y-6">
        {buyers.map((b, i) => {

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <NumberField label="Cuentas bancarias" tooltip="Totalmente líquido." value={b.savings.cash} onChange={v => updateSavings(b.id, 'cash', v)} suffix="€" min={0} />
                  <NumberField label="Depósitos" tooltip="Depósitos a plazo." value={b.savings.deposits} onChange={v => updateSavings(b.id, 'deposits', v)} suffix="€" min={0} />
                  <NumberField label="Fondos de inversión" tooltip="Vendibles en 1–3 días." value={b.savings.funds} onChange={v => updateSavings(b.id, 'funds', v)} suffix="€" min={0} />
                  <NumberField label="Acciones / ETF" tooltip="Liquidez 2–3 días." value={b.savings.stocks} onChange={v => updateSavings(b.id, 'stocks', v)} suffix="€" min={0} />

              </div>
            </Card>

        })}
      </div>
    </div>
  );
};

const PropertiesSection = ({ buyers, setBuyers, duplicateDebts, onRemoveDuplicateDebt }) => {
  const addProperty = (ownerBuyerId) => {
    setBuyers(prev => prev.map(b => b.id === ownerBuyerId
      ? { ...b, properties: [...(b.properties||[]), emptyProperty(ownerBuyerId)] }
      : b));
  };
  const updateProperty = (propId, patch) => {
    setBuyers(prev => prev.map(b => ({
      ...b,
      properties: (b.properties||[]).map(p => p.id === propId ? { ...p, ...patch } : p)
    })));
  };
  const removeProperty = (ownerBuyerId, propId) => {
    setBuyers(prev => prev.map(b => b.id === ownerBuyerId
      ? { ...b, properties: (b.properties||[]).filter(p => p.id !== propId) }
      : b));
  };
  const addOwner = (propId, buyerId) => {
    setBuyers(prev => {
      let prop = null;
      prev.forEach(b => (b.properties||[]).forEach(p => { if (p.id === propId) prop = p; }));
      if (!prop) return prev;
      if ((prop.ownerships||[]).some(o => o.buyerId === buyerId)) return prev;
      const newOwnerships = [...(prop.ownerships||[]), { buyerId, pct: 0 }];
      return prev.map(b => ({
        ...b,
        properties: (b.properties||[]).map(p => p.id === propId ? { ...p, ownerships: newOwnerships } : p)
      }));
    });
  };
  const updateOwnerPct = (propId, buyerId, pct) => {
    setBuyers(prev => prev.map(b => ({
      ...b,
      properties: (b.properties||[]).map(p => p.id === propId
        ? { ...p, ownerships: (p.ownerships||[]).map(o => o.buyerId === buyerId ? { ...o, pct } : o) }
        : p)
    })));
  };
  const removeOwner = (propId, buyerId) => {
    setBuyers(prev => prev.map(b => ({
      ...b,
      properties: (b.properties||[]).map(p => {
        if (p.id !== propId) return p;
        const filtered = (p.ownerships||[]).filter(o => o.buyerId !== buyerId);
        return { ...p, ownerships: filtered.length > 0 ? filtered : [{ buyerId: b.id, pct: 100 }] };
      })
    })));
  };

  const props = summarizeProperties(buyers);
  const buyerName = (id) => buyers.find(b => b.id === id)?.name || '—';

  return (
    <div>
      <h2 className="text-xl font-semibold text-slate-900 dark:text-white mb-1">Inmuebles en propiedad</h2>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-6">Declara inmuebles en propiedad. Pueden estar alquilados, en copropiedad o venderse.</p>

      {duplicateDebts && duplicateDebts.length > 0 && (
        <Card className="p-4 mb-6 bg-amber-50 dark:bg-amber-900/20 border-amber-200 dark:border-amber-800">
          <div className="text-sm text-amber-800 dark:text-amber-200">
            <strong>⚠️ Posible duplicidad detectada:</strong> {duplicateDebts.length} deuda(s) de tipo "hipoteca" coincide con la hipoteca de un inmueble. Para no contarla dos veces, se está ignorando en el ratio. Puedes eliminarla:
            <div className="mt-2 space-y-1">
              {duplicateDebts.map((d, i) => (
                <div key={i} className="flex flex-wrap items-center justify-between gap-2 text-xs bg-white/50 dark:bg-slate-900/40 px-3 py-2 rounded">
                  <span>Inmueble: <strong>{d.propertyAlias}</strong> ({d.buyerName}) — {fmtEur(d.debtAmount)}</span>
                  <button onClick={() => onRemoveDuplicateDebt(d.debtId)}
                    className="px-2 py-1 rounded bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-300 hover:bg-red-100">Eliminar</button>
                </div>
              ))}
            </div>
          </div>
        </Card>
      )}

      <Card className="p-5 mb-6 bg-brand-50/50 dark:bg-brand-900/10 border-brand-200 dark:border-brand-800">
        <h3 className="font-semibold text-slate-900 dark:text-white mb-3">Resumen conjunto</h3>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div>
            <div className="text-xs uppercase text-slate-500 font-medium">Valor de mercado</div>
            <div className="text-lg font-bold text-slate-900 dark:text-white">{fmtEur(props.totalMarketValue)}</div>
          </div>
          <div>
            <div className="text-xs uppercase text-slate-500 font-medium">Hipotecas pendientes</div>
            <div className="text-lg font-bold text-red-600 dark:text-red-400">{fmtEur(props.totalMortgageOutstanding)}</div>
          </div>
          <div>
            <div className="text-xs uppercase text-slate-500 font-medium">Patrimonio neto</div>
            <div className="text-lg font-bold text-emerald-600 dark:text-emerald-400">{fmtEur(props.totalNetEquity)}</div>
          </div>
          <div>
            <div className="text-xs uppercase text-slate-500 font-medium">Renta neta computable</div>
            <div className="text-lg font-bold text-brand-600 dark:text-brand-400">{fmtEur(props.rentalNetComputableMonthly)}<span className="text-xs font-normal">/mes</span></div>
          </div>
        </div>
      </Card>

      {buyers.map((b, i) => (
        <Card key={b.id} className="p-5 mb-4">
          <div className="flex items-center justify-between mb-4">
            <h3 className="font-semibold text-slate-900 dark:text-white">
              Comprador {i+1} · <span className="text-brand-600 dark:text-brand-400">{b.name}</span>
            </h3>
            <button className="px-3 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-xs font-medium"
              onClick={() => addProperty(b.id)}>+ Añadir inmueble</button>
          </div>

          {(b.properties||[]).length === 0 ? (
            <p className="text-sm text-slate-500">Sin inmuebles declarados por este comprador.</p>
          ) : (
            <div className="space-y-4">
              {(b.properties||[]).map((p, j) => {
                const ownerships = p.ownerships && p.ownerships.length > 0 ? p.ownerships : [{ buyerId: b.id, pct: 100 }];
                const totalPct = ownerships.reduce((s, o) => s + (Number(o.pct)||0), 0);
                const netEquity = Math.max(0, (Number(p.marketValue)||0) - (Number(p.mortgageOutstanding)||0));
                const netSaleAfter = Math.max(0, (Number(p.sellPrice)||0) - (Number(p.sellCosts)||0) - (Number(p.sellTaxes)||0) - (Number(p.mortgageOutstanding)||0));
                const isShared = ownerships.length > 1;
                const buyerIdsAvailable = buyers.map(bb => ({ id: bb.id, name: bb.name })).filter(x => !ownerships.some(o => o.buyerId === x.id));
                const amortizeMode = p.sellAmortizeMode || 'reduce_cuota';
                const amortizePct = Number(p.sellAmortizePct ?? 100);
                const amortizeAmount = netSaleAfter * (amortizePct / 100);
                const keepAmount = netSaleAfter * (1 - amortizePct / 100);

                const grossRent = Number(p.netRentalIncome) || 0;
                const computablePct = Number(p.rentalComputablePct ?? 80);
                const expenses = Number(p.rentalMonthlyExpenses) || 0;
                const computableRent = grossRent * (computablePct / 100);
                const netComputableRent = Math.max(0, computableRent - expenses);
                const mortgagePayment = Number(p.mortgageMonthlyPayment) || 0;
                const netCashFlow = netComputableRent - mortgagePayment;

                return (
                  <div key={p.id} className="rounded-xl border border-slate-200 dark:border-slate-800 p-4">
                    <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
                      <div className="flex items-center gap-2">
                        <span className="text-sm font-semibold text-slate-700 dark:text-slate-300">Inmueble {j+1}</span>
                        {isShared && <span className="px-2 py-0.5 rounded-full bg-brand-100 dark:bg-brand-900/40 text-brand-700 dark:text-brand-200 text-xs">Copropiedad {ownerships.length}</span>}
                      </div>
                      <button className="px-2 py-1 rounded-lg bg-red-50 hover:bg-red-100 text-red-600 text-xs dark:bg-red-900/30 dark:text-red-300"
                        onClick={() => removeProperty(b.id, p.id)}>Eliminar</button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                      <TextField label="Alias" tooltip="Nombre del inmueble." value={p.alias} onChange={v => updateProperty(p.id, { alias: v })} />
                      <NumberField label="Valor de mercado" tooltip="Valor total del inmueble." value={p.marketValue} onChange={v => updateProperty(p.id, { marketValue: v })} suffix="€" min={0} />
                      <NumberField label="Hipoteca pendiente (capital)" tooltip="Capital pendiente total." value={p.mortgageOutstanding} onChange={v => updateProperty(p.id, { mortgageOutstanding: v })} suffix="€" min={0} />
                      <NumberField label="Cuota mensual de esta hipoteca" tooltip="Cuota mensual que pagas. Se computa como deuda. NO la dupliques en la pestaña Deudas." value={p.mortgageMonthlyPayment} onChange={v => updateProperty(p.id, { mortgageMonthlyPayment: v })} suffix="€/mes" min={0} />
                    </div>

                    <div className="mb-4 p-3 rounded-lg bg-slate-50 dark:bg-slate-800/50">
                      <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
                        <div className="text-sm font-semibold text-slate-700 dark:text-slate-300">Copropietarios</div>
                        {buyerIdsAvailable.length > 0 && (
                          <select className="text-xs px-2 py-1 rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900"
                            value="" onChange={e => { if (e.target.value) addOwner(p.id, e.target.value); }}>
                            <option value="">+ Añadir copropietario…</option>
                            {buyerIdsAvailable.map(x => <option key={x.id} value={x.id}>{x.name}</option>)}
                          </select>
                        )}
                      </div>
                      <div className="space-y-2">
                        {ownerships.map(o => (
                          <div key={o.buyerId} className="flex items-center gap-2">
                            <span className="text-sm flex-1">{buyerName(o.buyerId)}</span>
                            <input type="number" className="w-20 px-2 py-1 text-sm rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-right"
                              value={o.pct ?? 0} min={0} max={100}
                              onChange={e => updateOwnerPct(p.id, o.buyerId, Number(e.target.value) || 0)} />
                            <span className="text-xs text-slate-500 w-4">%</span>
                            {ownerships.length > 1 && (
                              <button className="px-2 py-1 rounded bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-300 text-xs"
                                onClick={() => removeOwner(p.id, o.buyerId)}>×</button>
                            )}
                          </div>
                        ))}
                      </div>
                      <div className={"mt-2 text-xs " + (Math.abs(totalPct - 100) < 0.01 ? 'text-emerald-600' : 'text-amber-600')}>
                        Total: {totalPct}% {Math.abs(totalPct - 100) > 0.01 && '⚠️ (ajusta a 100%)'}
                      </div>
                    </div>

                    <div className="mb-4">

const MortgageSection = ({ mortgage, setMortgage, property, amortizations }) => {
  const u = (k, v) => setMortgage({ ...mortgage, [k]: v });
  const totalPrice = (property.price||0) + (property.garagePrice||0) + (property.storagePrice||0);
  const downPct = mortgage.downPaymentPct;
  const maxLtv = mortgage.maxLtv;
  const desiredMortgage = totalPrice * (1 - downPct / 100);
  const maxMortgageByLtv = totalPrice * (maxLtv / 100);
  const effectiveMortgage = Math.min(desiredMortgage, maxMortgageByLtv);
  const effectiveDown = totalPrice - effectiveMortgage;
  const ltvCapped = desiredMortgage > maxMortgageByLtv + 0.01;
  const effectiveLtv = totalPrice > 0 ? effectiveMortgage / totalPrice : 0;

  const basePayment = monthlyPayment(effectiveMortgage, mortgage.tin, mortgage.termYears * 12);
  const targetBefore = Number(mortgage.targetPaymentBefore) || 0;
  const targetAfter = Number(mortgage.targetPaymentAfter) || 0;

  const schedule = buildMortgageSchedule(effectiveMortgage, mortgage.tin, mortgage.termYears * 12, amortizations || [], {
    targetPaymentBefore: targetBefore,
    targetPaymentAfter: targetAfter,
  });
  const effectiveMonths = schedule.length;
  const firstRow = schedule[0] || { payment: basePayment };
  const effectivePayment = firstRow.payment;

  // Cuota tras amortizar
  const firstAmort = (amortizations || []).filter(a => a.amount > 0 && a.mode === 'reduce_cuota').sort((a,b) => a.month - b.month)[0];
  let paymentAfterAmort = effectivePayment;
  if (firstAmort) {
    const row = schedule.find(r => r.month === firstAmort.month + 1);
    if (row) paymentAfterAmort = row.payment;
  }

  const monthsBase = targetBefore > 0 ? (isFinite(monthsForPayment(effectiveMortgage, mortgage.tin, targetBefore)) ? monthsForPayment(effectiveMortgage, mortgage.tin, targetBefore) : mortgage.termYears * 12) : mortgage.termYears * 12;

  return (
    <div>
      <h2 className="text-xl font-semibold text-slate-900 dark:text-white mb-1">Hipoteca y financiación</h2>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-6">Configura las condiciones. Puedes fijar cuota y dejar que el plazo se ajuste automáticamente.</p>

        <h3 className="font-semibold text-slate-900 dark:text-white mb-4">Condiciones</h3>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
          <NumberField
            label="Aportación inicial (% del precio)"
            tooltip="Porcentaje del precio que pagas tú. El banco financia el resto hasta el LTV máximo."
            value={mortgage.downPaymentPct}
            onChange={v => u('downPaymentPct', v)}
            suffix="%" min={0} max={100} step={1}
            help={`→ Aportas ${fmtEur(totalPrice * downPct / 100)} · Banco financia el ${100 - downPct}%`}
          />
          <NumberField label="Plazo (años)" tooltip="Duración máxima. Si fijas cuota objetivo, el plazo se recalculará." value={mortgage.termYears} onChange={v => u('termYears', v)} min={1} max={40} suffix="años" />
          <SelectField label="Tipo de interés" tooltip="Fijo, variable o mixto." value={mortgage.type} onChange={v => u('type', v)} options={[{ value: 'fijo', label: 'Fijo' }, { value: 'variable', label: 'Variable' }, { value: 'mixto', label: 'Mixto' }]} />
          <NumberField label="TIN anual" tooltip="Tipo de Interés Nominal." value={mortgage.tin} onChange={v => u('tin', v)} suffix="%" min={0} max={20} step={0.05} />
          <NumberField label="Comisión apertura" tooltip="Habitual 0%–1%." value={mortgage.openingFeePct} onChange={v => u('openingFeePct', v)} suffix="%" min={0} max={5} step={0.1} />
          <NumberField label="Productos vinculados (anual)" tooltip="Seguros, tarjetas." value={mortgage.linkedProductsAnnual} onChange={v => u('linkedProductsAnnual', v)} suffix="€" min={0} />
        </div>
        {mortgage.type !== 'fijo' && (

const BuyersBreakdown = ({ buyers }) => {
  const COLORS = ['#6366f1', '#10b981', '#f59e0b', '#ef4444'];
  const totalLiquid = buyers.reduce((s, b) => s + computeLiquidSavings(b.savings), 0);
  const totalPatrimony = buyers.reduce((s, b) => s + computeTotalPatrimony(b.savings), 0);
  const totalWilling = buyers.reduce((s, b) => s + (Number(b.savings.willingToUse) || 0), 0);
  const totalIncome = buyers.reduce((s, b) =>
    s + (b.monthlyNetSalary||0) + (b.variableIncome||0) + (b.rentalIncome||0) + (b.otherIncome||0), 0);
  const propsSummary = summarizeProperties(buyers);
  const perBuyerPropsNet = {};
  const perBuyerCollateral = {};
  buyers.forEach(b => { perBuyerPropsNet[b.id] = 0; perBuyerCollateral[b.id] = 0; });
  propsSummary.all.forEach(p => {
    p.perOwner.forEach(o => {
      if (!(o.buyerId in perBuyerPropsNet)) return;
      perBuyerPropsNet[o.buyerId] += o.netEquityShare;
      perBuyerCollateral[o.buyerId] += o.collateralShare;
    });
    if (p.collateralAttributed) {
      const bId = p.collateralAttributed.buyerId;
      if (bId in perBuyerCollateral) {
        const alreadyAdded = p.perOwner.reduce((s, o) => s + (o.buyerId === bId ? o.collateralShare : 0), 0);
        perBuyerCollateral[bId] += (p.collateralAttributed.amount - alreadyAdded);
      }
    }
  });
  const totalPropsNet = Object.values(perBuyerPropsNet).reduce((s, v) => s + v, 0);
  const totalCollateral = Object.values(perBuyerCollateral).reduce((s, v) => s + v, 0);
  return (
    <div className="space-y-4">
      <Card className="p-5">
        <h4 className="font-semibold mb-4">Aportación por comprador</h4>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b border-slate-200 dark:border-slate-800 text-left">
                <th className="py-2 pr-3 font-medium text-slate-600 dark:text-slate-400">Comprador</th>
                <th className="py-2 pr-3 font-medium text-slate-600 dark:text-slate-400 text-right">Ingresos/mes</th>
                <th className="py-2 pr-3 font-medium text-slate-600 dark:text-slate-400 text-right">Líquido</th>
                <th className="py-2 pr-3 font-medium text-slate-600 dark:text-slate-400 text-right">Inmuebles (neto)</th>
                <th className="py-2 pr-3 font-medium text-slate-600 dark:text-slate-400 text-right">Garantía</th>
                <th className="py-2 pr-3 font-medium text-slate-600 dark:text-slate-400 text-right">Aporta</th>
                <th className="py-2 pr-3 font-medium text-slate-600 dark:text-slate-400 text-right">% del total</th>
              </tr>
            </thead>
            <tbody>
              {buyers.map((b, i) => {
                const liquid = computeLiquidSavings(b.savings);
                const willing = Number(b.savings.willingToUse) || 0;
                const income = (b.monthlyNetSalary||0) + (b.variableIncome||0) + (b.rentalIncome||0) + (b.otherIncome||0);
                const pct = totalWilling > 0 ? willing / totalWilling : 0;
                const propsNet = perBuyerPropsNet[b.id] || 0;
                const collateral = perBuyerCollateral[b.id] || 0;
                return (
                  <tr key={b.id} className="border-b border-slate-100 dark:border-slate-800">
                    <td className="py-2 pr-3">
                      <div className="flex items-center gap-2">
                        <span className="w-2.5 h-2.5 rounded-full" style={{background: COLORS[i % COLORS.length]}}></span>
                        <span className="font-medium">{b.name}</span>
                      </div>
                    </td>
                    <td className="py-2 pr-3 text-right">{fmtEur(income)}</td>
                    <td className="py-2 pr-3 text-right">{fmtEur(liquid)}</td>
                    <td className="py-2 pr-3 text-right">{propsNet > 0 ? fmtEur(propsNet) : '—'}</td>
                    <td className="py-2 pr-3 text-right text-brand-600 dark:text-brand-400">{collateral > 0 ? fmtEur(collateral) : '—'}</td>
                    <td className="py-2 pr-3 text-right font-semibold text-brand-600 dark:text-brand-400">{fmtEur(willing)}</td>
                    <td className="py-2 pr-3 text-right">{fmtPct(pct, 0)}</td>
                  </tr>
                );
              })}
              <tr className="font-bold border-t-2 border-slate-300 dark:border-slate-700">
                <td className="py-2 pr-3">TOTAL</td>
                <td className="py-2 pr-3 text-right">{fmtEur(totalIncome)}</td>
                <td className="py-2 pr-3 text-right">{fmtEur(totalLiquid)}</td>
                <td className="py-2 pr-3 text-right">{fmtEur(totalPropsNet)}</td>
                <td className="py-2 pr-3 text-right text-brand-600 dark:text-brand-400">{totalCollateral > 0 ? fmtEur(totalCollateral) : '—'}</td>
                <td className="py-2 pr-3 text-right text-brand-600 dark:text-brand-400">{fmtEur(totalWilling)}</td>
                <td className="py-2 pr-3 text-right">100%</td>
              </tr>
            </tbody>
          </table>
        </div>
      </Card>
      {buyers.length > 1 && totalWilling > 0 && (
        <Card className="p-5">
          <h4 className="font-semibold mb-3">Reparto de la aportación</h4>
          <DonutChart data={buyers.map((b) => ({ name: b.name, value: Number(b.savings.willingToUse) || 0 }))} colors={COLORS} />
        </Card>
      )}
    </div>
  );
};

const StressTab = ({ state }) => {
  const [rateShock, setRateShock] = useState(0);
  const [incomeDrop, setIncomeDrop] = useState(0);
  const [expenseUp, setExpenseUp] = useState(0);
  const base = useMemo(() => evaluateOperation(state), [state]);
  const stressed = useMemo(() => {
    const s = JSON.parse(JSON.stringify(state));
    s.mortgage.tin = state.mortgage.tin + rateShock;
    if (s.mortgage.type === 'mixto') s.mortgage.postFixedTin = state.mortgage.postFixedTin + rateShock;
    s.buyers = s.buyers.map(b => ({ ...b, monthlyNetSalary: b.monthlyNetSalary * (1 - incomeDrop/100), variableIncome: b.variableIncome * (1 - incomeDrop/100), otherIncome: b.otherIncome * (1 - incomeDrop/100) }));
    s.monthlyExpenses = Object.fromEntries(Object.entries(s.monthlyExpenses).map(([k,v]) => [k, v * (1 + expenseUp/100)]));
    return evaluateOperation(s);
  }, [state, rateShock, incomeDrop, expenseUp]);
  const comp = [
    { label: 'Cuota base', value: base.payment, color: '#6366f1', display: fmtEur2(base.payment) },
    { label: 'Cuota estresada', value: stressed.payment, color: '#ef4444', display: fmtEur2(stressed.payment) },
    { label: 'Margen base', value: Math.max(0, base.monthlyMargin), color: '#10b981', display: fmtEur(base.monthlyMargin) },
    { label: 'Margen estresado', value: Math.max(0, stressed.monthlyMargin), color: '#f59e0b', display: fmtEur(stressed.monthlyMargin) },
  ];
  const ratioComp = [
    { label: 'Ratio base', value: base.ratioAfter * 100, color: '#6366f1', display: fmtPct(base.ratioAfter) },
    { label: 'Ratio estresado', value: stressed.ratioAfter * 100, color: '#ef4444', display: fmtPct(stressed.ratioAfter) },
    { label: 'Umbral', value: base.threshold * 100, color: '#94a3b8', display: fmtPct(base.threshold) },
  ];
  return (
    <div className="space-y-4">
      <Card className="p-5">
        <h4 className="font-semibold mb-4">Pruebas de resistencia</h4>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div>
            <label className={labelCls}>Subida tipos: +{rateShock.toFixed(2)} pp</label>
            <input type="range" min={0} max={3} step={0.25} value={rateShock} onChange={e => setRateShock(Number(e.target.value))} className="w-full" />
          </div>
          <div>
            <label className={labelCls}>Caída ingresos: −{incomeDrop}%</label>
            <input type="range" min={0} max={50} step={5} value={incomeDrop} onChange={e => setIncomeDrop(Number(e.target.value))} className="w-full" />
          </div>
          <div>
            <label className={labelCls}>Subida gastos: +{expenseUp}%</label>
            <input type="range" min={0} max={50} step={5} value={expenseUp} onChange={e => setExpenseUp(Number(e.target.value))} className="w-full" />
          </div>
        </div>
      </Card>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
        <KPI label="Cuota estresada" value={fmtEur2(stressed.payment)} sub={`Base: ${fmtEur2(base.payment)}`} />
        <KPI label="Ratio estresado" value={fmtPct(stressed.ratioAfter)} color={stressed.ratioOk ? 'emerald' : 'red'} sub={`Umbral ${fmtPct(stressed.threshold)}`} />
        <KPI label="Margen estresado" value={fmtEur(stressed.monthlyMargin)} color={stressed.monthlyMargin > 0 ? 'emerald' : 'red'} sub={`Base: ${fmtEur(base.monthlyMargin)}`} />
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <Card className="p-5">
          <h4 className="font-semibold mb-3">Cuota y margen</h4>
          <HBarChart data={comp} />
        </Card>
        <Card className="p-5">
          <h4 className="font-semibold mb-3">Ratios de endeudamiento</h4>
          <HBarChart data={ratioComp} />
        </Card>
      </div>
      <Card className={"p-5 border-2 " + (stressed.allOk ? 'border-emerald-300' : 'border-red-300')}>
        <strong>Resultado estresado: {stressed.verdictLabel}</strong>
        {stressed.reasons.length > 0 && (
          <ul className="mt-2 text-sm list-disc list-inside">
            {stressed.reasons.map((r,i) => <li key={i}>{r}</li>)}
          </ul>
        )}
      </Card>
    </div>
  );
};

/* ---------- GUARDADAS ---------- */
const SavedSection = ({ state, setState, list, setList }) => {
  const [name, setName] = useState('');
  const [message, setMessage] = useState(null);
  const fileRef = useRef();

  const showMessage = (type, text) => {
    setMessage({ type, text });
    setTimeout(() => setMessage(null), 4000);
  };

  const save = () => {
    const n = name.trim() || 'Simulación ' + new Date().toLocaleString('es-ES');
    const id = 'sim_' + Date.now();
    const newList = { ...list, [id]: { id, name: n, savedAt: new Date().toISOString(), state: { ...state, simName: n } } };
    setList(newList);
    localStorage.setItem(LS_LIST, JSON.stringify(newList));
    setName('');
    showMessage('ok', 'Guardada: ' + n);
  };

  const load = (id) => {
    const s = list[id];
    if (!s) return;
    if (!confirm(`¿Cargar "${s.name}"?`)) return;
    setState(normalizeState(s.state));
    showMessage('ok', 'Cargada: ' + s.name);
  };

  const del = (id) => {
    if (!confirm('¿Eliminar?')) return;
    const n = { ...list };
    delete n[id];
    setList(n);
    localStorage.setItem(LS_LIST, JSON.stringify(n));
  };

  const downloadFile = (content, filename) => {
    const blob = new Blob([content], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const exportAll = () => {
    const payload = { _type: 'simulador_hipoteca_backup', _version: 8, exportedAt: new Date().toISOString(), current: state, saved: list };
    downloadFile(JSON.stringify(payload, null, 2), `simulador-backup-${Date.now()}.json`);
    showMessage('ok', `Exportado: actual + ${Object.keys(list).length} guardadas`);
  };
  const exportCurrent = () => {
    const payload = { _type: 'simulador_hipoteca_current', _version: 8, exportedAt: new Date().toISOString(), state };
    downloadFile(JSON.stringify(payload, null, 2), `simulador-actual-${Date.now()}.json`);
    showMessage('ok', 'Simulación actual exportada');
  };
  const exportSingle = (id) => {
    const s = list[id];
    if (!s) return;
    const payload = { _type: 'simulador_hipoteca_single', _version: 8, exportedAt: new Date().toISOString(), simulation: s };
    downloadFile(JSON.stringify(payload, null, 2), `simulacion-${s.name.replace(/[^a-z0-9]/gi,'_')}-${Date.now()}.json`);
    showMessage('ok', 'Exportada: ' + s.name);
  };

  const importJson = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        let importedCount = 0;
        let loadedCurrent = false;
        const type = data._type || (
          data.saved || data.simulation || data.current ? 'legacy' :
          data.buyers && data.property && data.mortgage ? 'raw_state' : 'unknown'
        );
        if (type === 'simulador_hipoteca_backup' || (data.saved && data.current)) {
          const mergedSaved = { ...list, ...(data.saved || {}) };
          setList(mergedSaved);
          localStorage.setItem(LS_LIST, JSON.stringify(mergedSaved));
          importedCount = Object.keys(data.saved || {}).length;
          if (data.current) { setState(normalizeState(data.current)); loadedCurrent = true; }
          showMessage('ok', `Backup importado: ${importedCount} simulaciones${loadedCurrent ? ' + actual cargada' : ''}.`);
        } else if (type === 'simulador_hipoteca_current' || (data.state && !data.name)) {
          setState(normalizeState(data.state));
          showMessage('ok', 'Simulación actual importada.');
        } else if (type === 'simulador_hipoteca_single' || (data.simulation && data.simulation.state)) {
          const sim = data.simulation;
          const id = sim.id || ('sim_' + Date.now());
          const merged = { ...list, [id]: { ...sim, id } };
          setList(merged);
          localStorage.setItem(LS_LIST, JSON.stringify(merged));
          showMessage('ok', `Simulación "${sim.name}" importada.`);
        } else if (type === 'raw_state' || (data.buyers && data.property)) {
          setState(normalizeState(data));
          showMessage('ok', 'Estado cargado directamente.');
        } else {
          showMessage('error', 'Formato no reconocido.');
        }
      } catch (err) {
        showMessage('error', 'Error al leer archivo: ' + err.message);
      } finally {
        if (fileRef.current) fileRef.current.value = '';
      }
    };
    reader.readAsText(file);
  };

  return (
    <div>
      <h2 className="text-xl font-semibold text-slate-900 dark:text-white mb-1">Simulaciones guardadas</h2>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-6">Todo se guarda en tu navegador (localStorage). Exporta para backup.</p>

      {message && (
        <div className={"mb-4 p-3 rounded-lg text-sm border " + (message.type === 'ok' ? 'bg-emerald-50 dark:bg-emerald-900/20 border-emerald-200 dark:border-emerald-800 text-emerald-800 dark:text-emerald-200' : 'bg-red-50 dark:bg-red-900/20 border-red-200 dark:border-red-800 text-red-800 dark:text-red-200')}>
          {message.text}
        </div>
      )}

      <Card className="p-5 mb-6">
        <h3 className="font-semibold text-slate-900 dark:text-white mb-3">Guardar simulación actual</h3>
        <div className="flex flex-col md:flex-row gap-3">
          <input className={inputCls + " flex-1"} placeholder="Nombre (opcional)" value={name} onChange={e => setName(e.target.value)} />
          <button className="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium" onClick={save}>Guardar</button>
        </div>
      </Card>

      <Card className="p-5 mb-6">
        <h3 className="font-semibold text-slate-900 dark:text-white mb-1">Copia de seguridad</h3>
        <p className="text-xs text-slate-500 dark:text-slate-400 mb-4">Exportar todo / actual / individual. Importar acepta los tres.</p>
        <div className="flex flex-col md:flex-row gap-3">
          <button className="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium" onClick={exportAll}>📦 Exportar todo</button>
          <button className="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-sm font-medium" onClick={exportCurrent}>📄 Exportar actual</button>
          <button className="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-sm font-medium" onClick={() => fileRef.current.click()}>📥 Importar JSON</button>
          <input ref={fileRef} type="file" accept=".json,application/json" hidden onChange={importJson} />
        </div>
      </Card>

      <Card className="p-5">
        <h3 className="font-semibold text-slate-900 dark:text-white mb-4">
          Simulaciones guardadas
          {Object.keys(list).length > 0 && <span className="ml-2 text-sm font-normal text-slate-500">({Object.keys(list).length})</span>}
        </h3>
        {Object.keys(list).length === 0 ? (
          <p className="text-sm text-slate-500">No hay simulaciones guardadas.</p>
        ) : (
          <div className="space-y-3">
            {Object.values(list).sort((a,b) => b.savedAt.localeCompare(a.savedAt)).map(s => (
              <div key={s.id} className="flex flex-col md:flex-row md:items-center gap-3 p-3 rounded-xl border border-slate-200 dark:border-slate-800">
                <div className="flex-1">
                  <div className="font-semibold">{s.name}</div>
                  <div className="text-xs text-slate-500">{new Date(s.savedAt).toLocaleString('es-ES')} · Precio {fmtEur(s.state?.property?.price || 0)}</div>
                </div>
                <div className="flex flex-wrap gap-2">
                  <button className="px-3 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm" onClick={() => load(s.id)}>Cargar</button>
                  <button className="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-sm" onClick={() => exportSingle(s.id)}>Exportar</button>
                  <button className="px-3 py-1.5 rounded-lg bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-300 text-sm" onClick={() => del(s.id)}>Eliminar</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>
    </div>
  );
};

/* ---------- APP ---------- */
function App() {
  const [state, setState] = useState(loadCurrent);
  const [tab, setTab] = useState('buyers');
  const [dark, setDark] = useState(false);
  const [list, setList] = useState(loadList);
  const [showAviso, setShowAviso] = useState(true);

  useEffect(() => { localStorage.setItem(LS_KEY, JSON.stringify(state)); }, [state]);
  useEffect(() => { document.documentElement.classList.toggle('dark', dark); }, [dark]);

  useEffect(() => {
    setState(prev => {
      let changed = false;
      const newBuyers = prev.buyers.map(b => {
        if (b.savings.willingCustom) return b;
        const liquid = computeLiquidSavings(b.savings);
        if (liquid !== b.savings.willingToUse) {
          changed = true;
          return { ...b, savings: { ...b.savings, willingToUse: liquid } };
        }
        return b;
      });
      if (!changed) return prev;
      return { ...prev, buyers: newBuyers };
    });
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [
    JSON.stringify(state.buyers.map(b => ({
      id: b.id,
      cash: b.savings.cash,
      deposits: b.savings.deposits,
      funds: b.savings.funds,
      stocks: b.savings.stocks,
      crypto: b.savings.crypto,
      otherLiquid: b.savings.otherLiquid,
      pensionPlans: b.savings.pensionPlans,
      pensionAvailable: b.savings.pensionAvailable,
    })))
  ]);

  const result = useMemo(() => evaluateOperation(state), [state]);
  const maxPrice = useMemo(() => ({
    savings: computeMaxPrice(state, 'savings'),
    income: computeMaxPrice(state, 'income'),
    ltv: computeMaxPrice(state, 'ltv'),
    age: computeMaxPrice(state, 'age'),
    all: computeMaxPrice(state, 'all'),
  }), [state]);

  const removeDuplicateDebt = (debtId) => {
    setState(prev => ({ ...prev, debts: prev.debts.filter(d => d.id !== debtId) }));
  };

  const tabs = [
    { id: 'buyers', label: 'Compradores', icon: '👥' },
    { id: 'savings', label: 'Ahorros', icon: '💰' },
    { id: 'properties', label: 'Inmuebles en propiedad', icon: '🏘️' },
    { id: 'debts', label: 'Deudas y gastos', icon: '📋' },
    { id: 'property', label: 'Inmueble a comprar', icon: '🏠' },
    { id: 'mortgage', label: 'Hipoteca', icon: '🏦' },
    { id: 'results', label: 'Resultados', icon: '📊' },
    { id: 'saved', label: 'Guardadas', icon: '💾' },
  ];

  const progress = useMemo(() => {
    let done = 0, total = 0;
    const check = (v) => { total++; if (v) done++; };
    check(state.buyers.length > 0);
    state.buyers.forEach(b => { check(b.monthlyNetSalary > 0); check(b.birthDate); });
    check(state.buyers.some(b => computeLiquidSavings(b.savings) > 0));
    check(state.property.price > 0);
    check(state.mortgage.tin >= 0 && state.mortgage.termYears > 0);
    check(result.computableIncome > 0);
    return Math.round((done / total) * 100);
  }, [state, result]);

  return (
    <div className="min-h-screen flex flex-col lg:flex-row">
      <aside className="lg:w-72 lg:fixed lg:inset-y-0 bg-white dark:bg-slate-900 border-b lg:border-b-0 lg:border-r border-slate-200 dark:border-slate-800 overflow-y-auto">
        <div className="p-5 border-b border-slate-200 dark:border-slate-800">
          <div className="flex items-center gap-2">
            <div className="w-9 h-9 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold">V</div>
            <div>
              <div className="font-bold text-slate-900 dark:text-white text-sm">Viabilidad Hipotecaria</div>
              <div className="text-xs text-slate-500">Simulador España</div>
            </div>
          </div>
        </div>
        <nav className="p-3 space-y-1">
          {tabs.map(t => (
            <div key={t.id}
              className={"flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium cursor-pointer transition " + (tab === t.id ? 'bg-brand-50 dark:bg-brand-900/40 text-brand-700 dark:text-brand-200' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800')}
              onClick={() => setTab(t.id)}>
              <span>{t.icon}</span><span>{t.label}</span>
            </div>
          ))}
        </nav>
        <div className="p-5 border-t border-slate-200 dark:border-slate-800">
          <div className="flex items-center justify-between text-xs text-slate-500 mb-2">
            <span>Progreso</span><span className="font-semibold">{progress}%</span>
          </div>
          <div className="w-full h-2 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
            <div className="h-full bg-brand-600 transition-all" style={{ width: progress + '%' }}></div>
          </div>
          <button className="mt-4 w-full px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-sm font-medium" onClick={() => setDark(!dark)}>
            {dark ? '☀️ Modo claro' : '🌙 Modo oscuro'}
          </button>
          <p className="text-xs text-slate-400 mt-3 text-center">💡 Pasa el cursor sobre las etiquetas subrayadas para ver ayuda</p>
        </div>
      </aside>
      <main className="lg:ml-72 flex-1 p-4 md:p-8 max-w-6xl mx-auto w-full">
        {showAviso && (
          <Card className="p-4 mb-6 border-l-4 border-amber-400 bg-amber-50/50 dark:bg-amber-900/10">
            <div className="flex items-start gap-3">
              <div className="text-xl">ℹ️</div>
              <div className="flex-1 text-sm text-slate-700 dark:text-slate-300">
                <strong>Aviso:</strong> herramienta orientativa. No constituye asesoramiento financiero ni fiscal. Verifica tipos y condiciones con profesionales.
              </div>
              <button className="text-slate-400 hover:text-slate-600" onClick={() => setShowAviso(false)}>×</button>
            </div>
          </Card>
        )}
        {tab === 'buyers' && <BuyersSection buyers={state.buyers} setBuyers={v => setState({ ...state, buyers: v })} />}
        {tab === 'savings' && <SavingsSection buyers={state.buyers} setBuyers={v => setState({ ...state, buyers: typeof v === 'function' ? v(state.buyers) : v })} />}
        {tab === 'properties' && <PropertiesSection buyers={state.buyers} setBuyers={v => setState({ ...state, buyers: typeof v === 'function' ? v(state.buyers) : v })} duplicateDebts={result.duplicateDebts} onRemoveDuplicateDebt={removeDuplicateDebt} />}
        {tab === 'debts' && <DebtsSection debts={state.debts} setDebts={v => setState({ ...state, debts: v })} monthlyExpenses={state.monthlyExpenses} setMonthlyExpenses={v => setState({ ...state, monthlyExpenses: v })} />}
        {tab === 'property' && <PropertySection property={state.property} setProperty={v => setState({ ...state, property: v })} tax={state.tax} setTax={v => setState({ ...state, tax: v })} />}
        {tab === 'mortgage' && <MortgageSection mortgage={state.mortgage} setMortgage={v => setState({ ...state, mortgage: v })} property={state.property} amortizations={result.amortizations} />}
        {tab === 'results' && <ResultsSection state={state} result={result} maxPrice={maxPrice} setState={setState} />}
        {tab === 'saved' && <SavedSection state={state} setState={setState} list={list} setList={setList} />}
        <footer className="mt-12 pt-6 border-t border-slate-200 dark:border-slate-800 text-xs text-slate-500">
          <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-2">
            <span>Simulador de Viabilidad Hipotecaria · Datos solo en tu navegador.</span>
            <button className="hover:text-brand-600" onClick={() => { if (confirm('¿Resetear todo?')) { localStorage.clear(); setState(INITIAL_STATE); setList({}); } }}>Resetear</button>
          </div>
        </footer>
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
