<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;

/* ---------- FORMATEO ---------- */
const fmtEur = (n) => (n==null||isNaN(n)) ? '—' : new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
const fmtEur2 = (n) => (n==null||isNaN(n)) ? '—' : new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const fmtPct = (n,d=1) => (n==null||isNaN(n)) ? '—' : new Intl.NumberFormat('es-ES',{style:'percent',minimumFractionDigits:d,maximumFractionDigits:d}).format(n);

/* ---------- MOTOR FINANCIERO ---------- */
const monthlyPayment = (principal, annualRatePct, months) => {
  if (months <= 0 || principal <= 0) return 0;
  const r = annualRatePct / 100 / 12;
  if (r === 0) return principal / months;
  const f = Math.pow(1 + r, months);
  return (principal * r * f) / (f - 1);
};

const amortizationSchedule = (principal, annualRatePct, months) => {
  const payment = monthlyPayment(principal, annualRatePct, months);
  const r = annualRatePct / 100 / 12;
  let balance = principal;
  const rows = [];
  for (let m = 1; m <= months; m++) {
    const interest = balance * r;
    const principalPart = Math.min(payment - interest, balance);
    balance = Math.max(0, balance - principalPart);
    rows.push({ month: m, payment, interest, principal: principalPart, balance });
  }
  return rows;
};

const totalInterest = (rows) => rows.reduce((s, r) => s + r.interest, 0);

/* Amortización parcial: aplica N € al capital pendiente tras X meses */
const amortizePartial = (schedule, month, amount) => {
  if (!amount || month <= 0 || month > schedule.length) return schedule;
  const newSchedule = [];
  let applied = false;
  for (let i = 0; i < schedule.length; i++) {
    const row = { ...schedule[i] };
    if (!applied && row.month === month) {
      const newBal = Math.max(0, row.balance - amount);
      row.principal = row.principal + (row.balance - newBal);
      row.balance = newBal;
      applied = true;
    }
    newSchedule.push(row);
  }
  return newSchedule;
};

/* ITP por CCAA — tipo GENERAL vivienda segunda mano */
const ITP_BY_REGION = {
  'Andalucía': 7, 'Aragón': 8, 'Asturias': 8, 'Baleares': 8, 'Canarias': 6.5,
  'Cantabria': 10, 'Castilla-La Mancha': 9, 'Castilla y León': 8, 'Cataluña': 10,
  'Extremadura': 8, 'Galicia': 8, 'La Rioja': 7, 'Madrid': 6, 'Murcia': 8,
  'Navarra': 6, 'País Vasco': 4, 'Comunidad Valenciana': 9, 'Ceuta': 6, 'Melilla': 6
};
const REGIONS = Object.keys(ITP_BY_REGION);

const computeAcquisitionCosts = (params) => {
  const { price, isNew, region, itpPct, ivaPct, ajdPct, notary, registry, appraisal, gestoria, agencyFee, otherCosts, useManual } = params;
  const itp = !isNew ? price * (useManual ? itpPct : (ITP_BY_REGION[region] ?? 8)) / 100 : 0;
  const iva = isNew ? price * (useManual ? ivaPct : 10) / 100 : 0;
  const ajd = isNew ? price * (useManual ? ajdPct : 1.5) / 100 : 0;
  const fixed = (notary||0)+(registry||0)+(appraisal||0)+(gestoria||0);
  const agency = agencyFee || 0;
  const other = otherCosts || 0;
  return { itp, iva, ajd, fixed, agency, other, total: itp+iva+ajd+fixed+agency+other };
};

const computeComputableIncome = (buyers) => buyers.reduce((sum, b) => {
  const salary = (b.monthlyNetSalary||0) * ((b.computablePct?.salary ?? 100)/100);
  const variable = (b.variableIncome||0) * ((b.computablePct?.variable ?? 80)/100);
  const rental = (b.rentalIncome||0) * ((b.computablePct?.rental ?? 80)/100);
  const other = (b.otherIncome||0) * ((b.computablePct?.other ?? 100)/100);
  return sum + salary + variable + rental + other;
}, 0);

const computeRawIncome = (buyers) => buyers.reduce((s, b) =>
  s + (b.monthlyNetSalary||0) + (b.variableIncome||0) + (b.rentalIncome||0) + (b.otherIncome||0), 0);

const computeLiquidSavings = (s) => {
  if (!s) return 0;
  let total = (s.cash||0)+(s.deposits||0)+(s.funds||0)+(s.stocks||0)+(s.crypto||0)+(s.otherLiquid||0);
  if (s.pensionAvailable) total += (s.pensionPlans||0);
  return total;
};
const computeTotalPatrimony = (s) => {
  if (!s) return 0;
  return (s.cash||0)+(s.deposits||0)+(s.funds||0)+(s.stocks||0)+(s.crypto||0)+(s.pensionPlans||0)+(s.otherLiquid||0)+(s.otherIlliquid||0);
};

const aggregateSavings = (buyers) => {
  const keys = ['cash','deposits','funds','stocks','crypto','pensionPlans','otherLiquid','otherIlliquid','willingToUse','emergencyReserve'];
  const agg = {};
  keys.forEach(k => { agg[k] = buyers.reduce((s, b) => s + (Number(b.savings?.[k]) || 0), 0); });
  agg.pensionAvailable = buyers.some(b => b.savings?.pensionAvailable);
  return agg;
};

/* ---------- INMUEBLES EN PROPIEDAD ---------- */
const summarizeProperties = (buyers) => {
  const all = [];
  buyers.forEach(b => (b.properties || []).forEach(p => all.push({ ...p, ownerId: b.id, ownerName: b.name })));

  const totalMarketValue = all.reduce((s, p) => s + (Number(p.marketValue)||0), 0);
  const totalMortgageOutstanding = all.reduce((s, p) => s + (Number(p.mortgageOutstanding)||0), 0);
  const totalNetEquity = all.reduce((s, p) => s + Math.max(0, (Number(p.marketValue)||0) - (Number(p.mortgageOutstanding)||0)), 0);

  const collaterals = all.filter(p => p.usedAsCollateral);
  const totalCollateralValue = collaterals.reduce((s, p) => s + (Number(p.collateralValue)||0), 0);

  const toSellBefore = all.filter(p => p.planToSell === 'sell_before');
  const liquidFromSalesBefore = toSellBefore.reduce((s, p) => {
    const price = Number(p.sellPrice) || Number(p.marketValue) || 0;
    const costs = (Number(p.sellCosts)||0) + (Number(p.sellTaxes)||0);
    const netPayoff = Math.max(0, price - costs - (Number(p.mortgageOutstanding)||0));
    return s + netPayoff;
  }, 0);

  const toSellAfter = all.filter(p => p.planToSell === 'sell_after');
  const netFromSalesAfter = toSellAfter.reduce((s, p) => {
    const price = Number(p.sellPrice) || Number(p.marketValue) || 0;
    const costs = (Number(p.sellCosts)||0) + (Number(p.sellTaxes)||0);
    const netPayoff = Math.max(0, price - costs - (Number(p.mortgageOutstanding)||0));
    return s + netPayoff;
  }, 0);
  const partialAmortizationMonth = toSellAfter.length > 0
    ? Math.max(...toSellAfter.map(p => Number(p.sellMonth) || 24))
    : 0;

  const keptProperties = all.filter(p => p.planToSell === 'keep');
  const rentalNetMonthly = keptProperties.reduce((s, p) => s + (Number(p.netRentalIncome)||0), 0);

  return {
    all, totalMarketValue, totalMortgageOutstanding, totalNetEquity,
    collaterals, totalCollateralValue,
    toSellBefore, liquidFromSalesBefore,
    toSellAfter, netFromSalesAfter, partialAmortizationMonth,
    keptProperties, rentalNetMonthly
  };
};

const computeDebtTotal = (debts) => debts.reduce((s, d) => s + (d.monthlyPayment||0), 0);
const computeMonthlyExpenses = (e) => Object.values(e).reduce((s, v) => s + (Number(v)||0), 0);

const ageAtMaturity = (birthDateISO, termYears) => {
  if (!birthDateISO) return null;
  const birth = new Date(birthDateISO);
  if (isNaN(birth.getTime())) return null;
  const ageNow = (Date.now() - birth.getTime()) / (365.25 * 24 * 3600 * 1000);
  return ageNow + termYears;
};

const evaluateOperation = (state, override = {}) => {
  const price = override.price ?? state.property.price;
  const termYears = override.termYears ?? state.mortgage.termYears;
  const tin = override.tin ?? state.mortgage.tin;
  const { buyers, debts, monthlyExpenses, mortgage: m, tax, property } = state;
  const savings = aggregateSavings(buyers);
  const props = summarizeProperties(buyers);

  const months = termYears * 12;
  const downPaymentPct = override.downPaymentPct ?? m.downPaymentPct;
  const maxLtv = override.maxLtv ?? m.maxLtv;

  const acq = computeAcquisitionCosts({
    price, isNew: property.isNew, region: property.region,
    itpPct: tax.itpPct, ivaPct: tax.ivaPct, ajdPct: tax.ajdPct,
    notary: tax.notary, registry: tax.registry, appraisal: tax.appraisal, gestoria: tax.gestoria,
    agencyFee: property.agencyFee, otherCosts: property.otherInitialCosts,
    useManual: tax.mode === 'manual'
  });

  const reforms = property.reforms || 0;
  const furniture = property.furniture || 0;
  const anexos = (property.garagePrice||0) + (property.storagePrice||0);
  const totalPrice = price + anexos;

  const maxMortgageByLtv = totalPrice * (maxLtv / 100);
  const desiredMortgage = totalPrice * (1 - downPaymentPct / 100);
  const mortgageAmount = Math.max(0, Math.min(desiredMortgage, maxMortgageByLtv));

  const openingFee = mortgageAmount * (m.openingFeePct || 0) / 100;
  const linkedAnnual = m.linkedProductsAnnual || 0;

  const liquidSavings = computeLiquidSavings(savings);
  const willingToUse = savings.willingToUse;
  const baseAvailable = (willingToUse > 0) ? Math.min(liquidSavings, willingToUse) : liquidSavings;
  const available = baseAvailable + props.liquidFromSalesBefore;

  const totalNeeded = totalPrice - mortgageAmount + acq.total + reforms + furniture + openingFee + (savings.emergencyReserve || 0);
  const liquidityGap = totalNeeded - available;

  const basePayment = monthlyPayment(mortgageAmount, tin, months);
  let schedule = amortizationSchedule(mortgageAmount, tin, months);
  if (props.netFromSalesAfter > 0 && props.partialAmortizationMonth > 0) {
    schedule = amortizePartial(schedule, props.partialAmortizationMonth, props.netFromSalesAfter);
  }
  const interestTotal = totalInterest(schedule);
  const payment = basePayment;

  const computableIncome = computeComputableIncome(buyers);
  const rawIncome = computeRawIncome(buyers);
  const existingDebt = computeDebtTotal(debts);
  const monthlyExpensesTotal = computeMonthlyExpenses(monthlyExpenses);

  const ratioBefore = computableIncome > 0 ? existingDebt / computableIncome : 0;
  const totalDebtAfter = existingDebt + payment;
  const ratioAfter = computableIncome > 0 ? totalDebtAfter / computableIncome : 0;
  const monthlyMargin = computableIncome - totalDebtAfter - monthlyExpensesTotal - (linkedAnnual/12) + props.rentalNetMonthly;

  const maxAge = m.maxAgeAtMaturity || 75;
  const agesAtMat = buyers.map(b => ageAtMaturity(b.birthDate, termYears)).filter(x => x !== null);
  const ageOk = agesAtMat.length === 0 || agesAtMat.every(a => a <= maxAge);
  const maxAgeReached = agesAtMat.length ? Math.max(...agesAtMat) : null;

  const threshold = m.debtThreshold ?? 0.35;
  const ratioOk = ratioAfter <= threshold;
  const liquidityOk = liquidityGap <= 0;
  const ltvOk = mortgageAmount <= maxMortgageByLtv + 0.01;
  const allOk = ratioOk && liquidityOk && ltvOk && ageOk;

  const totalCollateralCoverage = totalPrice + props.totalCollateralValue;
  const collateralCoverageRatio = mortgageAmount > 0 ? totalCollateralCoverage / mortgageAmount : 0;

  const reasons = [];
  if (!ratioOk) reasons.push(`Ratio de endeudamiento ${fmtPct(ratioAfter)} > umbral ${fmtPct(threshold)}`);
  if (!liquidityOk) reasons.push(`Faltan ${fmtEur(-liquidityGap)} para cubrir gastos`);
  if (!ltvOk) reasons.push(`LTV supera el máximo del ${maxLtv}%`);
  if (!ageOk) reasons.push(`Edad al vencimiento ${maxAgeReached ? maxAgeReached.toFixed(1) : '?'} años > ${maxAge}`);

  let verdict, verdictLabel, verdictColor;
  if (!computableIncome || !price) {
    verdict='insufficient'; verdictLabel='Datos insuficientes'; verdictColor='slate';
  } else if (allOk && monthlyMargin > computableIncome * 0.10) {
    verdict='viable'; verdictLabel='Viable según criterios configurados'; verdictColor='emerald';
  } else if (allOk) {
    verdict='conditional'; verdictLabel='Viable con margen reducido'; verdictColor='amber';
  } else if (ratioOk && !liquidityOk) {
    verdict='conditional'; verdictLabel='Viable si se resuelve la liquidez'; verdictColor='amber';
  } else {
    verdict='not_viable'; verdictLabel='No viable con los datos actuales'; verdictColor='red';
  }

  return {
    price, totalPrice, anexos, mortgageAmount, downPayment: totalPrice - mortgageAmount,
    acq, reforms, furniture, openingFee, totalNeeded, available, liquidityGap, liquidSavings,
    baseAvailable, liquidFromSalesBefore: props.liquidFromSalesBefore,
    payment, schedule, interestTotal, months, tin, maxLtv,
    computableIncome, rawIncome, existingDebt, monthlyExpenses: monthlyExpensesTotal, totalDebtAfter,
    ratioBefore, ratioAfter, monthlyMargin, threshold, linkedAnnual,
    ageOk, maxAgeReached, maxAge, ratioOk, liquidityOk, ltvOk, allOk,
    verdict, verdictLabel, verdictColor, reasons,
    ltv: totalPrice > 0 ? mortgageAmount / totalPrice : 0,
    aggregateSavings: savings,
    properties: props,
    netFromSalesAfter: props.netFromSalesAfter,
    partialAmortizationMonth: props.partialAmortizationMonth,
    totalCollateralCoverage, collateralCoverageRatio
  };
};

const computeMaxPrice = (state, binding) => {
  const evaluate = (p) => {
    if (p <= 0) return false;
    const r = evaluateOperation(state, { price: p });
    if (binding === 'savings') return r.liquidityGap <= 0;
    if (binding === 'income') return r.ratioAfter <= r.threshold;
    if (binding === 'ltv') return r.ltv <= r.maxLtv / 100 + 0.0001;
    if (binding === 'age') return r.ageOk;
    return r.allOk;
  };
  if (!evaluate(10000)) return 0;
  let lo = 10000, hi = 5000000;
  if (evaluate(hi)) return hi;
  while (hi - lo > 500) {
    const mid = (lo + hi) / 2;
    if (evaluate(mid)) lo = mid; else hi = mid;
  }
  return Math.floor(lo);
};

/* ---------- ESTADO INICIAL ---------- */
const emptySavings = () => ({
  cash: 0, deposits: 0, funds: 0, stocks: 0, crypto: 0,
  pensionPlans: 0, otherLiquid: 0, otherIlliquid: 0,

  willingCustom: false

const defaultBuyer = (i) => ({

  savings: { ...emptySavings(), cash: i === 0 ? 40000 : 0, willingToUse: i === 0 ? 40000 : 0, emergencyReserve: i === 0 ? 8000 : 0 },

const INITIAL_STATE = {
  simName: 'Mi simulación',
  buyers: [defaultBuyer(0)],
  debts: [],
  monthlyExpenses: { food: 400, utilities: 150, transport: 150, education: 0, insurance: 80, children: 0, otherHome: 0, other: 100 },

};

const LS_KEY = 'simulador_hipoteca_v3';

/* =========================================================

========================================================= */
const inputCls = "w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition text-sm";
const labelCls = "block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1";
const helpCls = "text-xs text-slate-500 dark:text-slate-400 mt-1";

const LabelWithTooltip = ({ label, tooltip }) => {
  const [show, setShow] = useState(false);
  const [pos, setPos] = useState({ top: 0, left: 0, placement: 'top' });
  const ref = useRef(null);
  const handleEnter = () => {
    if (!ref.current) return;
    const rect = ref.current.getBoundingClientRect();
    const placement = (rect.top < 180) ? 'bottom' : 'top';
    setPos({
      top: placement === 'top' ? rect.top - 8 : rect.bottom + 8,
      left: Math.min(rect.left + rect.width / 2, window.innerWidth - 160),
      placement
    });
    setShow(true);
  };
  return (
    <>
      <label className={labelCls}>
        <span ref={ref}
          className="inline-flex items-center gap-1 cursor-help border-b border-dotted border-slate-400 dark:border-slate-500"
          onMouseEnter={handleEnter} onMouseLeave={() => setShow(false)}
          onFocus={handleEnter} onBlur={() => setShow(false)} tabIndex={0}>
          {label}
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" className="w-3.5 h-3.5 text-slate-400 inline-block">
            <path fillRule="evenodd" d="M18 10A8 8 0 1 1 2 10a8 8 0 0 1 16 0Zm-7-4a1 1 0 1 1-2 0 1 1 0 0 1 2 0ZM9 9a.75.75 0 0 0 0 1.5h.253a.25.25 0 0 1 .244.304l-.459 2.066A1.75 1.75 0 0 0 10.747 15H11a.75.75 0 0 0 0-1.5h-.253a.25.25 0 0 1-.244-.304l.459-2.066A1.75 1.75 0 0 0 9.253 9H9Z" clipRule="evenodd" />
          </svg>
        </span>
      </label>
      {show && tooltip && (
        <div className="fixed z-50 max-w-xs px-3 py-2 text-xs rounded-lg bg-slate-900 dark:bg-slate-700 text-white shadow-xl pointer-events-none"
          style={{ top: pos.top, left: pos.left, transform: pos.placement === 'top' ? 'translate(-50%, -100%)' : 'translate(-50%, 0)' }}>
          {tooltip}
          <div className={"absolute left-1/2 -translate-x-1/2 w-2 h-2 rotate-45 bg-slate-900 dark:bg-slate-700 " + (pos.placement === 'top' ? '-bottom-1' : '-top-1')} />
        </div>
      )}
    </>
  );
};

const NumberField = ({ label, value, onChange, help, tooltip, suffix, min, max, step=1, placeholder }) => (
  <div>
    {label && <LabelWithTooltip label={label} tooltip={tooltip} />}
    <div className="relative">

        onChange={e => onChange(e.target.value === '' ? '' : Number(e.target.value))} />
      {suffix && <span className="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-400 pointer-events-none">{suffix}</span>}
    </div>

);

const Toggle = ({ label, checked, onChange, tooltip }) => {
  const [show, setShow] = useState(false);
  const [pos, setPos] = useState({ top: 0, left: 0, placement: 'top' });
  const ref = useRef(null);
  const handleEnter = () => {
    if (!ref.current) return;
    const rect = ref.current.getBoundingClientRect();
    const placement = (rect.top < 180) ? 'bottom' : 'top';
    setPos({ top: placement === 'top' ? rect.top - 8 : rect.bottom + 8, left: Math.min(rect.left + rect.width / 2, window.innerWidth - 160), placement });
    setShow(true);
  };
  return (
    <label className="flex items-center gap-3 cursor-pointer select-none" ref={ref}
      onMouseEnter={handleEnter} onMouseLeave={() => setShow(false)}>
      <span className={"relative w-10 h-6 rounded-full transition " + (checked ? 'bg-brand-600' : 'bg-slate-300 dark:bg-slate-700')}>
        <span className={"absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform " + (checked ? 'translate-x-4' : '')}></span>
      </span>
      <span className="text-sm font-medium text-slate-700 dark:text-slate-300 border-b border-dotted border-slate-400 dark:border-slate-500">
        {label}
      </span>
      {show && tooltip && (

const DonutChart = ({ data, colors, size=200 }) => {
  const total = data.reduce((s, d) => s + Math.max(0, d.value), 0);
  if (total <= 0) return <div className="text-sm text-slate-500 p-4">Sin datos</div>;
  const cx = size/2, cy = size/2;
  const R = size/2 - 10, r = R * 0.55;
  let angle = -Math.PI/2;
  const slices = data.map((d, i) => {
    const val = Math.max(0, d.value);
    const frac = val / total;
    const a0 = angle, a1 = angle + frac * Math.PI * 2;
    angle = a1;
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0);
    const x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    const xi1 = cx + r * Math.cos(a1), yi1 = cy + r * Math.sin(a1);
    const xi0 = cx + r * Math.cos(a0), yi0 = cy + r * Math.sin(a0);
    const path = `M ${x0} ${y0} A ${R} ${R} 0 ${large} 1 ${x1} ${y1} L ${xi1} ${yi1} A ${r} ${r} 0 ${large} 0 ${xi0} ${yi0} Z`;
    return { path, color: colors[i % colors.length], name: d.name, value: val, frac };
  });
  return (
    <div>
      <svg viewBox={`0 0 ${size} ${size}`} width="100%" style={{maxWidth: size}}>
        {slices.map((s, i) => <path key={i} d={s.path} fill={s.color} stroke="white" strokeWidth="1" />)}
      </svg>
      <div className="mt-3 space-y-1">
        {slices.map((s, i) => (
          <div key={i} className="flex items-center justify-between text-xs">
            <div className="flex items-center gap-2">
              <span className="w-3 h-3 rounded-sm" style={{background: s.color}}></span>
              <span>{s.name}</span>
            </div>
            <span className="font-medium">{fmtEur(s.value)} · {fmtPct(s.frac, 0)}</span>
          </div>
        ))}
      </div>
    </div>
  );
};

const AreaChartSVG = ({ data, height=240, amortizationEvent }) => {
  const W = 600, H = height, P = { t: 20, r: 20, b: 30, l: 80 };
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const maxY = Math.max(...data.map(d => d.balance), 1);
  const x = i => P.l + (i / Math.max(1, data.length - 1)) * iw;
  const y = v => P.t + ih - (v / maxY) * ih;
  const path = data.map((d, i) => `${i===0?'M':'L'} ${x(i)} ${y(d.balance)}`).join(' ');
  const area = `${path} L ${x(data.length-1)} ${P.t+ih} L ${x(0)} ${P.t+ih} Z`;
  const ticks = 4;
  const eventYear = amortizationEvent ? Math.ceil(amortizationEvent / 12) : null;
  const eventIdx = eventYear ? data.findIndex(d => d.year === eventYear) : -1;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{height}}>
      {[...Array(ticks+1)].map((_, i) => {
        const v = (maxY / ticks) * i; const yy = y(v);
        return (
          <g key={i}>
            <line x1={P.l} x2={W-P.r} y1={yy} y2={yy} stroke="#e2e8f0" strokeDasharray="3 3" />
            <text x={P.l-6} y={yy+4} fontSize="10" fill="#94a3b8" textAnchor="end">{fmtEur(v)}</text>
          </g>
        );
      })}
      <path d={area} fill="#c7d2fe" opacity="0.6" />
      <path d={path} fill="none" stroke="#4f46e5" strokeWidth="2" />
      {eventIdx >= 0 && (
        <g>
          <line x1={x(eventIdx)} x2={x(eventIdx)} y1={P.t} y2={P.t+ih} stroke="#f59e0b" strokeWidth="2" strokeDasharray="4 4" />
          <text x={x(eventIdx)} y={P.t - 5} fontSize="10" fill="#f59e0b" textAnchor="middle">Amort. venta</text>
        </g>
      )}
      {[0, Math.floor(data.length/2), data.length-1].map((i, k) => (
        <text key={k} x={x(i)} y={H-10} fontSize="10" fill="#94a3b8" textAnchor="middle">Año {data[i]?.year}</text>
      ))}
    </svg>
  );
};

const StackedBarChart = ({ data, height=260 }) => {
  const W = 600, H = height, P = { t: 20, r: 20, b: 30, l: 80 };
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const totals = data.map(d => d.interest + d.principal);
  const maxY = Math.max(...totals, 1);
  const bw = iw / data.length * 0.75;
  const y = v => P.t + ih - (v / maxY) * ih;
  const ticks = 4;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{height}}>
      {[...Array(ticks+1)].map((_, i) => {
        const v = (maxY / ticks) * i; const yy = y(v);
        return (
          <g key={i}>
            <line x1={P.l} x2={W-P.r} y1={yy} y2={yy} stroke="#e2e8f0" strokeDasharray="3 3" />
            <text x={P.l-6} y={yy+4} fontSize="10" fill="#94a3b8" textAnchor="end">{fmtEur(v)}</text>
          </g>
        );
      })}
      {data.map((d, i) => {
        const cx = P.l + (i + 0.5) * (iw / data.length);
        const hInt = (d.interest / maxY) * ih;
        const hPrin = (d.principal / maxY) * ih;
        const yInt = P.t + ih - hPrin;
        const yPrin = P.t + ih - hPrin - hInt;
        return (
          <g key={i}>
            <rect x={cx - bw/2} y={yInt} width={bw} height={hPrin} fill="#10b981" />
            <rect x={cx - bw/2} y={yPrin} width={bw} height={hInt} fill="#ef4444" />
          </g>
        );
      })}
      {data.filter((_,i) => i % Math.ceil(data.length/6) === 0 || i === data.length-1).map((d, k) => {
        const i = data.indexOf(d);
        const cx = P.l + (i + 0.5) * (iw / data.length);
        return <text key={k} x={cx} y={H-10} fontSize="10" fill="#94a3b8" textAnchor="middle">{d.year}</text>;
      })}
      <g transform={`translate(${P.l}, 4)`}>
        <rect x="0" y="0" width="10" height="10" fill="#10b981"/><text x="14" y="9" fontSize="10" fill="#64748b">Capital</text>
        <rect x="70" y="0" width="10" height="10" fill="#ef4444"/><text x="84" y="9" fontSize="10" fill="#64748b">Intereses</text>
      </g>
    </svg>
  );
};

                          { value: 'sell_before', label: 'Vender ANTES de la compra' },

                        {p.planToSell === 'sell_after' && (
                          <NumberField label="Mes de venta" tooltip="Mes (desde la firma de la nueva hipoteca) en que prevés vender y amortizar." value={p.sellMonth} onChange={v => updateProperty(b.id, p.id, { sellMonth: v })} suffix="mes" min={1} max={480} />
                        )}
                      </div>
                    )}

                    <div className="mt-3 grid grid-cols-2 md:grid-cols-3 gap-3 text-xs">
                      <div className="rounded-lg bg-slate-50 dark:bg-slate-800/50 p-2">
                        <div className="text-slate-500">Patrimonio neto</div>
                        <div className="font-semibold text-slate-800 dark:text-slate-200">{fmtEur(netEquity)}</div>
                      </div>
                      {p.usedAsCollateral && (
                        <div className="rounded-lg bg-brand-50 dark:bg-brand-900/20 p-2">
                          <div className="text-brand-700 dark:text-brand-300">Garantía aportada</div>
                          <div className="font-semibold text-brand-700 dark:text-brand-300">{fmtEur(p.collateralValue)}</div>
                        </div>
                      )}
                      {(p.planToSell === 'sell_before' || p.planToSell === 'sell_after') && (
                        <div className="rounded-lg bg-emerald-50 dark:bg-emerald-900/20 p-2">
                          <div className="text-emerald-700 dark:text-emerald-300">Neto de venta</div>
                          <div className="font-semibold text-emerald-700 dark:text-emerald-300">{fmtEur(netSaleAfter)}</div>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </Card>
      ))}

      <Card className="p-5 mt-6 bg-amber-50/50 dark:bg-amber-900/10 border-amber-200 dark:border-amber-800">
        <div className="text-xs text-amber-800 dark:text-amber-200">
          <strong>⚠️ Nota:</strong> la aceptación de un inmueble como garantía adicional (pignoración o segunda hipoteca) depende de cada banco. No todos lo ofrecen, y el valor computado suele ser inferior (60%–70%) al de tasación. Confirma con tu entidad antes de contar con ello.
        </div>
      </Card>
    </div>
  );
};

const DebtsSection = ({ debts, setDebts, monthlyExpenses, setMonthlyExpenses }) => {
  const add = () => setDebts([...debts, { id: 'd' + Math.random().toString(36).slice(2,7), type: 'personal', outstanding: 0, monthlyPayment: 0, cancelCost: 0, cancelable: false }]);
  const update = (id, patch) => setDebts(debts.map(d => d.id === id ? { ...d, ...patch } : d));
  const remove = (id) => setDebts(debts.filter(d => d.id !== id));
  const ue = (k, v) => setMonthlyExpenses({ ...monthlyExpenses, [k]: v });
  const typeLabels = { hipoteca:'Hipoteca', personal:'Préstamo personal', vehiculo:'Vehículo', tarjeta:'Tarjeta de crédito', financiacion:'Financiación', otro:'Otra' };
  return (
    <div>
      <h2 className="text-xl font-semibold text-slate-900 dark:text-white mb-1">Deudas y gastos mensuales</h2>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-6">Las deudas afectan al ratio de endeudamiento; los gastos, al presupuesto familiar.</p>
      <Card className="p-5 mb-6">
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-semibold text-slate-900 dark:text-white">Deudas</h3>
          <button className="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium" onClick={add}>+ Añadir</button>
        </div>
        {debts.length === 0 ? <p className="text-sm text-slate-500">Sin deudas registradas.</p> : (
          <div className="space-y-3">
            {debts.map(d => (
              <div key={d.id} className="grid grid-cols-1 md:grid-cols-6 gap-3 items-end border-t border-slate-100 dark:border-slate-800 pt-3 first:border-0 first:pt-0">
                <SelectField label="Tipo" tooltip="Los bancos revisan CIRBE. Toda deuda declarada afecta al ratio." value={d.type} onChange={v => update(d.id, { type: v })} options={Object.entries(typeLabels).map(([value,label]) => ({ value, label }))} />
                <NumberField label="Capital" tooltip="Capital pendiente. Si la cancelas, se descuenta del disponible." value={d.outstanding} onChange={v => update(d.id, { outstanding: v })} suffix="€" min={0} />
                <NumberField label="Cuota" tooltip="Cuota mensual actual. Se suma a la nueva hipoteca para el ratio." value={d.monthlyPayment} onChange={v => update(d.id, { monthlyPayment: v })} suffix="€/mes" min={0} />
                <NumberField label="Coste cancelar" tooltip="Comisión + intereses si cancelas anticipadamente. Aplica solo si marcas Cancelable." value={d.cancelCost} onChange={v => update(d.id, { cancelCost: v })} suffix="€" min={0} />
                <div className="flex items-center h-full pb-2">
                  <Toggle label="Cancelable" tooltip="Marca si esta deuda se cancela antes de la compra." checked={d.cancelable} onChange={v => update(d.id, { cancelable: v })} />

                <button className="px-3 py-2 rounded-lg bg-red-50 hover:bg-red-100 text-red-600 text-sm dark:bg-red-900/30 dark:text-red-300" onClick={() => remove(d.id)}>×</button>
              </div>
            ))}
          </div>

      </Card>
      <Card className="p-5">
        <h3 className="font-semibold text-slate-900 dark:text-white mb-4">Gastos familiares mensuales</h3>
        <p className="text-xs text-slate-500 dark:text-slate-400 mb-4">No computan en el ratio bancario, pero sí en tu presupuesto real disponible.</p>

          <NumberField label="Alimentación" tooltip="Supermercado y comida fuera de casa." value={monthlyExpenses.food} onChange={v => ue('food', v)} suffix="€" min={0} />
          <NumberField label="Suministros" tooltip="Luz, agua, gas, internet y telefonía." value={monthlyExpenses.utilities} onChange={v => ue('utilities', v)} suffix="€" min={0} />
          <NumberField label="Transporte" tooltip="Combustible, transporte público, seguro y mantenimiento del coche." value={monthlyExpenses.transport} onChange={v => ue('transport', v)} suffix="€" min={0} />
          <NumberField label="Educación" tooltip="Colegios, universidad, material, clases, extraescolares." value={monthlyExpenses.education} onChange={v => ue('education', v)} suffix="€" min={0} />
          <NumberField label="Seguros" tooltip="Seguros no vinculados a la vivienda nueva (vida, coche, salud)." value={monthlyExpenses.insurance} onChange={v => ue('insurance', v)} suffix="€" min={0} />
          <NumberField label="Hijos" tooltip="Gastos específicos de hijos no cubiertos en otras categorías." value={monthlyExpenses.children} onChange={v => ue('children', v)} suffix="€" min={0} />
          <NumberField label="Otras viviendas" tooltip="Gastos de propiedades existentes (comunidad, IBI, mantenimiento)." value={monthlyExpenses.otherHome} onChange={v => ue('otherHome', v)} suffix="€" min={0} />
          <NumberField label="Otros gastos" tooltip="Ocio, suscripciones, imprevistos medios." value={monthlyExpenses.other} onChange={v => ue('other', v)} suffix="€" min={0} />

      </Card>

  );
};

  return (
    <div>
      <h2 className="text-xl font-semibold text-slate-900 dark:text-white mb-1">Inmueble a comprar</h2>

          <NumberField label="Otros gastos iniciales" tooltip="Mudanza, suministros, arreglos iniciales." value={property.otherInitialCosts} onChange={v => u('otherInitialCosts', v)} suffix="€" min={0} />
        </div>
        <div className="mt-4 p-3 rounded-lg bg-brand-50 dark:bg-brand-900/20 text-sm">
          <strong>Precio total (vivienda + anexos):</strong> {fmtEur(totalPrice)}

      <Card className="p-5">

          <h3 className="font-semibold text-slate-900 dark:text-white">Impuestos y gastos de adquisición</h3>
          <div className="flex gap-2">
            <button className={"px-3 py-1.5 rounded-lg text-xs font-medium " + (tax.mode==='auto'?'bg-brand-600 text-white':'bg-slate-100 dark:bg-slate-800')} onClick={() => ut('mode', 'auto')}>Automático</button>

const MortgageSection = ({ mortgage, setMortgage, property }) => {
  const u = (k, v) => setMortgage({ ...mortgage, [k]: v });
  const totalPrice = (property.price||0) + (property.garagePrice||0) + (property.storagePrice||0);
  const mortgageAmount = totalPrice * (1 - mortgage.downPaymentPct / 100);
  const payment = monthlyPayment(mortgageAmount, mortgage.tin, mortgage.termYears * 12);
  return (
    <div>
      <h2 className="text-xl font-semibold text-slate-900 dark:text-white mb-1">Hipoteca y financiación</h2>

        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
          <NumberField label="Entrada (%)" tooltip="Porcentaje aportado de tu bolsillo. El banco financia el resto hasta el LTV máximo. Habitual 20%." value={mortgage.downPaymentPct} onChange={v => u('downPaymentPct', v)} suffix="%" min={0} max={100} step={1} help={`≈ ${fmtEur(totalPrice * mortgage.downPaymentPct / 100)}`} />
          <NumberField label="Plazo (años)" tooltip="Duración. Más plazo = cuota menor pero más intereses y mayor edad al vencimiento. Habitual 25–30 años." value={mortgage.termYears} onChange={v => u('termYears', v)} min={1} max={40} suffix="años" />
          <SelectField label="Tipo de interés" tooltip="Fijo: TIN constante. Variable: Euríbor + diferencial revisable. Mixto: tramo fijo + variable." value={mortgage.type} onChange={v => u('type', v)} options={[{ value: 'fijo', label: 'Fijo' }, { value: 'variable', label: 'Variable' }, { value: 'mixto', label: 'Mixto' }]} />
          <NumberField label="TIN anual" tooltip="Tipo de Interés Nominal anual. En fijo el pactado; en variable el vigente actual." value={mortgage.tin} onChange={v => u('tin', v)} suffix="%" min={0} max={20} step={0.05} />
          <NumberField label="Comisión apertura" tooltip="Comisión del banco al formalizar. Habitual 0%–1%." value={mortgage.openingFeePct} onChange={v => u('openingFeePct', v)} suffix="%" min={0} max={5} step={0.1} />
          <NumberField label="Productos vinculados (anual)" tooltip="Coste anual de seguros/tarjetas para aplicar la bonificación." value={mortgage.linkedProductsAnnual} onChange={v => u('linkedProductsAnnual', v)} suffix="€" min={0} />
        </div>
        {mortgage.type !== 'fijo' && (

            <NumberField label="Revisión" tooltip="Frecuencia de revisión. Habitual 12 meses." value={mortgage.revisionMonths} onChange={v => u('revisionMonths', v)} suffix="meses" min={1} max={60} />
          </div>
        )}
        {mortgage.type === 'mixto' && (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4 pt-4 border-t border-slate-100 dark:border-slate-800">
            <NumberField label="Años tramo fijo" tooltip="Años iniciales a tipo fijo. Habitual 5–10 años." value={mortgage.fixedYears} onChange={v => u('fixedYears', v)} suffix="años" min={1} max={30} />
            <NumberField label="TIN posterior" tooltip="Tipo tras el tramo fijo. Euríbor + diferencial." value={mortgage.postFixedTin} onChange={v => u('postFixedTin', v)} suffix="%" min={0} max={20} step={0.05} />
          </div>
        )}

      <Card className="p-5 mb-6">
        <h3 className="font-semibold text-slate-900 dark:text-white mb-4">Criterios del banco (editables)</h3>

const Row = ({ label, value, bold, color }) => (

const BuyersBreakdown = ({ buyers }) => {
  const COLORS = ['#6366f1', '#10b981', '#f59e0b', '#ef4444'];
  const totalLiquid = buyers.reduce((s, b) => s + computeLiquidSavings(b.savings), 0);
  const totalPatrimony = buyers.reduce((s, b) => s + computeTotalPatrimony(b.savings), 0);
  const totalWilling = buyers.reduce((s, b) => s + (Number(b.savings.willingToUse) || 0), 0);
  const totalIncome = buyers.reduce((s, b) =>
    s + (b.monthlyNetSalary||0) + (b.variableIncome||0) + (b.rentalIncome||0) + (b.otherIncome||0), 0);
  const totalProps = buyers.reduce((s, b) => s + (b.properties||[]).reduce((s2, p) => s2 + Math.max(0, (Number(p.marketValue)||0) - (Number(p.mortgageOutstanding)||0)), 0), 0);
  const totalCollateral = buyers.reduce((s, b) => s + (b.properties||[]).reduce((s2, p) => s2 + (p.usedAsCollateral ? Number(p.collateralValue)||0 : 0), 0), 0);

  return (
    <div className="space-y-4">
      <Card className="p-5">
        <h4 className="font-semibold mb-4">Aportación por comprador</h4>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b border-slate-200 dark:border-slate-800 text-left">
                <th className="py-2 pr-3 font-medium text-slate-600 dark:text-slate-400">Comprador</th>
                <th className="py-2 pr-3 font-medium text-slate-600 dark:text-slate-400 text-right">Ingresos/mes</th>
                <th className="py-2 pr-3 font-medium text-slate-600 dark:text-slate-400 text-right">Líquido</th>
                <th className="py-2 pr-3 font-medium text-slate-600 dark:text-slate-400 text-right">Patrimonio neto</th>
                <th className="py-2 pr-3 font-medium text-slate-600 dark:text-slate-400 text-right">Garantía</th>
                <th className="py-2 pr-3 font-medium text-slate-600 dark:text-slate-400 text-right">Aporta</th>
                <th className="py-2 pr-3 font-medium text-slate-600 dark:text-slate-400 text-right">% del total</th>
              </tr>
            </thead>
            <tbody>
              {buyers.map((b, i) => {
                const liquid = computeLiquidSavings(b.savings);
                const patrimony = computeTotalPatrimony(b.savings);
                const propsNet = (b.properties||[]).reduce((s, p) => s + Math.max(0, (Number(p.marketValue)||0) - (Number(p.mortgageOutstanding)||0)), 0);
                const collateral = (b.properties||[]).reduce((s, p) => s + (p.usedAsCollateral ? Number(p.collateralValue)||0 : 0), 0);
                const willing = Number(b.savings.willingToUse) || 0;
                const income = (b.monthlyNetSalary||0) + (b.variableIncome||0) + (b.rentalIncome||0) + (b.otherIncome||0);
                const pct = totalWilling > 0 ? willing / totalWilling : 0;
                return (
                  <tr key={b.id} className="border-b border-slate-100 dark:border-slate-800">
                    <td className="py-2 pr-3">
                      <div className="flex items-center gap-2">
                        <span className="w-2.5 h-2.5 rounded-full" style={{background: COLORS[i % COLORS.length]}}></span>
                        <span className="font-medium">{b.name}</span>
                      </div>
                    </td>
                    <td className="py-2 pr-3 text-right">{fmtEur(income)}</td>
                    <td className="py-2 pr-3 text-right">{fmtEur(liquid)}</td>
                    <td className="py-2 pr-3 text-right">{fmtEur(patrimony + propsNet)}</td>
                    <td className="py-2 pr-3 text-right text-brand-600 dark:text-brand-400">{collateral > 0 ? fmtEur(collateral) : '—'}</td>
                    <td className="py-2 pr-3 text-right font-semibold text-brand-600 dark:text-brand-400">{fmtEur(willing)}</td>
                    <td className="py-2 pr-3 text-right">{fmtPct(pct, 0)}</td>
                  </tr>
                );
              })}
              <tr className="font-bold border-t-2 border-slate-300 dark:border-slate-700">
                <td className="py-2 pr-3">TOTAL</td>
                <td className="py-2 pr-3 text-right">{fmtEur(totalIncome)}</td>
                <td className="py-2 pr-3 text-right">{fmtEur(totalLiquid)}</td>
                <td className="py-2 pr-3 text-right">{fmtEur(totalPatrimony + totalProps)}</td>
                <td className="py-2 pr-3 text-right text-brand-600 dark:text-brand-400">{totalCollateral > 0 ? fmtEur(totalCollateral) : '—'}</td>
                <td className="py-2 pr-3 text-right text-brand-600 dark:text-brand-400">{fmtEur(totalWilling)}</td>
                <td className="py-2 pr-3 text-right">100%</td>
              </tr>
            </tbody>
          </table>
        </div>
      </Card>

      {buyers.length > 1 && totalWilling > 0 && (
        <Card className="p-5">
          <h4 className="font-semibold mb-3">Reparto de la aportación</h4>
          <DonutChart
            data={buyers.map((b) => ({ name: b.name, value: Number(b.savings.willingToUse) || 0 }))}
            colors={COLORS}
          />
        </Card>
      )}
    </div>
  );
};

const StressTab = ({ state }) => {
  const [rateShock, setRateShock] = useState(0);
  const [incomeDrop, setIncomeDrop] = useState(0);
  const [expenseUp, setExpenseUp] = useState(0);
  const base = useMemo(() => evaluateOperation(state), [state]);
  const stressed = useMemo(() => {
    const s = JSON.parse(JSON.stringify(state));
    s.mortgage.tin = state.mortgage.tin + rateShock;
    if (s.mortgage.type === 'mixto') s.mortgage.postFixedTin = state.mortgage.postFixedTin + rateShock;
    s.buyers = s.buyers.map(b => ({ ...b, monthlyNetSalary: b.monthlyNetSalary * (1 - incomeDrop/100), variableIncome: b.variableIncome * (1 - incomeDrop/100), otherIncome: b.otherIncome * (1 - incomeDrop/100) }));
    s.monthlyExpenses = Object.fromEntries(Object.entries(s.monthlyExpenses).map(([k,v]) => [k, v * (1 + expenseUp/100)]));
    return evaluateOperation(s);
  }, [state, rateShock, incomeDrop, expenseUp]);
  const comp = [
    { label: 'Cuota base', value: base.payment, color: '#6366f1', display: fmtEur2(base.payment) },
    { label: 'Cuota estresada', value: stressed.payment, color: '#ef4444', display: fmtEur2(stressed.payment) },
    { label: 'Margen base', value: Math.max(0, base.monthlyMargin), color: '#10b981', display: fmtEur(base.monthlyMargin) },
    { label: 'Margen estresado', value: Math.max(0, stressed.monthlyMargin), color: '#f59e0b', display: fmtEur(stressed.monthlyMargin) },
  ];
  const ratioComp = [
    { label: 'Ratio base', value: base.ratioAfter * 100, color: '#6366f1', display: fmtPct(base.ratioAfter) },
    { label: 'Ratio estresado', value: stressed.ratioAfter * 100, color: '#ef4444', display: fmtPct(stressed.ratioAfter) },
    { label: 'Umbral', value: base.threshold * 100, color: '#94a3b8', display: fmtPct(base.threshold) },
  ];
  return (
    <div className="space-y-4">
      <Card className="p-5">
        <h4 className="font-semibold mb-4">Pruebas de resistencia</h4>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div>
            <label className={labelCls}>Subida tipos: +{rateShock.toFixed(2)} pp</label>
            <input type="range" min={0} max={3} step={0.25} value={rateShock} onChange={e => setRateShock(Number(e.target.value))} className="w-full" />
          </div>
          <div>
            <label className={labelCls}>Caída ingresos: −{incomeDrop}%</label>
            <input type="range" min={0} max={50} step={5} value={incomeDrop} onChange={e => setIncomeDrop(Number(e.target.value))} className="w-full" />
          </div>
          <div>
            <label className={labelCls}>Subida gastos: +{expenseUp}%</label>
            <input type="range" min={0} max={50} step={5} value={expenseUp} onChange={e => setExpenseUp(Number(e.target.value))} className="w-full" />
          </div>
        </div>
      </Card>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
        <KPI label="Cuota estresada" value={fmtEur2(stressed.payment)} sub={`Base: ${fmtEur2(base.payment)}`} />
        <KPI label="Ratio estresado" value={fmtPct(stressed.ratioAfter)} color={stressed.ratioOk ? 'emerald' : 'red'} sub={`Umbral ${fmtPct(stressed.threshold)}`} />
        <KPI label="Margen estresado" value={fmtEur(stressed.monthlyMargin)} color={stressed.monthlyMargin > 0 ? 'emerald' : 'red'} sub={`Base: ${fmtEur(base.monthlyMargin)}`} />
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <Card className="p-5">
          <h4 className="font-semibold mb-3">Cuota y margen</h4>
          <HBarChart data={comp} />
        </Card>
        <Card className="p-5">
          <h4 className="font-semibold mb-3">Ratios de endeudamiento</h4>
          <HBarChart data={ratioComp} />
        </Card>
      </div>
      <Card className={"p-5 border-2 " + (stressed.allOk ? 'border-emerald-300' : 'border-red-300')}>
        <strong>Resultado estresado: {stressed.verdictLabel}</strong>
        {stressed.reasons.length > 0 && (
          <ul className="mt-2 text-sm list-disc list-inside">
            {stressed.reasons.map((r,i) => <li key={i}>{r}</li>)}
          </ul>
        )}
      </Card>
    </div>
  );
};

          <Card className="p-5">
            <h4 className="font-semibold mb-3">Desglose de gastos de compra</h4>
            <div className="space-y-2 text-sm">
              <Row label="Precio vivienda" value={result.price} />
              <Row label="Anexos (garaje/trastero)" value={result.anexos} />
              <Row label="ITP" value={result.acq.itp} />
              <Row label="IVA" value={result.acq.iva} />
              <Row label="AJD" value={result.acq.ajd} />
              <Row label="Notaría + Registro + Tasación + Gestoría" value={result.acq.fixed} />
              <Row label="Comisión inmobiliaria" value={result.acq.agency} />
              <Row label="Reformas + Mobiliario" value={(result.reforms||0)+(result.furniture||0)} />
              <Row label="Apertura hipoteca" value={result.openingFee} />
              <Row label="Reserva de emergencia" value={state.buyers.reduce((s,b) => s + (Number(b.savings.emergencyReserve)||0), 0)} />
              <Row label="Total necesario" value={result.totalNeeded} bold />
              <Row label="Disponible (líquido)" value={result.baseAvailable} />
              {result.liquidFromSalesBefore > 0 && <Row label="+ Ventas antes" value={result.liquidFromSalesBefore} />}
              <Row label="Disponible total" value={result.available} bold />
              <Row label="Déficit / Excedente" value={-result.liquidityGap} bold color={result.liquidityGap <= 0 ? 'emerald' : 'red'} />
            </div>
          </Card>
          <Card className="p-5">
            <h4 className="font-semibold mb-3">Composición de gastos</h4>
            <DonutChart data={costPie} colors={COLORS} size={220} />
          </Card>
        </div>
      )}
      {tab === 'amort' && (
        <div className="space-y-4">
          <Card className="p-5">
            <h4 className="font-semibold mb-3">Evolución del capital pendiente</h4>
            <AreaChartSVG data={yearlyData} amortizationEvent={result.partialAmortizationMonth > 0 ? result.partialAmortizationMonth : undefined} />
            {result.netFromSalesAfter > 0 && (
              <p className="text-xs text-amber-600 dark:text-amber-400 mt-2">⤷ Marca naranja: amortización parcial por venta en el mes {result.partialAmortizationMonth} ({fmtEur(result.netFromSalesAfter)}).</p>
            )}
          </Card>
          <Card className="p-5">
            <h4 className="font-semibold mb-3">Intereses vs. capital por año</h4>
            <StackedBarChart data={yearlyData} />
          </Card>
          <Card className="p-5 text-sm">
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              <div><div className="text-xs uppercase text-slate-500">Cuota</div><div className="font-bold">{fmtEur2(result.payment)}</div></div>
              <div><div className="text-xs uppercase text-slate-500">Intereses totales</div><div className="font-bold">{fmtEur(result.interestTotal)}</div></div>
              <div><div className="text-xs uppercase text-slate-500">Coste total hipoteca</div><div className="font-bold">{fmtEur(result.mortgageAmount + result.interestTotal)}</div></div>
              <div><div className="text-xs uppercase text-slate-500">Plazo</div><div className="font-bold">{state.mortgage.termYears} años</div></div>
            </div>
          </Card>
        </div>
      )}
      {tab === 'maxprice' && (
        <Card className="p-5">
          <h4 className="font-semibold mb-4">Precio máximo por tipo de restricción</h4>
          <HBarChart data={maxPriceBars} />
          <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mt-6">
            <KPI label="Ahorros" value={fmtEur(maxPrice.savings)} />
            <KPI label="Ingresos" value={fmtEur(maxPrice.income)} />
            <KPI label="LTV máximo" value={fmtEur(maxPrice.ltv)} />
            <KPI label="Edad / plazo" value={fmtEur(maxPrice.age)} />
            <KPI label="Conjunto" value={fmtEur(maxPrice.all)} color="brand" />
          </div>
          <p className={helpCls + " mt-4"}>El precio máximo conjunto se calcula con búsqueda binaria sobre una función que verifica simultáneamente todas las restricciones.</p>
        </Card>
      )}
      {tab === 'stress' && <StressTab state={state} />}
    </div>
  );
};

/* ---------- GUARDADAS ---------- */
const SavedSection = ({ state, setState, list, setList }) => {
  const [name, setName] = useState('');
  const fileRef = useRef();
  const save = () => {
    const n = name.trim() || 'Simulación ' + new Date().toLocaleString('es-ES');
    const id = 'sim_' + Date.now();
    const newList = { ...list, [id]: { id, name: n, savedAt: new Date().toISOString(), state: { ...state, simName: n } } };
    setList(newList);
    localStorage.setItem(LS_LIST, JSON.stringify(newList));
    setName('');
    alert('Simulación guardada: ' + n);
  };
  const load = (id) => {
    const s = list[id];
    if (!s) return;
    if (!confirm(`¿Cargar "${s.name}"?`)) return;
    setState({ ...INITIAL_STATE, ...s.state });
  };
  const del = (id) => {
    if (!confirm('¿Eliminar?')) return;
    const n = { ...list };
    delete n[id];
    setList(n);
    localStorage.setItem(LS_LIST, JSON.stringify(n));
  };
  const exportJson = (id) => {
    const data = id ? list[id] : { current: state, saved: list };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `simulacion-hipoteca-${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  const importJson = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.saved) {
          const merged = { ...list, ...data.saved };
          setList(merged);
          localStorage.setItem(LS_LIST, JSON.stringify(merged));
          alert('Importadas ' + Object.keys(data.saved).length + ' simulaciones.');
        } else if (data.current) {
          setState({ ...INITIAL_STATE, ...data.current });
          alert('Simulación cargada.');
        } else alert('Formato desconocido.');
      } catch (err) { alert('Error: ' + err.message); }
    };
    reader.readAsText(file);
  };
  return (
    <div>
      <h2 className="text-xl font-semibold text-slate-900 dark:text-white mb-1">Simulaciones guardadas</h2>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-6">Todo se guarda en tu navegador (localStorage).</p>
      <Card className="p-5 mb-6">
        <div className="flex flex-col md:flex-row gap-3">
          <input className={inputCls + " flex-1"} placeholder="Nombre" value={name} onChange={e => setName(e.target.value)} />
          <button className="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium" onClick={save}>Guardar actual</button>
          <button className="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-sm font-medium" onClick={() => exportJson(null)}>Exportar todo</button>
          <button className="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-sm font-medium" onClick={() => fileRef.current.click()}>Importar JSON</button>
          <input ref={fileRef} type="file" accept=".json" hidden onChange={importJson} />
        </div>
      </Card>
      {Object.keys(list).length === 0 ? (
        <p className="text-sm text-slate-500">No hay simulaciones guardadas.</p>
      ) : (
        <div className="space-y-3">
          {Object.values(list).sort((a,b) => b.savedAt.localeCompare(a.savedAt)).map(s => (
            <Card key={s.id} className="p-4 flex flex-col md:flex-row md:items-center gap-3">
              <div className="flex-1">
                <div className="font-semibold">{s.name}</div>
                <div className="text-xs text-slate-500">{new Date(s.savedAt).toLocaleString('es-ES')} · Precio {fmtEur(s.state.property?.price || 0)}</div>
              </div>
              <div className="flex gap-2">
                <button className="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-sm" onClick={() => load(s.id)}>Cargar</button>
                <button className="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-sm" onClick={() => exportJson(s.id)}>Exportar</button>
                <button className="px-3 py-1.5 rounded-lg bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-300 text-sm" onClick={() => del(s.id)}>Eliminar</button>
              </div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
};

/* ---------- APP ---------- */
function App() {
  const [state, setState] = useState(loadCurrent);
  const [tab, setTab] = useState('buyers');
  const [dark, setDark] = useState(false);
  const [list, setList] = useState(loadList);
  const [showAviso, setShowAviso] = useState(true);

  useEffect(() => { localStorage.setItem(LS_KEY, JSON.stringify(state)); }, [state]);
  useEffect(() => { document.documentElement.classList.toggle('dark', dark); }, [dark]);

  useEffect(() => {
    setState(prev => {
      let changed = false;
      const newBuyers = prev.buyers.map(b => {
        if (b.savings.willingCustom) return b;
        const liquid = computeLiquidSavings(b.savings);
        if (liquid !== b.savings.willingToUse) {
          changed = true;
          return { ...b, savings: { ...b.savings, willingToUse: liquid } };
        }
        return b;
      });
      if (!changed) return prev;
      return { ...prev, buyers: newBuyers };
    });
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [
    JSON.stringify(state.buyers.map(b => ({
      id: b.id,
      cash: b.savings.cash,
      deposits: b.savings.deposits,
      funds: b.savings.funds,
      stocks: b.savings.stocks,
      crypto: b.savings.crypto,
      otherLiquid: b.savings.otherLiquid,
      pensionPlans: b.savings.pensionPlans,
      pensionAvailable: b.savings.pensionAvailable,
    })))
  ]);

  const result = useMemo(() => evaluateOperation(state), [state]);
  const maxPrice = useMemo(() => ({
    savings: computeMaxPrice(state, 'savings'),
    income: computeMaxPrice(state, 'income'),
    ltv: computeMaxPrice(state, 'ltv'),
    age: computeMaxPrice(state, 'age'),
    all: computeMaxPrice(state, 'all'),
  }), [state]);

  const tabs = [
    { id: 'buyers', label: 'Compradores', icon: '👥' },
    { id: 'savings', label: 'Ahorros', icon: '💰' },
    { id: 'properties', label: 'Inmuebles en propiedad', icon: '🏘️' },
    { id: 'debts', label: 'Deudas y gastos', icon: '📋' },
    { id: 'property', label: 'Inmueble a comprar', icon: '🏠' },
    { id: 'mortgage', label: 'Hipoteca', icon: '🏦' },
    { id: 'results', label: 'Resultados', icon: '📊' },
    { id: 'saved', label: 'Guardadas', icon: '💾' },
  ];

  const progress = useMemo(() => {
    let done = 0, total = 0;
    const check = (v) => { total++; if (v) done++; };
    check(state.buyers.length > 0);
    state.buyers.forEach(b => { check(b.monthlyNetSalary > 0); check(b.birthDate); });
    check(state.buyers.some(b => computeLiquidSavings(b.savings) > 0));
    check(state.property.price > 0);
    check(state.mortgage.tin >= 0 && state.mortgage.termYears > 0);
    check(result.computableIncome > 0);
    return Math.round((done / total) * 100);
  }, [state, result]);

  return (
    <div className="min-h-screen flex flex-col lg:flex-row">
      <aside className="lg:w-72 lg:fixed lg:inset-y-0 bg-white dark:bg-slate-900 border-b lg:border-b-0 lg:border-r border-slate-200 dark:border-slate-800 overflow-y-auto">
        <div className="p-5 border-b border-slate-200 dark:border-slate-800">
          <div className="flex items-center gap-2">
            <div className="w-9 h-9 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold">V</div>
            <div>
              <div className="font-bold text-slate-900 dark:text-white text-sm">Viabilidad Hipotecaria</div>
              <div className="text-xs text-slate-500">Simulador España</div>
            </div>
          </div>
        </div>
        <nav className="p-3 space-y-1">
          {tabs.map(t => (
            <div key={t.id}
              className={"flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium cursor-pointer transition " + (tab === t.id ? 'bg-brand-50 dark:bg-brand-900/40 text-brand-700 dark:text-brand-200' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800')}
              onClick={() => setTab(t.id)}>
              <span>{t.icon}</span><span>{t.label}</span>
            </div>
          ))}
        </nav>
        <div className="p-5 border-t border-slate-200 dark:border-slate-800">
          <div className="flex items-center justify-between text-xs text-slate-500 mb-2">
            <span>Progreso</span><span className="font-semibold">{progress}%</span>
          </div>
          <div className="w-full h-2 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
            <div className="h-full bg-brand-600 transition-all" style={{ width: progress + '%' }}></div>
          </div>
          <button className="mt-4 w-full px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-sm font-medium" onClick={() => setDark(!dark)}>
            {dark ? '☀️ Modo claro' : '🌙 Modo oscuro'}
          </button>
          <p className="text-xs text-slate-400 mt-3 text-center">💡 Pasa el cursor sobre las etiquetas subrayadas para ver ayuda</p>
        </div>
      </aside>
      <main className="lg:ml-72 flex-1 p-4 md:p-8 max-w-6xl mx-auto w-full">
        {showAviso && (
          <Card className="p-4 mb-6 border-l-4 border-amber-400 bg-amber-50/50 dark:bg-amber-900/10">
            <div className="flex items-start gap-3">
              <div className="text-xl">ℹ️</div>
              <div className="flex-1 text-sm text-slate-700 dark:text-slate-300">
                <strong>Aviso:</strong> herramienta orientativa. No constituye asesoramiento financiero ni fiscal. Verifica tipos y condiciones con profesionales.
              </div>
              <button className="text-slate-400 hover:text-slate-600" onClick={() => setShowAviso(false)}>×</button>
            </div>
          </Card>
        )}
        {tab === 'buyers' && <BuyersSection buyers={state.buyers} setBuyers={v => setState({ ...state, buyers: v })} />}
        {tab === 'savings' && <SavingsSection buyers={state.buyers} setBuyers={v => setState({ ...state, buyers: typeof v === 'function' ? v(state.buyers) : v })} />}
        {tab === 'properties' && <PropertiesSection buyers={state.buyers} setBuyers={v => setState({ ...state, buyers: typeof v === 'function' ? v(state.buyers) : v })} />}
        {tab === 'debts' && <DebtsSection debts={state.debts} setDebts={v => setState({ ...state, debts: v })} monthlyExpenses={state.monthlyExpenses} setMonthlyExpenses={v => setState({ ...state, monthlyExpenses: v })} />}
        {tab === 'property' && <PropertySection property={state.property} setProperty={v => setState({ ...state, property: v })} tax={state.tax} setTax={v => setState({ ...state, tax: v })} />}
        {tab === 'mortgage' && <MortgageSection mortgage={state.mortgage} setMortgage={v => setState({ ...state, mortgage: v })} property={state.property} />}
        {tab === 'results' && <ResultsSection state={state} result={result} maxPrice={maxPrice} />}
        {tab === 'saved' && <SavedSection state={state} setState={setState} list={list} setList={setList} />}
        <footer className="mt-12 pt-6 border-t border-slate-200 dark:border-slate-800 text-xs text-slate-500">
          <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-2">
            <span>Simulador de Viabilidad Hipotecaria · Datos solo en tu navegador.</span>
            <button className="hover:text-brand-600" onClick={() => { if (confirm('¿Resetear todo?')) { localStorage.clear(); setState(INITIAL_STATE); setList({}); } }}>Resetear</button>
          </div>
        </footer>
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
